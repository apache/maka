# Reference: https://github.com/apache/infrastructure-asfyaml

github:
  description: >-
    Apache Maka (Incubating) is a high-performance agent workspace that keeps a complete record of everything it did.
  labels:
    - ai
    - ai-agent
    - agent-runtime
    - local-first
    - llm
    - tool-use
    - event-sourcing
    - rust
    - tui
    - cli
    - apache
    - incubator
    - maka
  features:
    issues: true
    wiki: false
    projects: false
    discussions: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  pull_requests:
    del_branch_on_merge: true
  dependabot_alerts: true
  protected_branches:
    main:
      required_pull_request_reviews:
        # GitHub dismisses approvals on any new commit but never dismisses a
        # requested change, so leaving this on makes the two halves of a review
        # decay at different rates: a rebase costs the author a whole new
        # approval round while an unresolved objection survives untouched.
        # The head-bound guarantee lives in required_status_checks instead,
        # which reruns test against every pushed head.
        dismiss_stale_reviews: false
        required_approving_review_count: 1
      required_status_checks:
        strict: false
        # test always reports, including documentation-only changes. Keep path
        # selection inside CI; workflow-level paths filters leave this required
        # context pending and prevent merging documentation-only PRs.
        contexts:
          - test

  rulesets:
    - name: Immutable release tags
      type: tag
      branches:
        includes:
          - "v*"
        excludes: []
      restrict_deletion: true
      restrict_force_push: true

  environments:
    npm-publication:
      required_reviewers: []
      wait_timer: 0
      prevent_self_review: false
      deployment_branch_policy:
        protected_branches: false
        policies:
          - name: main
            type: branch

notifications:
  commits: commits@maka.apache.org
  discussions: dev@maka.apache.org
  issues: commits@maka.apache.org
  pullrequests: commits@maka.apache.org
