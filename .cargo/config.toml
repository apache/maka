# Match the official rusty_v8 Windows archive and avoid a second CRT at runtime.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Keep debug information in retained objects instead of packing V8's duplicate
# archive member names into a dSYM.
# Swift runtime dependencies are transitive; every final executable needs this rpath.
[target.'cfg(target_os = "macos")']
rustflags = [
    "-C", "split-debuginfo=unpacked",
    "-C", "link-arg=-Wl,-rpath,/usr/lib/swift",
]

# Inherited wrappers such as kache repack these debug maps using relative object
# paths, producing missing-object warnings and unusable symbols. Let Cargo and
# rustc own incremental artifacts for this workspace.
[build]
rustc-wrapper = ""

# Disable SQLite's global MEMSTATUS allocator mutex at compile time so
# concurrent WAL readers and the writer do not serialize on sqlite3Malloc
# without relying on a racy runtime sqlite3_config() call.
[env]
LIBSQLITE3_FLAGS = "SQLITE_DEFAULT_MEMSTATUS=0"

# MXC's release build otherwise enables Required ETW diagnostics independently
# of the per-request telemetry preference. Use the SDK's unrouted build.
MXC_TELEMETRY_COMPONENT_PATH = { value = "", force = true }
MXC_TELEMETRY_TEST_KEYWORDS = { value = "", force = true }
