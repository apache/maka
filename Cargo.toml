[workspace]
exclude = ["third-party/gpui-fast", "third-party/async-io", "third-party/sqlx-sqlite", "third-party/image-webp"]
default-members = ["products/maka/cli"]
members = [
    "plugins/agent/facts",
    "platform/packages",
    "plugins/agent/ports",
    "platform/capabilities",
    "products/maka/native",
    "plugins/interactions/native",
    "plugins/agent/acp-executor/native",
    "plugins/skills/native",
    "plugins/workspace/workspace-jev/native",
    "plugins/workspace/workspace-processes/native",
    "plugins/workspace/workspace-files/native",
    "plugins/workspace/support",
    "third-party/gpui-kit/crates/base",
    "third-party/gpui-kit/crates/shell",
    "third-party/gpui-kit/crates/shell/rquickjs-compat",
    "products/maka/acp",
    "plugins/agent/engine",
    "plugins/agent/native",
    "plugins/workspace/workspace-files/patch",
    "plugins/agent/assistant",
    "platform/transport",
    "platform/background-health",
    "products/maka/cli",
    "plugins/settings/store",
    "products/maka/desktop",
    "platform/computer-use",
    "platform/event-log",
    "plugins/agent/acp-executor/engine",
    "plugins/workspace/workspace-files/engine",
    "plugins/agent/goal",
    "plugins/agent/graph",
    "plugins/agent/insights",
    "plugins/workspace/workspace-jev/engine",
    "platform/js-runtime",
    "plugins/agent/model",
    "platform/network",
    "platform/plugin-core",
    "platform/presentation",
    "platform/process",
    "plugins/agent/providers",
    "plugins/agent/responses",
    "platform/host-runtime",
    "platform/host-js",
    "platform/sandbox",
    "plugins/agent/scheduler/engine",
    "plugins/settings/native",
    "plugins/agent/session-import",
    "plugins/agent/session-recap",
    "plugins/agent/session-title",
    "plugins/skills/core",
    "plugins/agent/tool-catalog",
    "plugins/agent/tools",
    "platform/render-terminal",
    "platform/ui-runtime",
    "platform/ui-js",
    "platform/render-gpui",
    "plugins/workspace/workspace-web/native",
    "plugins/workspace/workspace-computer/native",
    "plugins/workhub/core",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
hex = "0.4.3"
maka-ui-authoring = { path = "plugins/application/authoring/native" }
maka-agent-facts = { path = "plugins/agent/facts" }
maka-packages = { path = "platform/packages" }
maka-agent-ports = { path = "plugins/agent/ports" }
maka-capabilities = { path = "platform/capabilities" }
maka-product-native = { path = "products/maka/native" }
maka-interactions-native = { path = "plugins/interactions/native" }
maka-acp-native = { path = "plugins/agent/acp-executor/native" }
maka-skills-native = { path = "plugins/skills/native" }
maka-jev-native = { path = "plugins/workspace/workspace-jev/native" }
maka-processes-native = { path = "plugins/workspace/workspace-processes/native" }
maka-files-native = { path = "plugins/workspace/workspace-files/native" }
maka-workspace-support = { path = "plugins/workspace/support" }
maka-schema = { path = "tools/schema" }
maka-interactions-api = { path = "plugins/interactions/api" }
maka-skills-api = { path = "plugins/skills/api" }
maka-computer-native = { path = "plugins/workspace/workspace-computer/native" }
maka-workspace-api = { path = "plugins/workspace/api" }
maka-agent-authority = { path = "plugins/agent/authority" }
maka-web-api = { path = "plugins/workspace/workspace-web/api" }
maka-agent-api = { path = "plugins/agent/api" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "c5f8eca4a0759f8c0c7ed624eddfd03f1c93a5f2", default-features = false, features = ["gpui-fast"] }
gpui-shell = { path = "third-party/gpui-kit/crates/shell", default-features = false, features = ["gpui-fast", "quickjs"] }
maka-transport = { path = "platform/transport" }
cua-driver-sdk = { git = "https://github.com/maka-agent/cua", rev = "79c9b58a1b61f66ae966635c464e54cb2c8151d6" }
cua-driver-contract = { git = "https://github.com/maka-agent/cua", rev = "79c9b58a1b61f66ae966635c464e54cb2c8151d6" }
agent-client-protocol = { version = "2.2.0", default-features = false, features = ["unstable_protocol_v2"] }
apply-patch = { path = "plugins/workspace/workspace-files/patch" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
deno_core = "=0.411.0"
deno_error = "0.7"
fastrand = "2"
futures-util = { version = "0.3", features = ["sink"] }
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "sha256"] }
imagesize = { version = "=0.15.0", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jsonschema = { version = "0.56.0", default-features = false }
libc = "0.2"
maka-acp = { path = "products/maka/acp" }
maka-agent-engine = { path = "plugins/agent/engine" }
maka-agent-native = { path = "plugins/agent/native" }
maka-assistant = { path = "plugins/agent/assistant" }
maka-background-health = { path = "platform/background-health" }
maka-config = { path = "plugins/settings/store" }
maka-computer-use = { path = "platform/computer-use" }
maka-event-log = { path = "platform/event-log" }
maka-external-agent = { path = "plugins/agent/acp-executor/engine" }
maka-fs-tools = { path = "plugins/workspace/workspace-files/engine" }
maka-goal = { path = "plugins/agent/goal" }
maka-graph = { path = "plugins/agent/graph" }
maka-insights = { path = "plugins/agent/insights" }
maka-jev = { path = "plugins/workspace/workspace-jev/engine" }
maka-js-runtime = { path = "platform/js-runtime" }
maka-model = { path = "plugins/agent/model" }
maka-network = { path = "platform/network" }
maka-plugin-core = { path = "platform/plugin-core" }
maka-presentation = { path = "platform/presentation" }
maka-process = { path = "platform/process" }
maka-providers = { path = "plugins/agent/providers" }
maka-responses = { path = "plugins/agent/responses" }
maka-host-runtime = { path = "platform/host-runtime" }
maka-host-js = { path = "platform/host-js" }
maka-sandbox = { path = "platform/sandbox" }
maka-scheduler = { path = "plugins/agent/scheduler/engine" }
maka-settings-native = { path = "plugins/settings/native" }
maka-session-import = { path = "plugins/agent/session-import" }
maka-session-recap = { path = "plugins/agent/session-recap" }
maka-session-title = { path = "plugins/agent/session-title" }
maka-skills = { path = "plugins/skills/core" }
maka-tool-catalog = { path = "plugins/agent/tool-catalog" }
maka-tools = { path = "plugins/agent/tools" }
maka-render-terminal = { path = "platform/render-terminal" }
maka-ui-runtime = { path = "platform/ui-runtime" }
maka-ui-js = { path = "platform/ui-js" }
maka-render-gpui = { path = "platform/render-gpui" }
maka-web = { path = "plugins/workspace/workspace-web/native" }
maka-workhub = { path = "plugins/workhub/core" }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "socks"] }
rusqlite = { version = "0.39", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "io-util"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
sys-locale = "0.3.2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
# Keep useful backtraces without embedding hundreds of MiB of dependency types.
debug = "line-tables-only"
# Favor fast development builds; reserve optimization for release builds.
opt-level = 0

[patch.crates-io]
image-webp = { path = "third-party/image-webp" }
sqlx-sqlite = { path = "third-party/sqlx-sqlite" }
async-io = { path = "third-party/async-io" }
# gpui-shell and LLRT share one quickjs-jit VM through this facade, as in gpui-kit.
rquickjs = { path = "third-party/gpui-kit/crates/shell/rquickjs-compat" }

gpui-fast = { path = "third-party/gpui-fast/crates/gpui" }
gpui-fast-macos = { path = "third-party/gpui-fast/crates/gpui_macos" }
gpui-fast-windows = { path = "third-party/gpui-fast/crates/gpui_windows" }
gpui-fast-linux = { path = "third-party/gpui-fast/crates/gpui_linux" }
gpui-pre-scheduler = { path = "third-party/gpui-fast/crates/scheduler" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-base = { path = "third-party/gpui-kit/crates/base" }
