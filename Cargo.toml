crossterm = { version = "0.29.0", features = ["event-stream"] }
deno_core = "=0.413.0"
# Deno Core fixes the shared error ABI to this exact release.
deno_error = "=0.7.1"
fastrand = "2.5.0"
futures-util = { version = "0.3.34", features = ["sink"] }
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "sha256"] }
imagesize = { version = "=0.15.0", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jsonschema = { version = "0.60.1", default-features = false }
libc = "0.2.191"
maka-acp = { path = "products/maka/acp" }
maka-agent-engine = { path = "plugins/agent/engine" }
maka-agent-native = { path = "plugins/agent/native" }
maka-assistant = { path = "plugins/agent/assistant" }
maka-background-health = { path = "platform/background-health" }
maka-config = { path = "plugins/settings/store" }
maka-computer-use = { path = "platform/computer-use", default-features = false }
maka-event-log = { path = "platform/event-log" }
maka-external-agent = { path = "plugins/agent/acp-executor/engine" }
maka-fs-tools = { path = "plugins/workspace/workspace-files/engine" }
maka-goal = { path = "plugins/agent/goal" }
maka-graph = { path = "plugins/agent/graph" }
maka-insights = { path = "plugins/agent/insights" }
maka-jev = { path = "plugins/workspace/workspace-jev/engine" }
maka-js-runtime = { path = "platform/js-runtime" }
maka-session-state = { path = "platform/session-state" }
maka-code-runtime = { path = "platform/code-runtime" }
maka-model = { path = "plugins/agent/model" }
maka-provider-protocol = { path = "plugins/agent/provider-protocol" }
maka-network = { path = "platform/network" }
maka-plugin-core = { path = "platform/plugin-core" }
maka-presentation = { path = "platform/presentation" }
maka-process = { path = "platform/process" }
maka-providers = { path = "plugins/agent/providers" }
maka-host-runtime = { path = "platform/host-runtime" }
maka-host-js = { path = "platform/host-js" }
maka-sandbox = { path = "platform/sandbox" }
maka-scheduler = { path = "plugins/agent/scheduler/engine" }
maka-settings-native = { path = "plugins/settings/native" }
maka-session-import = { path = "plugins/agent/session-import" }
maka-session-recap = { path = "plugins/agent/session-recap" }
maka-session-title = { path = "plugins/agent/session-title" }
maka-skills = { path = "plugins/skills/core" }
maka-tool-catalog = { path = "plugins/agent/tool-catalog" }
maka-tools = { path = "plugins/agent/tools" }
maka-terminal-shell = { path = "products/maka/terminal-shell" }
maka-ui-support = { path = "platform/ui-support" }
maka-web = { path = "plugins/workspace/workspace-web/native" }
maka-workbench = { path = "products/maka/workbench" }
maka-workhub = { path = "plugins/workhub/core" }
pulldown-cmark = { version = "0.13.5", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "socks"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "io-util"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
sys-locale = "0.3.2"
termina = { path = "third-party/termina" }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }

[profile.dev]
# Keep useful backtraces without embedding hundreds of MiB of dependency types.
debug = "line-tables-only"
# Keep application code quick to rebuild and straightforward to debug.
opt-level = 0

# Dependency workspaces' profiles are ignored here. Keep the VM and layout
# engines optimized, as NSH does in its own development builds.
[profile.dev.package.quickjs-jit-sys]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

# Include the concrete UI callers that instantiate generic engine/layout code.
# Level 1 keeps development builds lighter and allows shared monomorphizations.
[profile.dev.package.nsh-core]
opt-level = 1

[profile.dev.package.nsh-js]
opt-level = 1

[profile.dev.package.nsh-platform-tui]
opt-level = 1

[profile.dev.package.nsh-platform-gpui]
opt-level = 1

[profile.dev.package.gpui-fast]
opt-level = 1

[profile.dev.package.gpui-fast-wgpu]
opt-level = 1

# Keep Sixel colour quantization and its concrete generic writer optimized.
[profile.dev.package.quantette]
opt-level = 3

[profile.dev.package.icy_sixel]
opt-level = 3

[profile.dev.package.nsh-gpui-terminal]
opt-level = 3

[patch.crates-io]
nom = { git = "https://github.com/maka-agent/cua", rev = "e53bc79912458a038120fcf7c5b22d76d8301980" }
reqwest = { path = "third-party/reqwest" }
gix-index = { path = "third-party/gix-index" }
gix-discover = { path = "third-party/gix-discover" }
image-webp = { path = "third-party/image-webp" }
sqlx-sqlite = { path = "third-party/sqlx-sqlite" }
async-io = { path = "third-party/async-io" }

gpui-fast = { path = "third-party/gpui-fast/crates/gpui" }
gpui-fast-macos = { path = "third-party/gpui-fast/crates/gpui_macos" }
gpui-fast-windows = { path = "third-party/gpui-fast/crates/gpui_windows" }
gpui-fast-linux = { path = "third-party/gpui-fast/crates/gpui_linux" }
# The terminal backend owns the offscreen renderer and image codec.
gpui-fast-wgpu = { path = "third-party/nsh/third-party/gpui-wgpu" }
icy_sixel = { path = "third-party/nsh/third-party/icy_sixel" }
gpui-pre-scheduler = { path = "third-party/gpui-fast/crates/scheduler" }
