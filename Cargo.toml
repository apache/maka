[workspace]
exclude = ["third-party/nsh", "third-party/gpui-fast", "third-party/async-io", "third-party/gix-index", "third-party/gix-discover", "third-party/sqlx-sqlite", "third-party/image-webp", "third-party/termina"]
default-members = ["products/maka/cli", "platform/python-runtime"]
members = [
    "platform/session-state",
    "plugins/agent/facts",
    "platform/packages",
    "plugins/agent/ports",
    "platform/capabilities",
    "products/maka/native",
    "plugins/interactions/native",
    "plugins/agent/acp-executor/native",
    "plugins/skills/native",
    "plugins/workspace/workspace-jev/native",
    "plugins/workspace/workspace-processes/native",
    "plugins/workspace/workspace-files/native",
    "plugins/workspace/support",
    "products/maka/acp",
    "plugins/agent/engine",
    "plugins/agent/native",
    "plugins/workspace/workspace-files/patch",
    "plugins/agent/assistant",
    "platform/transport",
    "platform/background-health",
    "products/maka/cli",
    "plugins/settings/store",
    "products/maka/desktop-shell",
    "products/maka/client",
    "products/maka/terminal-shell",
    "products/maka/workbench",
    "platform/computer-use",
    "platform/event-log",
    "plugins/agent/acp-executor/engine",
    "plugins/workspace/workspace-files/engine",
    "plugins/agent/goal",
    "plugins/agent/graph",
    "plugins/agent/insights",
    "plugins/workspace/workspace-jev/engine",
    "platform/js-runtime",
    "platform/code-runtime",
    "platform/python-runtime",
    "plugins/agent/mcp",
    "plugins/agent/model",
    "plugins/agent/provider-protocol",
    "platform/network",
    "platform/plugin-core",
    "platform/presentation",
    "platform/process",
    "plugins/agent/providers",
    "platform/host-runtime",
    "platform/host-js",
    "platform/sandbox",
    "plugins/agent/scheduler/engine",
    "plugins/settings/native",
    "plugins/agent/session-import",
    "plugins/agent/session-recap",
    "plugins/agent/session-title",
    "plugins/skills/core",
    "plugins/agent/tool-catalog",
    "plugins/agent/tools",
    "platform/ui-support",
    "plugins/workspace/workspace-web/native",
    "plugins/workspace/workspace-computer/native",
    "plugins/workhub/core",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
mxc-sdk = { git = "https://github.com/microsoft/mxc", rev = "05a430bc17a3e1b3fa2131524fc52e4319e07298" }
flatbuffers = "25.12.19"
maka-python-runtime = { path = "platform/python-runtime" }
maka-mcp = { path = "plugins/agent/mcp" }
hex = "0.4.3"
maka-app-client = { path = "products/maka/client" }
nsh-core = { path = "third-party/nsh/crates/nsh-core" }
nsh-engine = { path = "third-party/nsh/crates/nsh-engine" }
nsh-js = { path = "third-party/nsh/crates/nsh-js" }
nsh-platform-tui = { path = "third-party/nsh/crates/nsh-platform-tui" }
nsh-platform-gpui = { path = "third-party/nsh/crates/gpui/nsh-platform-gpui", default-features = false, features = ["js"] }
nsh-gpui-terminal = { path = "third-party/nsh/crates/gpui/nsh-gpui-terminal" }
nsh-bundler = { path = "third-party/nsh/crates/nsh-bundler", default-features = false }
nsh-base = { path = "third-party/nsh/crates/nsh-base" }
maka-agent-facts = { path = "plugins/agent/facts" }
maka-packages = { path = "platform/packages" }
maka-agent-ports = { path = "plugins/agent/ports" }
