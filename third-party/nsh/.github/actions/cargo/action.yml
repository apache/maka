name: Cargo
description: >
  Installs huacnlee/cargo (AGENTS.md "Commands") in place of rustup's cargo
  and restores its dependency builds. Main's runs save them, pull requests
  only restore them; self-hosted runners keep theirs on the machine. Runs
  after the Rust toolchain is set up.

inputs:
  cache:
    description: >
      The cache's name, one per job (and matrix entry) that builds a different
      set of dependencies, so jobs never overwrite each other's caches.
    required: true
  lockfiles:
    description: >
      The lockfiles of the workspaces the job builds (a `hashFiles` pattern):
      main saves a new cache when they change. Only the main workspace's by
      default, so a change to another workspace's lockfile does not make
      every job save its cache again.
    required: false
    default: Cargo.lock

runs:
  using: composite
  steps:
    # Pinned, as every action is; raise it with the fork's releases.
    # Installed into `$CARGO_HOME/bin`, which goes first on the PATH: the
    # macOS runners put Homebrew's rustup (and its cargo) before it.
    #
    # A self-hosted runner is a machine other repositories' jobs share: the
    # fork goes into the runner's tool cache, first on this job's PATH, and
    # the machine's own `~/.cargo/bin/cargo` stays as it is.
    - name: Install huacnlee/cargo
      if: runner.os != 'Windows'
      shell: bash
      env:
        VERSION: 0.102.0-9
        SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
      run: |
        if [[ "$SELF_HOSTED" == true ]]; then
          dir="$RUNNER_TOOL_CACHE/huacnlee-cargo/$VERSION"
          [[ -x "$dir/cargo" ]] || curl -fsSL https://huacnlee.github.io/cargo/install.sh | sh -s -- --version "$VERSION" --dir "$dir"
        else
          curl -fsSL https://huacnlee.github.io/cargo/install.sh | sh -s -- --version "$VERSION"
          dir="${CARGO_HOME:-$HOME/.cargo}/bin"
        fi
        echo "$dir" >> "$GITHUB_PATH"
    - name: Install huacnlee/cargo
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: 0.102.0-9
        SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
      run: |
        $install = [scriptblock]::Create((irm https://huacnlee.github.io/cargo/install.ps1))
        if ($env:SELF_HOSTED -eq 'true') {
          $dir = Join-Path $env:RUNNER_TOOL_CACHE "huacnlee-cargo\$env:VERSION"
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'cargo.exe'))) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            & $install -Version $env:VERSION -InstallDir $dir
          }
        } else {
          & $install -Version $env:VERSION
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $dir = Join-Path $cargoHome 'bin'
        }
        $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    # The dependency builds are rustc's: a new compiler starts a new cache.
    - name: Check cargo and name the cache
      id: key
      shell: bash
      run: |
        command -v cargo
        version=$(cargo -V)
        echo "$version"
        case "$version" in *huacnlee/cargo*) ;; *) echo "::error::cargo is not huacnlee/cargo"; exit 1 ;; esac
        rustc=$(rustc -vV | sha256sum 2>/dev/null || rustc -vV | shasum -a 256)
        echo "prefix=cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache }}-${rustc:0:12}-" >> "$GITHUB_OUTPUT"

    # The registry's index and the fork's builds of the dependencies
    # (`~/.cargo/targets/shared-deps`, shared by every workspace on the
    # machine). The workspace's own crates are built on each run. The
    # downloaded `.crate` archives are left out: cargo fetches them in
    # seconds, and the repository's cache storage keeps more of the builds
    # that take minutes.
    # A self-hosted runner keeps its own: the fork's builds stay on the
    # machine between jobs, which the cache would only download again.
    - name: Cache dependencies
      if: github.ref == 'refs/heads/main' && runner.environment == 'github-hosted'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/git/db/
          ~/.cargo/targets/shared-deps/
        key: ${{ steps.key.outputs.prefix }}${{ hashFiles(inputs.lockfiles) }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Restore dependencies
      if: github.ref != 'refs/heads/main' && runner.environment == 'github-hosted'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/git/db/
          ~/.cargo/targets/shared-deps/
        key: ${{ steps.key.outputs.prefix }}${{ hashFiles(inputs.lockfiles) }}
        restore-keys: ${{ steps.key.outputs.prefix }}
