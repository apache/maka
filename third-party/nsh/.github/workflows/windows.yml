name: Windows

# Builds, lints and tests the Windows backend (Win32, Direct2D, DirectWrite)
# and the tooling that runs it (`nsh run --target windows`, `nsh package
# --target windows`, `cargo run` on Windows).

on:
  # Pull requests test every change before it merges; main runs every three
  # hours when it moved, instead of on every push, which only tested again what its pull request
  # had, and saves the dependencies' caches pull requests restore.
  schedule:
    - cron: "0 */3 * * *"
  pull_request:
    # `closed` runs nothing, but it takes the pull request's concurrency group
    # and so cancels its runs still queued or running once it merges or closes.
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - "crates/nsh-bundler/**"
      - "crates/nsh-cli/**"
      - "crates/nsh-core/**"
      - "crates/nsh-dev/**"
      - "crates/nsh-engine/**"
      - "crates/nsh-gpu/**"
      - "crates/nsh-i18n/**"
      - "crates/nsh-js/**"
      - "crates/nsh-macros/**"
      - "crates/nsh-package/**"
      - "crates/nsh-updater/**"
      - "crates/nsh-platform-windows/**"
      - "crates/nsh-testing/**"
      - "crates/nsh-base/**"
      - "crates/nsh-windows-app/**"
      - "crates/nsh-windows-host/**"
      - "crates/xtask/**"
      - "examples/counter/**"
      - "examples/gallery/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/windows.yml"
      - ".github/actions/cargo/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI builds each crate once: no incremental state and no debug info
  # (faster builds, smaller caches; panics still name their file and line).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The toolchain file's iOS and Android targets are only the release's.
  RUSTUP_TOOLCHAIN: stable

jobs:
  # Scheduled runs: only when main moved since the last one.
  changed:
    if: github.event_name == 'schedule'
    permissions:
      actions: read
    uses: ./.github/workflows/changed.yml

  check:
    needs: changed
    # Nothing for drafts or a pull request being closed, nor for a scheduled
    # run when main has not changed since the last one.
    if: ${{ !cancelled() && needs.changed.outputs.run != 'false' && (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) }}
    # Debounce (AGENTS.md "CI"): waits without a runner, so a newer
    # push cancels this run before it takes one.
    environment:
      name: ci-debounce
      deployment: false
    runs-on: windows-latest
    env:
      # QuickJS is C: bindgen needs libclang, which the image's LLVM has.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # rustc can overflow its default stack on the `windows` crate's
      # bindings (STATUS_STACK_BUFFER_OVERRUN).
      RUST_MIN_STACK: "268435456"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # huacnlee/cargo, and the dependencies' builds: main's runs save
      # them, pull requests restore them.
      - name: Cargo
        uses: ./.github/actions/cargo
        with:
          cache: windows

      # Cargo retries oversized compiler commands with an argument file when
      # it receives the Windows launch error directly from starting rustc.
      - name: Use the toolchain compiler directly
        shell: pwsh
        run: |
          $rustc = rustup which rustc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTC=$rustc" >> $env:GITHUB_ENV

      - name: Clippy
        run: >
          cargo clippy --all-targets
          -p nsh-platform-windows -p nsh-windows-host -p nsh-windows-app
          -p nsh-cli -p nsh-dev -p xtask
          -- -D warnings

      # Without the optional features: no naga, wgpu, syntect, RaTeX, ropey,
      # imara-diff; no `zlib` or `crypto` module.
      - name: Check without optional features
        run: cargo clippy -p nsh-windows-app --no-default-features --features js -- -D warnings

      # Tests need no display: they open no window.
      - name: Test
        run: cargo test -p nsh-platform-windows -p nsh-windows-host -p nsh-windows-app -p nsh-cli -p nsh-dev -p xtask

      # The apps with Rust crates build a host of their own from the
      # workspace the steps above built, so they stay in this job.
      - name: Run the Rust examples' tests in Win32 windows
        shell: bash
        run: |
          cargo build -p nsh-cli
          run() { ./target/debug/nsh test "$@" --target windows; }
          run examples/rust-exports/App.test.tsx
          run examples/gallery-rs/App.test.tsx

  # The TSX examples' tests in Win32 windows, with the platform's input
  # (`nsh test --target windows`): those a real platform runs (real time).
  # The job of its own takes the build these need, and runs it beside the
  # lints and unit tests above.
  examples:
    needs: changed
    # Nothing for drafts or a pull request being closed, nor for a scheduled
    # run when main has not changed since the last one.
    if: ${{ !cancelled() && needs.changed.outputs.run != 'false' && (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) }}
    # Debounce (AGENTS.md "CI"): waits without a runner, so a newer
    # push cancels this run before it takes one.
    environment:
      name: ci-debounce
      deployment: false
    runs-on: windows-latest
    env:
      # QuickJS is C: bindgen needs libclang, which the image's LLVM has.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # rustc can overflow its default stack on the `windows` crate's
      # bindings (STATUS_STACK_BUFFER_OVERRUN).
      RUST_MIN_STACK: "268435456"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # huacnlee/cargo, and the dependencies' builds: main's runs save
      # them, pull requests restore them.
      - name: Cargo
        uses: ./.github/actions/cargo
        with:
          cache: windows

      # Cargo retries oversized compiler commands with an argument file when
      # it receives the Windows launch error directly from starting rustc.
      - name: Use the toolchain compiler directly
        shell: pwsh
        run: |
          $rustc = rustup which rustc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTC=$rustc" >> $env:GITHUB_ENV

      - name: Run the examples' tests in Win32 windows
        shell: bash
        run: |
          cargo build -p nsh-cli
          run() { ./target/debug/nsh test "$@" --target windows; }
          run examples/counter
          for file in combobox-click context-menu copy-selection-windows device dock form gestures hover links navigation network photos resizable shortcuts storage timers; do
            run "examples/gallery/tests/$file.test.tsx"
          done
          run examples/gallery/tests/environment.test.tsx --filter appearance

  # The release runner on x86_64-pc-windows-gnullvm (#1644): linked again by
  # `nsh package` from its link kit with only the parts an app imports, with
  # rust-lld and the mingw-w64 runtime alone (no Visual Studio). Builds it,
  # runs `nsh/base`'s tests there, and packages the counter from the kit.
  gnullvm:
    needs: changed
    if: ${{ !cancelled() && needs.changed.outputs.run != 'false' && (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) }}
    environment:
      name: ci-debounce
      deployment: false
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      RUST_MIN_STACK: "268435456"
      LLVM_MINGW_VERSION: "20261117"
      LLVM_MINGW: llvm-mingw-20261117-ucrt-x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnullvm

      - name: Cargo
        uses: ./.github/actions/cargo
        with:
          cache: windows-gnullvm

      - name: Use the toolchain compiler directly
        shell: pwsh
        run: |
          $rustc = rustup which rustc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTC=$rustc" >> $env:GITHUB_ENV

      # The C code (QuickJS, zstd, ring) and the runner's link need a mingw
      # toolchain; bindgen's libclang rejects the gnullvm triple, so it is
      # given mingw's.
      - name: Set up llvm-mingw
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/llvm-mingw.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$LLVM_MINGW.zip"
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          m="$(cygpath -m "$RUNNER_TEMP/$LLVM_MINGW")"
          echo "$m/bin" >> "$GITHUB_PATH"
          {
            echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=x86_64-w64-mingw32-clang"
            echo "CC_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-clang"
            echo "CXX_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-clang++"
            echo "AR_x86_64_pc_windows_gnullvm=llvm-ar"
            echo "BINDGEN_EXTRA_CLANG_ARGS_x86_64_pc_windows_gnullvm=--target=x86_64-w64-mingw32 -isystem $m/include"
          } >> "$GITHUB_ENV"

      - name: Test nsh/base
        run: cargo test -p nsh-base --target x86_64-pc-windows-gnullvm

      - name: Package the counter from the runner's link kit
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo rustc --release -p nsh-windows-app --bin nsh-windows-app \
            --target x86_64-pc-windows-gnullvm -- -C save-temps --print link-args > "$RUNNER_TEMP/linkargs.txt"
          rt="$RUNNER_TEMP/runtime/windows"
          mkdir -p "$rt"
          cp target/x86_64-pc-windows-gnullvm/release/nsh-windows-app.exe "$rt/"
          node crates/nsh-windows-app/script/link-kit.js "$RUNNER_TEMP/linkargs.txt" "$rt/nsh-windows-app.link"
          cargo build -p nsh-cli
          NSH_RUNTIME="$RUNNER_TEMP/runtime" ./target/debug/nsh package examples/counter --target windows -o "$RUNNER_TEMP/out" -v
          full=$(stat -c %s "$rt/nsh-windows-app.exe")
          app=$(stat -c %s "$RUNNER_TEMP"/out/*/*.exe)
          echo "runner $full bytes, the counter's $app bytes"
          (( app < full * 9 / 10 ))
