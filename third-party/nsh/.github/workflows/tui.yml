name: TUI

# Lints and tests the terminal backend, whose tests run its views through
# the shared crates: a change there can break it without touching it.

on:
  push:
    branches: [main]
    paths:
      - "crates/nsh-base/**"
      - "crates/nsh-bundler/**"
      - "crates/nsh-core/**"
      - "crates/nsh-dev/**"
      - "crates/nsh-engine/**"
      - "crates/nsh-i18n/**"
      - "crates/nsh-js/**"
      - "crates/nsh-macros/**"
      - "crates/nsh-package/**"
      - "crates/nsh-platform-tui/**"
      - "crates/nsh-testing/**"
      - "crates/nsh-updater/**"
      - "examples/counter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/tui.yml"
      - ".github/actions/cargo/**"
  pull_request:
    # `closed` runs nothing, but it takes the pull request's concurrency group
    # and so cancels its runs still queued or running once it merges or closes.
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - "crates/nsh-base/**"
      - "crates/nsh-bundler/**"
      - "crates/nsh-core/**"
      - "crates/nsh-dev/**"
      - "crates/nsh-engine/**"
      - "crates/nsh-i18n/**"
      - "crates/nsh-js/**"
      - "crates/nsh-macros/**"
      - "crates/nsh-package/**"
      - "crates/nsh-platform-tui/**"
      - "crates/nsh-testing/**"
      - "crates/nsh-updater/**"
      - "examples/counter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/tui.yml"
      - ".github/actions/cargo/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI builds each crate once: no incremental state and no debug info
  # (faster builds, smaller caches; panics still name their file and line).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The toolchain file's iOS and Android targets are only the release's.
  RUSTUP_TOOLCHAIN: stable

jobs:
  check:
    # Nothing for drafts or a pull request being closed.
    if: github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)
    # Debounce (AGENTS.md "CI"): waits without a runner, so a newer
    # push cancels this run before it takes one.
    environment:
      name: ci-debounce
      deployment: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # QuickJS is C (bindgen needs libclang).
      - name: Install clang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # huacnlee/cargo, and the dependencies' builds: main's runs save
      # them, pull requests restore them.
      - name: Cargo
        uses: ./.github/actions/cargo
        with:
          cache: tui

      - name: Clippy
        run: cargo clippy -p nsh-platform-tui --all-targets -- -D warnings

      - name: Test
        run: cargo test -p nsh-platform-tui

      # Workspace builds unify `math` into nsh-base; test both forms.
      - name: Formula rendering with and without math
        run: |
          cargo test -p nsh-base --test base terminal::a_terminal_reads_a_formula_as_text_not_its_tex
          cargo test -p nsh-base --features math --test base terminal::a_terminal_reads_a_formula_as_text_not_its_tex
