name: Core

# Lints and tests the crates every platform shares: the core, the animation
# graph, the macros, the JS runtime (the runtime's Rust modules included), `nsh/base`, the
# engine, the bundler and signed packages. The platform workflows test their backends and the
# tooling only, so these ran nowhere but on developers' machines. What
# releases froze is checked by the Compat workflow.

on:
  # Pull requests test every change before it merges; main runs every three hours
  # (when it moved) instead of on every push, which only tested again what its pull request
  # had, and saves the dependencies' caches pull requests restore.
  schedule:
    - cron: "0 */3 * * *"
  pull_request:
    # `closed` runs nothing, but it takes the pull request's concurrency group
    # and so cancels its runs still queued or running once it merges or closes.
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths:
      - "crates/nsh-bundler/**"
      - "crates/nsh-core/**"
      - "crates/nsh-dev/**"
      - "crates/nsh-engine/**"
      - "crates/nsh-i18n/**"
      - "crates/nsh-js/**"
      - "crates/nsh-macros/**"
      - "crates/nsh-package/**"
      - "crates/nsh-updater/**"
      - "crates/nsh-testing/**"
      - "crates/nsh-base/**"
      - "examples/counter/**"
      - "examples/gallery/**"
      - "examples/bench/**"
      - "tests/compat/cases/layout/fonts/**"
      - "crates/nsh-platform-android/java/com/longbridge/nsh/Native.java"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/workflows/core.yml"
      - ".github/actions/cargo/**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI builds each crate once: no incremental state and no debug info
  # (faster builds, smaller caches; panics still name their file and line).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The toolchain file's iOS and Android targets are only the release's.
  RUSTUP_TOOLCHAIN: stable
  # The bundler as the command line builds it (`bundle`: rolldown and the
  # whole pipeline), so its tests all run.
  PACKAGES: >-
    -p nsh-core -p nsh-macros -p nsh-js -p nsh-base -p nsh-engine
    -p nsh-bundler -p nsh-package -p nsh-testing
    --features nsh-bundler/bundle,nsh-testing/bundle,nsh-testing/agent

jobs:
  # Scheduled runs: only when main moved since the last one.
  changed:
    if: github.event_name == 'schedule'
    permissions:
      actions: read
    uses: ./.github/workflows/changed.yml

  check:
    needs: changed
    # Nothing for drafts or a pull request being closed, nor for a scheduled
    # run when main has not changed since the last one.
    if: ${{ !cancelled() && needs.changed.outputs.run != 'false' && (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) }}
    # Debounce (AGENTS.md "CI"): waits without a runner, so a newer
    # push cancels this run before it takes one.
    environment:
      name: ci-debounce
      deployment: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # QuickJS is C (bindgen needs libclang); none of these crates needs a
      # platform backend.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # huacnlee/cargo, and the dependencies' builds: main's runs save
      # them, pull requests restore them.
      - name: Cargo
        uses: ./.github/actions/cargo
        with:
          cache: core

      - name: Clippy
        run: cargo clippy --all-targets $PACKAGES -- -D warnings

      - name: Test
        run: cargo test $PACKAGES
