[package]
name = "embed-gpui-host"
description = "NSH + GPUI Kit: a GPUI Kit app embedding NSH apps (AppView): host widgets around several surfaces, the host's theme in them."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: GPUI Kit (and the GPUI it builds on) stays out of nsh's
# workspace builds. `cargo run` here, or `cargo run -p example-embed-gpui`
# from the repository's root (`run/`, which runs this with cargo).
[workspace]
exclude = ["run"]

[dependencies]
nsh-platform-gpui = { path = "../../crates/gpui/nsh-platform-gpui" }
# The host's own set (`host/trading`): `#[module]`, and `nsh/base` next to it.
nsh-core = { path = "../../crates/nsh-core" }
nsh-base = { path = "../../crates/nsh-base" }
# The desk the host and the apps share (`watch`).
tokio = { version = "1", default-features = false, features = ["sync"] }
# `gpui-fast`: GPUI Kit drawn by the same `gpui_fast` crate as nsh.
gpui-kit = { version = "0.7.3", features = ["gpui-fast"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.9", default-features = false, features = ["font-kit", "wayland", "x11"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"

# `build.rs` bundles and compiles `app/` as `nsh build` does.
[build-dependencies]
nsh-bundler = { path = "../../crates/nsh-bundler", features = ["bundle"] }
nsh-core = { path = "../../crates/nsh-core" }
nsh-js = { path = "../../crates/nsh-js" }
nsh-base = { path = "../../crates/nsh-base" }
serde_json = "1"

[profile.dev.package.quickjs-jit-sys]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3

# Keep this owning example on Maka's existing GPUI input-admission and wake contracts.
[patch.crates-io]
gpui-fast = { path = "../../../gpui-fast/crates/gpui" }
gpui-fast-macos = { path = "../../../gpui-fast/crates/gpui_macos" }
gpui-fast-windows = { path = "../../../gpui-fast/crates/gpui_windows" }
gpui-fast-linux = { path = "../../../gpui-fast/crates/gpui_linux" }
gpui-pre-scheduler = { path = "../../../gpui-fast/crates/scheduler" }
async-io = { path = "../../../async-io" }
