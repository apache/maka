[package]
name = "rust-exports-native"
description = "What a Rust crate can export to TSX: a component, a module and a class (examples/rust-exports)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nsh-core.workspace = true
nsh-base.workspace = true

# Each desktop's backend, for the native component the crate registers there
# (`meter.rs`); on its platform only, without the backend's default features.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows.workspace = true

# The headless test runs `App.tsx` against this crate's set: `nsh-testing`
# builds it (with the bundler and QuickJS) and runs it.
[dev-dependencies]
# The declarations tests read the set's TypeScript (nsh-core `declarations`).
nsh-core = { workspace = true, features = ["declarations"] }
nsh-engine.workspace = true
nsh-testing = { workspace = true, features = ["bundle"] }
