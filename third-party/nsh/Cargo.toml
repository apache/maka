[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Keep the interpreter and layout fast even in debug builds; they dominate runtime cost.
[profile.dev.package.quickjs-jit-sys]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
# Syntax highlighting (TextView's code blocks): unoptimized, a block takes seconds.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
# What fancy-regex runs its regexes with (also `regex`'s).
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.objc2]
opt-level = 3
[profile.dev.package.objc2-encode]
opt-level = 3
# SVG images are drawn when they load: unoptimized, a large one takes seconds.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
# Photos are decoded and shrunk to their views' sizes as they load: unoptimized,
# a 12-megapixel JPEG takes seconds.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3

# The web runtime (`nsh.wasm`): what pages download, so it is optimized for
# size.
[profile.web]
inherits = "release"
opt-level = "z"
strip = true
panic = "abort"

[patch.crates-io]
icy_sixel = { path = "third-party/icy_sixel" }
