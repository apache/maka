[package]
name = "nsh-platform-macos"
description = "macOS backend (AppKit): native view mounting, CoreText text engine, input, standalone app."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

# AppKit needs the process main thread; opt in with --ignored in a desktop session.
[[test]]
name = "native"
path = "tests/native/main.rs"
harness = false

[features]
default = ["js", "shader", "editor", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto"]
# Hidden native RGBA surface and terminal transport contracts.
terminal = ["dep:nsh-terminal"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js-core"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "shader", "editor", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "dep:nsh-dev", "dep:nsh-testing"]
# Shaders (`Shader`, `ShaderEffect`, `ShaderTransition`, the shader transitions
# of pages and dialogs), on naga and wgpu. Without it they draw nothing.
shader = ["nsh-engine/shader"]
# The large parts of `nsh/base`: see `docs/dev/features.md`. An app that imports
# one its runtime was built without fails at the import, naming it.
# `Editor` and `DiffView`, with ropey and imara-diff.
editor = ["nsh-base/editor"]
# `RichEditor`, its schema, session and plugin classes.
rich-editor = ["nsh-base/rich-editor"]
# The charts: `nsh/base/plot`.
plot = ["nsh-base/plot"]
# `Terminal` and its emulator: `vte`.
term = ["nsh-base/term"]
# Highlighted code in `TextView` and the `Editor` (syntect). Without it, plain.
highlight = ["nsh-base/highlight"]
# `TextView`'s formulas typeset natively (RaTeX and the KaTeX fonts). Without
# it a formula shows as its TeX, or as the app's `renderMath`.
math = ["nsh-base/math"]
# The standard JS module `zlib`: deflate, gzip, brotli and zstd.
zlib = ["js", "nsh-engine/zlib"]
# The standard JS module `crypto` and the globals of Web Crypto.
crypto = ["js", "nsh-engine/crypto"]

[dependencies]
log.workspace = true

# Empty off macOS (like the other platform crates off their targets).
[target.'cfg(target_os = "macos")'.dependencies]
nsh-terminal = { workspace = true, optional = true }
nsh-core = { workspace = true, features = ["svg"] }
nsh-engine.workspace = true
nsh-platform-apple.workspace = true
nsh-base.workspace = true
block2.workspace = true
crossbeam-channel.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSDockTile", "NSPanel", "NSStatusBar", "NSStatusBarButton", "NSStatusItem"] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-foundation.workspace = true
objc2-image-io.workspace = true
objc2-io-kit.workspace = true
objc2-quartz-core.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
libc.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
nsh-bundler = { workspace = true, default-features = false }

[[test]]
name = "terminal_native"
path = "tests/terminal/main.rs"
harness = false
required-features = ["terminal", "js"]

[[test]]
name = "accessibility"
harness = false

[[test]]
name = "background"
harness = false

[[test]]
name = "draw_on_show"
harness = false
