[package]
name = "nsh-platform-macos"
description = "macOS backend (AppKit): native view mounting, CoreText text engine, input, standalone app."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "dep:nsh-dev", "dep:nsh-testing"]

[dependencies]
log.workspace = true

# Empty off macOS (like the other platform crates off their targets).
[target.'cfg(target_os = "macos")'.dependencies]
nsh-core = { workspace = true, features = ["svg"] }
nsh-engine = { workspace = true, features = ["shader"] }
nsh-base = { workspace = true, features = ["highlight"] }
block2.workspace = true
crossbeam-channel.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-foundation.workspace = true
objc2-image-io.workspace = true
objc2-io-kit.workspace = true
objc2-quartz-core.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
libc.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }
