[package]
name = "nsh-cli"
description = "The nsh command line tool: build, package and run apps."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh"
path = "src/main.rs"

[dependencies]
dunce.workspace = true
semver.workspace = true
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
nsh-dev = { workspace = true, features = ["server"] }
nsh-js = { workspace = true, features = ["zlib", "crypto"] }
nsh-base.workspace = true
nsh-package.workspace = true
nsh-testing = { workspace = true, features = ["agent", "bundle"] }
crossbeam-channel.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
notify.workspace = true
log.workspace = true
libc.workspace = true
ureq.workspace = true
serde.workspace = true
tungstenite.workspace = true
serde_json.workspace = true
plist.workspace = true
zip.workspace = true
flate2.workspace = true
tar.workspace = true
sha2.workspace = true
base64.workspace = true
image.workspace = true

[build-dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[dev-dependencies]
# The syntaxes file the web runtime fetches must be a dump its syntect reads.
syntect.workspace = true
