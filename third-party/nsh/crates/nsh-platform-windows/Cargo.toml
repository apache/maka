[package]
name = "nsh-platform-windows"
description = "Windows backend (Win32, Direct2D, DirectWrite): view mounting, text engine, input, standalone app."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "dep:nsh-dev", "dep:nsh-testing"]

[dependencies]
log.workspace = true

# Empty off Windows (like the other platform crates off their targets).
[target.'cfg(windows)'.dependencies]
nsh-core = { workspace = true, features = ["svg"] }
nsh-engine = { workspace = true, features = ["net", "shader"] }
nsh-base = { workspace = true, features = ["highlight"] }
windows.workspace = true
windows-core.workspace = true
windows-numerics.workspace = true
webview2-com.workspace = true
# GIF and WebP animations (WIC decodes the first frame of everything else).
image = { workspace = true, features = ["gif", "webp"] }
rustc-hash.workspace = true
serde_json.workspace = true
url.workspace = true
ttf-parser.workspace = true
ureq.workspace = true
crossbeam-channel.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }
