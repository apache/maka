# The GPUI backend: a workspace of its own, so the main workspace (and its
# `cargo test --workspace`, clippy and CI) never builds GPUI and its native
# dependencies. Build and check it from this directory, or with
# `--manifest-path crates/gpui/Cargo.toml`; it shares the repository's
# `target/` (`.cargo/config.toml`).
[workspace]
resolver = "3"
members = ["nsh-platform-gpui", "nsh-gpui-host", "nsh-gpui-terminal"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://nsh.dev"
readme = "../../README.md"
repository = "https://github.com/longbridge/nsh"
# The crates published to crates.io (the library embedders and apps depend
# on, and the development host the CLI builds an app with Rust crates of its
# own from) do not inherit this; they set
# `homepage`, `readme` and `repository` instead.
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
# nsh's crates, from the main workspace.
nsh-core = { version = "0.3.0", path = "../nsh-core" }
nsh-dev = { version = "0.3.0", path = "../nsh-dev" }
nsh-testing = { version = "0.3.0", path = "../nsh-testing", default-features = false }
nsh-engine = { version = "0.3.0", path = "../nsh-engine", default-features = false }
nsh-base = { version = "0.3.0", path = "../nsh-base", default-features = false }
# The JSX compiler alone (tests compile their apps).
nsh-bundler = { version = "0.3.0", path = "../nsh-bundler", default-features = false }
nsh-platform-gpui = { version = "0.3.0", path = "nsh-platform-gpui", default-features = false }

# The same versions as the main workspace's.
anyhow = "1"
base64 = "0.22"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
icy_sixel = "=0.5.1"
log = "0.4"
rustc-hash = "2.1"
serde_json = "1"
ttf-parser = "0.25"
ureq = "3.1"

futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# GPUI Fast (Zed's GPUI with retained rendering), the renderer; the published
# crates under GPUI's library names, as GPUI Kit apps use them.
gpui = { package = "gpui-fast", version = "0.1.10", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.10", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_wgpu = { package = "gpui-fast-wgpu", version = "0.1.10", default-features = false, features = ["font-kit", "offscreen"] }
# Script shots on Linux: the window read from the X server.
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder"] }
x11rb = { version = "0.13", default-features = false, features = ["dri3", "present"] }
# The canvas rasterizer (already in GPUI's tree through resvg).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# Font files found by family for canvas text outlines (already in GPUI's tree
# through usvg and cosmic-text).
fontdb = "0.23"
# Line breaking (UAX #14) and bidi of the text engine.
unicode-linebreak = "0.1.5"
unicode-bidi = "0.3.18"
# D-Bus (desktop settings on Linux); the features gpui-fast already enables.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Web views: wry, the version GPUI Kit's `gpui-webview` uses (WebKitGTK 4.1 on
# GTK 3 on Linux, WKWebView on macOS, WebView2 on Windows).
wry = { package = "lb-wry", version = "0.53.3" }
gtk = "0.18"
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }
# COM on the threads that use GPUI's text system (Windows: DirectWrite).
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_System_Com"] }
# Videos (GStreamer 1.20+).
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Keep the interpreter and layout fast even in debug builds; they dominate runtime cost.
[profile.dev.package.quickjs-jit-sys]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
# SVG images are drawn when they load: unoptimized, a large one takes seconds.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
# What fancy-regex runs its regexes with (also `regex`'s).
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

# The terminal renderer exposes its own production API, without a core fork.
[patch.crates-io]
# Match Maka's existing GPUI input-admission and cancellation-wake contracts.
# A nested workspace does not inherit the root workspace's patches.
gpui-fast = { path = "../../../gpui-fast/crates/gpui" }
gpui-fast-macos = { path = "../../../gpui-fast/crates/gpui_macos" }
gpui-fast-windows = { path = "../../../gpui-fast/crates/gpui_windows" }
gpui-fast-linux = { path = "../../../gpui-fast/crates/gpui_linux" }
gpui-pre-scheduler = { path = "../../../gpui-fast/crates/scheduler" }
async-io = { path = "../../../async-io" }
gpui-fast-wgpu = { path = "../../third-party/gpui-wgpu" }
# Same codec as ratatui-image; only its output sink is made fallible.
icy_sixel = { path = "../../third-party/icy_sixel" }
