[package]
name = "nsh-windows-app"
description = "Release app runner on Windows: the executable of packaged nsh apps (no development features)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto"]
# JS apps (the bundle in the package). Without it the runner runs a Rust
# app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-windows/js", "nsh-engine/js-core"]
# Shaders, on naga and wgpu. Without them, the runner links neither.
shader = ["nsh-platform-windows/shader"]
# The large parts of `nsh/base` and the standard JS modules
# (`docs/dev/features.md`).
editor = ["nsh-platform-windows/editor"]
rich-editor = ["nsh-platform-windows/rich-editor"]
plot = ["nsh-platform-windows/plot"]
term = ["nsh-platform-windows/term"]
highlight = ["nsh-platform-windows/highlight"]
math = ["nsh-platform-windows/math"]
emoji-picker = ["nsh-platform-windows/emoji-picker"]
zlib = ["nsh-platform-windows/zlib"]
crypto = ["nsh-platform-windows/crypto"]

[dependencies]
log.workspace = true

[target.'cfg(windows)'.dependencies]
nsh-platform-windows.workspace = true
# Over-the-air packages of the app's code (`nsh_engine::updates`).
nsh-engine.workspace = true
serde_json.workspace = true
