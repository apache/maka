[package]
name = "nsh-platform-linux"
description = "Linux backend (GTK 4): native widget mounting, Pango text engine, input, standalone app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js-core"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "dep:nsh-dev", "dep:nsh-testing"]
# Web views with WebKitGTK 6.0 (`libwebkitgtk-6.0-dev` to build,
# `libwebkitgtk-6.0-4` to run); without it a web view shows a placeholder.
webview = ["dep:webkit6"]
# Shaders (`Shader`, `ShaderEffect`, `ShaderTransition`, the shader transitions
# of pages and dialogs), on naga and wgpu. Without it they draw nothing.
shader = ["nsh-engine/shader"]
# The large parts of `nsh/base`: see `docs/dev/features.md`. An app that imports
# one its runtime was built without fails at the import, naming it.
# `Editor` and `DiffView`, with ropey and imara-diff.
editor = ["nsh-base/editor"]
# `RichEditor`, its schema, session and plugin classes.
rich-editor = ["nsh-base/rich-editor"]
# The charts: `nsh/base/plot`.
plot = ["nsh-base/plot"]
# `Terminal` and its emulator: `vte`.
term = ["nsh-base/term"]
# Highlighted code in `TextView` and the `Editor` (syntect). Without it, plain.
highlight = ["nsh-base/highlight"]
# `TextView`'s formulas typeset natively (RaTeX and the KaTeX fonts). Without
# it a formula shows as its TeX, or as the app's `renderMath`.
math = ["nsh-base/math"]
# `EmojiPicker`, with Unicode's emoji and their English names (about 440 kB).
emoji-picker = ["nsh-base/emoji-picker"]
# The standard JS module `zlib`: deflate, gzip, brotli and zstd.
zlib = ["js", "nsh-engine/zlib"]
# The standard JS module `crypto` and the globals of Web Crypto.
crypto = ["js", "nsh-engine/crypto"]

[dependencies]
log.workspace = true

# Empty off Linux (like the other platform crates off their targets).
[target.'cfg(target_os = "linux")'.dependencies]
nsh-core = { workspace = true, features = ["svg", "loader"] }
nsh-engine = { workspace = true, features = ["net"] }
nsh-base.workspace = true
gtk4.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-audio.workspace = true
# GIF and WebP (first frame), which GDK cannot decode without gdk-pixbuf loaders;
# JPEG (and PNG) shrunk to the size a view shows them at.
image = { workspace = true, features = ["gif", "jpeg", "webp"] }
pango.workspace = true
pangocairo.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
ttf-parser.workspace = true
crossbeam-channel.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }
webkit6 = { workspace = true, optional = true }
