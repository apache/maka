[package]
name = "nsh-platform-linux"
description = "Linux backend (GTK 4): native widget mounting, Pango text engine, input, standalone app."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "dep:nsh-dev", "dep:nsh-testing"]
# Web views with WebKitGTK 6.0 (`libwebkitgtk-6.0-dev` to build,
# `libwebkitgtk-6.0-4` to run); without it a web view shows a placeholder.
webview = ["dep:webkit6"]

[dependencies]
log.workspace = true

# Empty off Linux (like the other platform crates off their targets).
[target.'cfg(target_os = "linux")'.dependencies]
nsh-core = { workspace = true, features = ["svg"] }
nsh-engine = { workspace = true, features = ["net", "shader"] }
nsh-base = { workspace = true, features = ["highlight"] }
gtk4.workspace = true
# GIF and WebP (first frame), which GDK cannot decode without gdk-pixbuf loaders.
image = { workspace = true, features = ["gif", "webp"] }
pango.workspace = true
pangocairo.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true
ttf-parser.workspace = true
ureq.workspace = true
crossbeam-channel.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }
webkit6 = { workspace = true, optional = true }
