[package]
name = "nsh-core"
description = "Platform-independent core: shadow tree, styles, layout and mount instructions."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
unicode-linebreak.workspace = true
unicode-properties.workspace = true
rustc-hash.workspace = true
slab.workspace = true
taffy.workspace = true
serde.workspace = true
serde_json.workspace = true
rust-i18n.workspace = true
nsh-macros.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
log.workspace = true
ordered-float.workspace = true
resvg = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
url.workspace = true
sha2.workspace = true
# Picked images' sizes and types (`picker.rs`).
imagesize.workspace = true
naga = { workspace = true, optional = true }
# WOFF and WOFF2 fonts (`text::font_data`).
wuff.workspace = true
# Fonts' family names (`text::font_family`).
ttf-parser.workspace = true

[features]
# SVG images for the native backends (`svg`: sniffing, sizes and rasters with
# resvg). The web runtime leaves it off: the browser draws SVG itself.
svg = ["dep:resvg", "dep:flate2"]
# Remote images for the shared image loader (`image::loader`: downloads with
# ureq). Without it, the loader reads files, assets and inline bytes only.
loader = ["dep:ureq"]
# The shader compiler (`Shader::compile`, on naga). Without it every shader
# source is refused, and the views and transitions asking for one draw none.
shader = ["dep:naga"]
# Shaders as GLSL ES 3.00 (`Shader::glsl_es`), for the web runtime's WebGL 2.
glsl = ["shader", "naga/glsl-out"]
# The text of declarations (documentation and TypeScript of the specs),
# which only `.nsh/types` needs: `nsh` and the program describing an app's
# UI sets turn it on; apps and the web runtime go without
# (`element::DECLARATIONS`).
declarations = []

# Native socket/file implementations. Browser WebSockets and files use
# the host services; their shared checks do not need these dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros"] }
cap-std.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
# The image disk cache (`image/cache.rs`).
httpdate.workspace = true
# The image loader's downloads (`image/loader.rs`, feature `loader`).
ureq = { workspace = true, optional = true }
crc32fast.workspace = true
# `nsh/updater`.
nsh-updater.workspace = true

# `process`'s children: their process groups and exits (`runtime/process.rs`);
# the names of Unix error numbers (`element/system.rs`). Emscripten is wasm32
# and `unix` both, so it needs libc for the `cfg(unix)` code too.
[target.'cfg(any(not(target_arch = "wasm32"), target_os = "emscripten"))'.dependencies]
libc.workspace = true

# `process`'s children on Windows: their jobs (`runtime/process.rs`); the
# machine's memory for the image budget (`image/memory.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
# The tests compile shaders.
nsh-core = { path = ".", features = ["shader"] }
# The `unit_types` check reads the crate's public API.
syn = { workspace = true, features = ["visit"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }
