[package]
name = "nsh-ios-app"
description = "Release app runner: the executable of packaged nsh apps (no development features)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "nsh-ios-app"
path = "src/main.rs"

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto"]
# JS apps (the bundle in the app). Without it the runner runs a Rust app
# only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-ios/js", "nsh-engine/js-core"]
# Shaders, on naga and wgpu. Without them, the runner links neither.
shader = ["nsh-platform-ios/shader"]
# The large parts of `nsh/base` and the standard JS modules
# (`docs/dev/features.md`).
editor = ["nsh-platform-ios/editor"]
rich-editor = ["nsh-platform-ios/rich-editor"]
plot = ["nsh-platform-ios/plot"]
term = ["nsh-platform-ios/term"]
highlight = ["nsh-platform-ios/highlight"]
math = ["nsh-platform-ios/math"]
emoji-picker = ["nsh-platform-ios/emoji-picker"]
zlib = ["nsh-platform-ios/zlib"]
crypto = ["nsh-platform-ios/crypto"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true
# The app's logs in the unified log (`unified_log`).
nsh-platform-apple.workspace = true
# Over-the-air packages of the app's code (`nsh_engine::updates`).
nsh-engine.workspace = true
