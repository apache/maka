[package]
name = "nsh-linux-app"
description = "Release app runner on Linux: the executable of packaged nsh apps (no development features)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "webview"]
# JS apps (the bundle in the package). Without it the runner runs a Rust
# app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-linux/js", "nsh-engine/js-core"]
# Shaders, on naga and wgpu. Without them, the runner links neither.
shader = ["nsh-platform-linux/shader"]
# The large parts of `nsh/base` and the standard JS modules
# (`docs/dev/features.md`).
editor = ["nsh-platform-linux/editor"]
rich-editor = ["nsh-platform-linux/rich-editor"]
plot = ["nsh-platform-linux/plot"]
term = ["nsh-platform-linux/term"]
highlight = ["nsh-platform-linux/highlight"]
math = ["nsh-platform-linux/math"]
emoji-picker = ["nsh-platform-linux/emoji-picker"]
zlib = ["nsh-platform-linux/zlib"]
crypto = ["nsh-platform-linux/crypto"]
# Web views (WebKitGTK 6.0): `libwebkitgtk-6.0-dev` to build, and packaged
# apps then need `libwebkitgtk-6.0-4` to start; off, a web view shows a
# placeholder and the runner needs only GTK 4.
webview = ["nsh-platform-linux/webview"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true
# Over-the-air packages of the app's code (`nsh_engine::updates`).
nsh-engine.workspace = true
serde_json.workspace = true
