[package]
name = "nsh-i18n"
description = "Native Shell's languages: the language data apps format numbers and dates with, and the app's translations read with rust-i18n."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Reading an app's translations (`locales/`) with rust-i18n: the toolchain's
# part (the bundler, the CLI). Without it the crate is the language data
# alone, which the runtime formats with.
build = ["dep:serde_json", "dep:rust-i18n-support"]

[dependencies]
serde_json = { workspace = true, optional = true }
rust-i18n-support = { workspace = true, features = ["codegen"], optional = true }

[dev-dependencies]
serde_json.workspace = true
