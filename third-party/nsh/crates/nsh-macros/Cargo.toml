[package]
name = "nsh-macros"
description = "Derive macros of nsh's Rust components: props, prop enums, events and component metadata."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
imagesize.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
ttf-parser.workspace = true
# WOFF and WOFF2 fonts' family names (`asset!`), read from what they hold.
wuff.workspace = true

[dev-dependencies]
# The integration tests use the macros as an app's crate does, through
# nsh-core's re-exports and the `__private` items they expand to.
# By path only, so `cargo publish` drops it: nsh-core depends on this crate,
# which could not be packaged until nsh-core is on crates.io.
nsh-core = { path = "../nsh-core" }
