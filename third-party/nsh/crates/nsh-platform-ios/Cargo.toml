[package]
name = "nsh-platform-ios"
description = "UIKit backend: native view mounting, text measurement, input, app hosting and the embedding API (C ABI under the NativeShell Swift module)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto"]
# JS apps (bundles, signed packages, the embedding API's loaders); without
# it, a Rust app links no QuickJS.
js = ["nsh-engine/js-core"]
# Development host support: dev-server client, log forwarding, error overlay.
dev = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "dep:nsh-dev", "dep:nsh-testing"]
# The C ABI the NativeShell Swift module is built on (`embed`), exported for
# the static library `cargo xtask dist` builds with `cargo rustc --crate-type
# staticlib`. Off for nsh-ios-host / nsh-ios-app, so they export nothing.
embed = ["js"]
# Shaders (`Shader`, `ShaderEffect`, `ShaderTransition`, the shader transitions
# of pages and dialogs), on naga and wgpu. Without it they draw nothing.
shader = ["nsh-engine/shader"]
# The large parts of `nsh/base`: see `docs/dev/features.md`. An app that imports
# one its runtime was built without fails at the import, naming it.
# `Editor` and `DiffView`, with ropey and imara-diff.
editor = ["nsh-base/editor"]
# `RichEditor`, its schema, session and plugin classes.
rich-editor = ["nsh-base/rich-editor"]
# The charts: `nsh/base/plot`.
plot = ["nsh-base/plot"]
# `Terminal` and its emulator: `vte`.
term = ["nsh-base/term"]
# Highlighted code in `TextView` and the `Editor` (syntect). Without it, plain.
highlight = ["nsh-base/highlight"]
# `TextView`'s formulas typeset natively (RaTeX and the KaTeX fonts). Without
# it a formula shows as its TeX, or as the app's `renderMath`.
math = ["nsh-base/math"]
# `EmojiPicker`, with Unicode's emoji and their English names (about 440 kB).
emoji-picker = ["nsh-base/emoji-picker"]
# The standard JS module `zlib`: deflate, gzip, brotli and zstd.
zlib = ["js", "nsh-engine/zlib"]
# The standard JS module `crypto` and the globals of Web Crypto.
crypto = ["js", "nsh-engine/crypto"]

[dependencies]
nsh-core = { workspace = true, features = ["svg"] }
nsh-engine.workspace = true
nsh-base.workspace = true
serde_json.workspace = true
log.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }

# UIKit exists on iOS, the iOS simulator and Mac Catalyst (all `target_os = "ios"`).
[target.'cfg(target_os = "ios")'.dependencies]
tokio.workspace = true
nsh-platform-apple.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-image-io.workspace = true
# Shader frames on IOSurfaces (`shader::display_frame`).
objc2-io-surface.workspace = true
block2.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
objc2-ui-kit.workspace = true
rustc-hash.workspace = true
libc.workspace = true
