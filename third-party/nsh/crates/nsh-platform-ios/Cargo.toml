[package]
name = "nsh-platform-ios"
description = "UIKit backend: native view mounting, text measurement, input, app hosting and the embedding API (C ABI under the NativeShell Swift module)."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
# JS apps (bundles, signed packages, the embedding API's loaders); without
# it, a Rust app links no QuickJS.
js = ["nsh-engine/js"]
# Development host support: dev-server client, log forwarding, error overlay.
dev = ["js", "dep:nsh-dev", "dep:nsh-testing"]
# The C ABI the NativeShell Swift module is built on (`embed`), exported for
# the static library `cargo xtask dist` builds with `cargo rustc --crate-type
# staticlib`. Off for nsh-ios-host / nsh-ios-app, so they export nothing.
embed = ["js"]

[dependencies]
nsh-core = { workspace = true, features = ["svg"] }
nsh-engine = { workspace = true, features = ["shader"] }
nsh-base = { workspace = true, features = ["highlight"] }
serde_json.workspace = true
log.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }

# UIKit exists on iOS, the iOS simulator and Mac Catalyst (all `target_os = "ios"`).
[target.'cfg(target_os = "ios")'.dependencies]
dispatch2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-image-io.workspace = true
block2.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true
objc2-ui-kit.workspace = true
rustc-hash.workspace = true
libc.workspace = true
