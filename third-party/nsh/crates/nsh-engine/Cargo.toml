[package]
name = "nsh-engine"
description = "Engine thread that drives the JS host and the core and emits mount batches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js"]
# JS apps: the QuickJS VM, source maps, signed packages, and every standard
# module.
js = ["js-core", "zlib", "crypto"]
# The VM without the standard modules `zlib` and `crypto` (and the global
# `crypto`): a runtime for apps that use neither (the web's lite runtime).
js-core = ["dep:nsh-js", "dep:nsh-package", "dep:oxc_sourcemap"]
# The standard modules on their own, for a runtime that picks them.
zlib = ["js-core", "nsh-js/zlib"]
crypto = ["js-core", "nsh-js/crypto"]
# A host supplied by the browser; it executes source outside WebAssembly.
browser = []
# `net`: the HTTP stack behind `fetch` on ureq, which the Windows, Linux and
# GPUI backends hand their engines.
net = ["dep:ureq"]
# `shader`: the native backends' shader renderer (`shader`), on wgpu. Without
# it `shader` has the same API and finds no GPU, so shader views draw nothing.
shader = ["dep:wgpu", "dep:pollster", "nsh-core/shader", "dep:objc2", "dep:objc2-metal", "dep:objc2-core-foundation", "dep:block2"]

[dependencies]
rustc-hash.workspace = true
log.workspace = true
oxc_sourcemap = { workspace = true, optional = true }
nsh-core.workspace = true
nsh-package = { workspace = true, optional = true }
serde_json.workspace = true
nsh-js = { workspace = true, optional = true }
crossbeam-channel.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
ureq = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

# WebAssembly has no threads: `LocalEngine` drives the engine there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
# A packaged app's update configuration (`updates`).
nsh-updater.workspace = true

# Apple: shader frames on IOSurfaces (`shader`; the type is in the API with
# or without it).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-io-surface.workspace = true
objc2 = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true }
block2 = { workspace = true, optional = true }

# Thread priority (Apple), process CPU and memory (`perf`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Process CPU and memory (`perf`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
# The shader tests compile the apps' WGSL (nsh-core `shader`).
nsh-core = { workspace = true, features = ["shader"] }
# The typed API check reads the crate's public API.
syn = { workspace = true, features = ["visit"] }
nsh-base = { workspace = true, features = ["editor", "highlight", "plot", "rich-editor", "term"] }
# The host's shared data in `nativeModule`'s tests.
tokio = { workspace = true, features = ["sync"] }
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-js.workspace = true
# The language data an app ships (`locale_and_font_scale_follow_the_environment`).
nsh-i18n.workspace = true
crossbeam-channel.workspace = true
# A WebSocket server for `tests/engine/websocket.rs`.
tokio-tungstenite.workspace = true

# Most of the engine's tests run JS apps.
[[test]]
name = "engine"
required-features = ["js"]
