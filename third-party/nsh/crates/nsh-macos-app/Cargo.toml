[package]
name = "nsh-macos-app"
description = "Release app runner on macOS: the executable of packaged nsh apps (no development features)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto"]
# JS apps (the bundle in the app's resources). Without it the runner runs a
# Rust app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-macos/js", "nsh-engine/js-core"]
# Shaders, on naga and wgpu. Without them, the runner links neither.
shader = ["nsh-platform-macos/shader"]
# The large parts of `nsh/base` and the standard JS modules
# (`docs/dev/features.md`).
editor = ["nsh-platform-macos/editor"]
rich-editor = ["nsh-platform-macos/rich-editor"]
plot = ["nsh-platform-macos/plot"]
term = ["nsh-platform-macos/term"]
highlight = ["nsh-platform-macos/highlight"]
math = ["nsh-platform-macos/math"]
emoji-picker = ["nsh-platform-macos/emoji-picker"]
zlib = ["nsh-platform-macos/zlib"]
crypto = ["nsh-platform-macos/crypto"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
# The app's logs in the unified log (`unified_log`).
nsh-platform-apple.workspace = true
# Over-the-air packages of the app's code (`nsh_engine::updates`).
nsh-engine.workspace = true
serde_json.workspace = true
