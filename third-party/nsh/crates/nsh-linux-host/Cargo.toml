[package]
name = "nsh-linux-host"
description = "Development host app (GTK 4) that runs a nsh bundle on Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["webview"]
# Web views (WebKitGTK 6.0): `libwebkitgtk-6.0-dev` to build; off, a web
# view shows a placeholder.
webview = ["nsh-platform-linux/webview"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { workspace = true, features = ["dev"] }
nsh-dev.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
