[package]
name = "nsh-platform-web"
description = "WebAssembly backend: runs NSH apps in a browser page, rendering to the DOM, and publishes them as static sites."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["browser"]
# Every part of nsh/base; otherwise only its core controls are registered.
base-full = []
# TSX apps, evaluated by the browser's JavaScript engine, with every base and
# standard module. Without `browser-core` the module runs a Rust app only
# (`nsh_start_rust`, `rust_app!`).
browser = ["browser-core", "base-full", "std-zlib", "std-crypto"]
# The browser host with core base components; used by the lite runtime.
browser-core = ["nsh-engine/browser", "dep:url"]
# Ownership fixtures for actual-Wasm bridge tests, never used by packaging.
browser-tests = ["browser"]
# The standard modules `zlib` and `crypto` (with its globals) for
# JS apps: 0.56 and 0.35 MB of the gzipped module.
std-zlib = ["dep:flate2", "dep:brotli", "dep:zstd"]
std-crypto = ["dep:sha2", "dep:sha1", "dep:md-5", "dep:hmac", "dep:crc32fast", "dep:crc32c"]
# The playground's build (`nsh-playground.wasm`): also compiles TSX in the
# page (`nsh_compile`; nsh's JSX compiler, no rolldown), about 3 MB more.
compiler = ["browser", "dep:nsh-bundler"]
# The runtime `nsh package` links an app's from (`nsh-browser.wasm`): it
# keeps its symbols and relocations, and the CLI drops the parts of
# `nsh/base` and the standard modules the app does not use. Never served
# as it is.
linkable = []
# The development host's (`nsh-dev.wasm`): development bundles with hot
# module replacement, and the model of the app that `nsh test --target web`
# asks about (`nsh_testing::agent`).
dev = ["browser", "dep:nsh-testing", "dep:nsh-dev"]

[lib]
crate-type = ["cdylib", "rlib"]

# Empty off WebAssembly (like the other platform crates off their targets).
[target.'cfg(target_arch = "wasm32")'.dependencies]
nsh-core = { workspace = true, features = ["glsl"] }
nsh-engine.workspace = true
nsh-base = { workspace = true, features = ["highlight"] }
nsh-bundler = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
sha2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
crc32c = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
brotli = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
url = { workspace = true, optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }
nsh-dev = { workspace = true, optional = true }
log.workspace = true
rustc-hash.workspace = true
ttf-parser.workspace = true
unicode-bidi.workspace = true

# The text rules (`src/text/css.rs`, `src/text/wrap.rs`) depend on nothing
# of the browser: `tests/text` builds them on the host and tests them there.
[dev-dependencies]
nsh-core.workspace = true
unicode-bidi.workspace = true
