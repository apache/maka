[package]
name = "nsh-dev"
description = "Development tooling: dev-server protocol, server (CLI side) and client (host side)."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
client = ["dep:tungstenite"]
server = ["dep:axum", "dep:tokio", "dep:nsh-core"]

[dependencies]
dunce.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
nsh-core = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync", "fs"] }
tungstenite = { workspace = true, optional = true }

[dev-dependencies]
# Enables both sides for the round-trip test.
nsh-dev = { path = ".", features = ["client", "server"] }
tungstenite.workspace = true
