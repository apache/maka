[package]
name = "nsh-windows-host"
description = "Development host app (Win32) that runs a nsh bundle on Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
log.workspace = true

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { workspace = true, features = ["dev"] }
nsh-dev.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
