[package]
name = "maka-config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
hex.workspace = true
maka-plugin-core.workspace = true
maka-agent-facts.workspace = true
maka-capabilities.workspace = true
maka-event-log.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
libc.workspace = true
sys-locale.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
tokio.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
