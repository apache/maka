[package]
name = "maka-fs-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
notify = "8.2.1"
maka-agent-facts.workspace = true
maka-plugin-core.workspace = true
maka-sandbox.workspace = true
apply-patch.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
dunce = "1.0.5"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
glob = "0.3.4"
gix = { workspace = true, features = ["status", "worktree-mutation"] }
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
ignore = "0.4.33"
imagesize.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Storage_FileSystem"] }
