[package]
name = "maka-mock-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "maka-mock-ai"
path = "src/main.rs"
test = false

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
clap.workspace = true
fastrand.workspace = true
futures-util.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
regex.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
yaml-rust2 = { version = "0.13.0", default-features = false }

[dev-dependencies]
maka-provider-protocol.workspace = true
