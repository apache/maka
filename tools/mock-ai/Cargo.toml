[package]
name = "maka-mock-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["rules", "proxy", "tls", "cli"]
rules = ["dep:regex", "dep:yaml-rust2"]
tls = ["dep:tokio-rustls", "dep:rustls-pemfile", "dep:rustls-platform-verifier"]
proxy = ["tls", "dep:reqwest", "dep:sha2", "dep:base64"]
cli = ["rules", "proxy", "tls", "dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "maka-mock-ai"
path = "src/main.rs"
test = false
required-features = ["cli"]

[[test]]
name = "advanced_simulation"
path = "tests/advanced_simulation.rs"
required-features = ["rules", "proxy", "tls"]

[[test]]
name = "stress_and_scenarios"
path = "tests/stress_and_scenarios.rs"
required-features = ["rules"]

[[test]]
name = "protocol_conformance"
path = "tests/protocol_conformance.rs"

[dependencies]
base64 = { version = "0.23.1", optional = true }
bytes = "1.12.2"
clap = { workspace = true, optional = true }
fastrand.workspace = true
futures-util.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jsonschema.workspace = true
regex = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["stream"], optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"], optional = true }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
yaml-rust2 = { version = "0.13.2", default-features = false, optional = true }

[dev-dependencies]
maka-provider-protocol.workspace = true
reqwest = { workspace = true, features = ["stream"] }
