maka-mock-ai.workspace = true
maka-plugin-core.workspace = true
maka-remote-pairing.workspace = true
maka-sandbox.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
uuid.workspace = true
