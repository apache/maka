<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' maka-client-plugin:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'"
    />
    <title>Maka</title>
    <style>
      /*
       * Launch surface — renders BEFORE React mounts and before any external
       * CSS loads: a theme-matched background with the centered wordmark, in
       * the spirit of Codex's launch screen rather than a fake app skeleton.
       * It lives outside #root as a fixed overlay so React mounts underneath
       * it; dismissal is pure CSS — the overlay fades once a surface commits
       * content marked `data-maka-content-ready`: the shell's first settled
       * frame, the WorkHub composer, a pending Host decision, or the error
       * surface. A zero-duration animation arms the same hidden state at 8s
       * so a wedged bundle can never strand the logo over a live window.
       *
       * Colors are hardcoded (not CSS variables) because maka-tokens.css
       * (70KB) hasn't loaded yet. The background must equal the BrowserWindow
       * `backgroundColor` in main-window.ts (#ffffff / #1c1d21) so the
       * native-window → first-frame handoff is invisible; the mark uses the
       * brand colour (--maka-brand: #71a8fd).
       */
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #ffffff;
      }
      .maka-preload {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        transition: opacity 160ms ease-out, visibility 0s linear 160ms;
        animation: maka-preload-timeout 0s linear 8s forwards;
      }
      body:has(#root [data-maka-content-ready]) > .maka-preload {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes maka-preload-timeout {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      .maka-preload-mark {
        color: #71a8fd;
        animation: maka-preload-breathe 2.4s ease-in-out infinite;
      }
      @keyframes maka-preload-breathe {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .maka-preload-mark { animation: none; }
      }
      @media (prefers-color-scheme: dark) {
        body, .maka-preload {
          background: #1c1d21;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="maka-preload" id="maka-preload" role="status" aria-busy="true" aria-label="Maka">
      <div class="maka-preload-mark">
