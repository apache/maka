# cargo-deny configuration. Run with `just deny` (requires cargo-deny 0.18.4 or
# later: `cargo install --locked cargo-deny`).

[graph]
# Check the platforms this app ships on, not every target in the lockfile.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = false
no-default-features = false

[advisories]
# Vulnerability advisories always fail the check.
yanked = "deny"
# GPUI pulls in a large transitive graph; only fail on unmaintained or unsound
# crates we depend on directly. Transitive ones still print.
unmaintained = "workspace"
unsound = "workspace"
ignore = [
  # Each entry needs an id and a reason, for example:
  # { id = "RUSTSEC-0000-0000", reason = "not reachable: ..." },
]

[licenses]
# Every license not listed here is denied. In particular GPL, AGPL, and LGPL
# are denied because they are absent; do not add them. This repository is
# Apache-2.0.
allow = [
    "0BSD", # interprocess (Windows named pipes) pulls recvmsg and doctest-file
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
# cargo-deny no longer supports a per-license "warn" level. MPL-2.0 (file-level
# copyleft) is therefore admitted per crate here instead of globally, so every
# new MPL-2.0 dependency is an explicit, reviewed change:
#   { crate = "option-ext", allow = ["MPL-2.0"] },
exceptions = []

[licenses.private]
# Workspace crates are not published; skip their own license field.
ignore = true

[bans]
# GPUI's graph has many duplicate versions; report them without failing.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates are not wildcards as long as the
# crates set `publish = false`.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
