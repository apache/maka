[workspace]
resolver = "3"
members = [
  "crates/app",
  "crates/automations",
  "crates/bots",
  "crates/conversation",
  "crates/extensions",
  "crates/files",
  "crates/host-client",
  "crates/host-protocol",
  "crates/inspector",
  "crates/pet",
  "crates/review",
  "crates/search",
  "crates/session",
  "crates/settings",
  "crates/shared",
  "crates/terminal",
  "crates/transcript-model",
  "crates/workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
publish = false

[workspace.dependencies]
host-protocol = { path = "crates/host-protocol" }
host-client = { path = "crates/host-client" }
transcript-model = { path = "crates/transcript-model" }
shared = { path = "crates/shared" }
workspace = { path = "crates/workspace" }
session = { path = "crates/session" }
conversation = { path = "crates/conversation" }
extensions = { path = "crates/extensions" }
files = { path = "crates/files" }
inspector = { path = "crates/inspector" }
automations = { path = "crates/automations" }
pet = { path = "crates/pet" }
review = { path = "crates/review" }
search = { path = "crates/search" }
settings = { path = "crates/settings" }
terminal = { path = "crates/terminal" }
bots = { path = "crates/bots" }

# Pinned to git main for the Diff component; back to the crates.io release when it ships (expected 2026-10-12).
#
# Syntax colours: the kit's highlighter colours nothing without its
# `tree-sitter` feature (which brings JSON) and a grammar per language. The
# grammars are a curated set, the languages a coding agent's transcript,
# diffs and files mostly hold, not the kit's whole `tree-sitter-languages`
# list: each grammar is a C parser compiled into the binary.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "1e41f17e27ea46589af9c6c428d18b5bf23ef4f6", features = [
  "tree-sitter",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-markdown",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-sql",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }

# The terminal emulator a terminal's Host output is parsed into (the
# terminal crate): its grid, modes and vte parser only; the Host owns the
# PTY, so its tty and event loop stay unused.
alacritty_terminal = "0.26"
anyhow = "1"
async-channel = "2"
async-fs = "2"
async-io = "2"
async-lock = "3"
async-net = "2"
async-process = "2"
# WebSocket framing over any futures-io stream (the remote Host transport).
# Only the client handshake: no runtime integration, no TLS feature; TLS is
# futures-rustls below.
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake"] }
base64 = "0.22"
blocking = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
fastrand = "2"
futures-lite = "2"
# TLS for `wss:` Hosts on the ring provider, which GPUI's graph already
# builds; no aws-lc.
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
getrandom = "0.4"
# Unicode NFC, as the Host folds what recall matches (`foldForMatch`): the
# Search page highlights matched terms by the same rule. Already in the
# graph through url's IDNA, with its compiled data.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Only the codecs attachments decode and encode (the conversation crate).
# GPUI already depends on this version with more of them.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
log = "0.4"
# The Markdown parser gpui-kit's text view uses (same version, already in
# the graph): the find bar reads a reply's visible text with the same parse.
markdown = { version = "1.0.0", default-features = false }
# QR codes for the chat bots' guided setup (the settings crate draws them);
# the module matrix only, no image or SVG renderer.
qrcode = { version = "0.14", default-features = false }
# The web address pattern a terminal's links are found by (the terminal
# crate). Already in the graph through GPUI and gpui-kit.
regex = "1.13"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Line diffs of a turn's file before and after it (the review crate's turn
# changes): the comparison only, no text helpers. Already in the graph
# through gpui-kit's Diff component.
similar = { version = "2.7", default-features = false }
# The system's preferred languages, for the Follow system interface language.
sys-locale = "0.3"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

# The shipped app (scripts/bundle-macos.sh). Thin LTO with one codegen unit
# trades build time for a smaller, faster binary. `panic = "unwind"` is
# Cargo's default, written out so that switching to abort for size is a
# visible decision.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Debug builds keep line tables for our crates (backtraces still name the
# line) and no debug info for dependencies: full debug info for gpui and its
# graph grew target/debug past 40 GB within hours of parallel test builds.
[profile.dev]
debug = "line-tables-only"
# Incremental caches of a dozen crates, rebuilt by parallel test runs,
# reached 20 GB on their own; a clean crate rebuild costs less than that.
incremental = false

[profile.dev.package."*"]
debug = false
