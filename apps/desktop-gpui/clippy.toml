too-many-arguments-threshold = 8
type-complexity-threshold = 400

# These calls block the calling thread. In this app any of them can end up on
# the UI thread and stall frames. See "Performance rules" in AGENTS.md: run the
# work on the background executor (`cx.background_spawn`) with async I/O, store
# the result on the owning entity, and call `cx.notify()`.
#
# A scoped `#[allow(clippy::disallowed_methods)]` with a one-line reason is
# acceptable only in tests, examples, build scripts, and code that provably
# runs on a background thread.
disallowed-methods = [
  { path = "std::thread::sleep", reason = "blocks the thread; use a GPUI timer (`cx.background_executor().timer(..)`) instead. See AGENTS.md, Performance rules." },
  { path = "std::fs::read", reason = "blocking file I/O; do it in `cx.background_spawn` with async I/O. See AGENTS.md, Performance rules." },
  { path = "std::fs::read_to_string", reason = "blocking file I/O; do it in `cx.background_spawn` with async I/O. See AGENTS.md, Performance rules." },
  { path = "std::fs::write", reason = "blocking file I/O; do it in `cx.background_spawn` with async I/O. See AGENTS.md, Performance rules." },
  { path = "std::fs::read_dir", reason = "blocking filesystem walk; do it in one background pass in `cx.background_spawn`. See AGENTS.md, Performance rules." },
  { path = "std::process::Command::output", reason = "waits for a subprocess on the calling thread; run it from `cx.background_spawn` with an async process API. See AGENTS.md, Performance rules." },
  { path = "std::process::Command::status", reason = "waits for a subprocess on the calling thread; run it from `cx.background_spawn` with an async process API. See AGENTS.md, Performance rules." },
]
