[package]
name = "extensions"
description = "The Extensions page: the workspace's Skills, the ones it can install, and the local source library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
gpui-kit.workspace = true
host-protocol.workspace = true
log.workspace = true
serde_json.workspace = true
# SKILL.md front matter, validated as Desktop's `validateSkillMetadata`
# does (strict YAML, unique keys, no aliases). Already in GPUI's graph
# through gpui-kit's locale loader.
serde-saphyr = "1.3"
shared.workspace = true
workspace.workspace = true

[dev-dependencies]
futures-lite.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
host-client.workspace = true

[lints]
workspace = true
