[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "maka-gpui"
path = "src/main.rs"

[dependencies]
automations.workspace = true
bots.workspace = true
conversation.workspace = true
extensions.workspace = true
files.workspace = true
futures-lite.workspace = true
gpui-kit.workspace = true
host-protocol.workspace = true
inspector.workspace = true
log.workspace = true
pet.workspace = true
review.workspace = true
search.workspace = true
session.workspace = true
settings.workspace = true
shared.workspace = true
terminal.workspace = true
transcript-model.workspace = true
workspace.workspace = true

# The Dock tile's content view, for the app icon Settings chooses (see
# src/dock_icon.rs). Already in GPUI's graph; only these calls, all safe.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSCell",
  "NSControl",
  "NSDockTile",
  "NSImage",
  "NSImageView",
  "NSResponder",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry"] }

[dev-dependencies]
async-channel.workspace = true
base64.workspace = true
bots = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
host-client.workspace = true
serde_json.workspace = true

[lints]
workspace = true
