[package]
name = "maka-runtime-host-peer"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
libp2p = { version = "0.56", features = [
  "dcutr",
  "dns",
  "identify",
  "kad",
  "macros",
  "noise",
  "ping",
  "quic",
  "relay",
  "rsa",
  "tcp",
  "tokio",
  "yamux",
] }
libp2p-webrtc-utils = "0.4"
napi = { version = "3.12", features = ["napi8", "tokio_rt"] }
napi-derive = "3.5"
prost = "0.14"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
unsigned-varint = "0.8"
# v0.21.0-rc.1 predates the rtc fixes qualified in apache/maka#4382.
# Keep this immutable until an official release contains those fixes.
webrtc = { git = "https://github.com/webrtc-rs/webrtc", rev = "e132552fc67b84c30e63c5ce916a9a63e2484b6f" }

[build-dependencies]
napi-build = "2.4"

[profile.release]
# build.mjs strips the copied addon once; Cargo stripping every intermediate artifact is redundant.
strip = "none"
# The CLI ships all four platform addons in one immutable tarball. Optimize the
# network helper for deployed size while preserving unwind semantics at the N-API boundary.
opt-level = "s"
lto = "thin"
codegen-units = 1
