[package]
name = "maka-runtime-host-peer"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3"
libp2p = { version = "0.56", features = [
  "dcutr",
  "dns",
  "identify",
  "kad",
  "macros",
  "noise",
  "ping",
  "quic",
  "relay",
  "rsa",
  "tcp",
  "tokio",
  "yamux",
] }
napi = { version = "3.12", features = ["napi8", "tokio_rt"] }
napi-derive = "3.5"
tokio = { version = "1.53", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
napi-build = "2.4"

[profile.release]
# build.mjs strips the copied addon once; Cargo stripping every intermediate artifact is redundant.
strip = "none"
