[package]
name = "maka-js-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
maka-code-runtime.workspace = true
maka-agent-facts.workspace = true
maka-agent-ports.workspace = true
maka-capabilities.workspace = true
maka-plugin-core.workspace = true
deno_core.workspace = true
deno_error.workspace = true
futures-util.workspace = true
deno_webidl = "=0.260.0"
deno_web = "=0.291.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[build-dependencies]
deno_core.workspace = true
deno_webidl = "=0.260.0"
deno_web = "=0.291.0"

# Deno still uses sha2 0.10. Preserve its hardware backend until it migrates;
# that version's assembly crate does not support Windows.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2-transitive = { package = "sha2", version = "0.10.9", features = ["asm"] }

[package.metadata.cargo-machete]
ignored = ["sha2-transitive"]
