[package]
name = "maka-remote-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.11.1"
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
maka-remote-pairing.workspace = true
maka-remote-transport.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }
tokio-tungstenite.workspace = true
uuid.workspace = true

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
maka-event-log.workspace = true
maka-host-runtime.workspace = true
maka-packages.workspace = true
maka-plugin-core.workspace = true
hex.workspace = true
maka-remote-transport = { workspace = true, features = ["host", "relay-server"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
