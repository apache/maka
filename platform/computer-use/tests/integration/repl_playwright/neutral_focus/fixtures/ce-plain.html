<!doctype html><meta charset="utf-8"><title>Own CE focus and range probe</title>
<style>body{font:16px sans-serif;margin:16px}#entry{display:block;min-width:320px;min-height:48px;border:1px solid;padding:4px}</style>
<main id="fixture"></main>
<script>
'use strict';
(() => {
  const caseId = new URL(location.href).searchParams.get('case');
  const cases = new Set(['ce-plain', 'ce-focus-replace-cancel', 'ce-focus-detach', 'input-plain', 'textarea-plain', 'input-label']);
  if (!cases.has(caseId)) throw new Error('Unknown own CE probe case');
  const fixture = document.querySelector('#fixture');
  if (caseId === 'input-label') fixture.innerHTML = '<label id="entry-label" for="entry">Own message</label><input id="entry" value="seed">';
  else if (caseId === 'input-plain') fixture.innerHTML = '<input id="entry" value="seed">';
  else if (caseId === 'textarea-plain') fixture.innerHTML = '<textarea id="entry">seed</textarea>';
  else fixture.innerHTML = '<div id="entry" contenteditable="true" role="textbox"><span id="seed-child">seed</span></div>';
  const held = document.querySelector('#entry');
  const initialChildren = Array.from(held.childNodes);
  const nodeIds = new WeakMap([[held, 'held-entry']]);
  const rangeIds = new WeakMap();
  let nextNode = 0, nextRange = 0, focusEntryRange = null, replacement = null;
  for (const child of initialChildren) {
    nodeIds.set(child, 'initial-child-' + nextNode++);
    for (const text of child.childNodes) nodeIds.set(text, 'initial-descendant-' + nextNode++);
  }
  const nodeId = node => {
    if (!node) return null;
    if (!nodeIds.has(node)) nodeIds.set(node, 'observed-node-' + nextNode++);
    return nodeIds.get(node);
  };
  const rangeId = range => {
    if (!rangeIds.has(range)) rangeIds.set(range, 'observed-range-' + nextRange++);
    return rangeIds.get(range);
  };
  const node = value => value ? {identity:nodeId(value),nodeType:value.nodeType,
    name:value.nodeName,id:value.nodeType === 1 ? value.id : null,
    connected:value.isConnected,text:value.textContent} : null;
  const describeRange = range => range ? {identity:rangeId(range),collapsed:range.collapsed,
    start:{node:node(range.startContainer),offset:range.startOffset},
    end:{node:node(range.endContainer),offset:range.endOffset},
    commonAncestor:node(range.commonAncestorContainer),text:range.toString()} : null;
  const selection = () => {
    const selected = document.defaultView.getSelection();
    if (!selected) return null;
    return {rangeCount:selected.rangeCount,collapsed:selected.isCollapsed,
      anchor:{node:node(selected.anchorNode),offset:selected.anchorOffset},
      focus:{node:node(selected.focusNode),offset:selected.focusOffset},text:selected.toString(),
      ranges:Array.from({length:selected.rangeCount},(_, index)=>describeRange(selected.getRangeAt(index)))};
  };
  const state = {caseId,events:[],focusHandlers:0,pastes:[],documentPastes:[],focusMutation:null};
  const entryState = () => ({held:node(held),currentEntryIsHeld:document.querySelector('#entry') === held,
    value:'value' in held ? held.value : null,html:held.innerHTML,text:held.textContent,
    selectionStart:'selectionStart' in held ? held.selectionStart : null,
    selectionEnd:'selectionEnd' in held ? held.selectionEnd : null,
    selectionDirection:'selectionDirection' in held ? held.selectionDirection : null,
    children:Array.from(held.childNodes,node),initialChildren:initialChildren.map(node),
    replacement:node(replacement),hasFocus:document.hasFocus(),visibilityState:document.visibilityState,
    activeElement:node(document.activeElement),
    activeIsHeld:document.activeElement === held,selection:selection(),
    heldFocusEntryRange:describeRange(focusEntryRange)});
  const record = (type, event, extra = {}) => {
    const selected = document.defaultView.getSelection();
    const row = {type,timeStamp:event?.timeStamp ?? null,observedAt:performance.now(),
      trusted:event?.isTrusted ?? null,target:node(event?.target),targetIsHeld:event?.target === held,
      defaultPrevented:event?.defaultPrevented ?? null,
      inputType:event?.inputType ?? null,data:event?.data ?? null,
      key:event?.key ?? null,code:event?.code ?? null,
      clipboardTypes:event?.clipboardData ? Array.from(event.clipboardData.types) : null,
      clipboardText:event?.clipboardData?.getData('text/plain') ?? null,
      focusEntryRangeIsSelected:!!focusEntryRange && !!selected?.rangeCount && selected.getRangeAt(0) === focusEntryRange,
      state:entryState(),...extra};
    state.events.push(row);
    return row;
  };
  for (const type of ['focus','focusin','blur','focusout','selectionchange','paste','beforeinput','input','change','keydown','keyup']) {
    document.addEventListener(type,event => {
      if (event.target !== held && event.target !== replacement && type !== 'selectionchange' && type !== 'paste') return;
      const row = record(type,event);
      if (type === 'paste') state.documentPastes.push(row);
      queueMicrotask(() => {
        row.defaultPreventedAfterDispatch = event.defaultPrevented;
        row.stateAfterDispatch = entryState();
      });
    },true);
  }
  held.addEventListener('focus',event => {
    state.focusHandlers++;
    if (!['ce-focus-replace-cancel','ce-focus-detach'].includes(caseId) || state.focusMutation) return;
    const selected = document.defaultView.getSelection();
    focusEntryRange = selected?.rangeCount ? selected.getRangeAt(0) : null;
    const before = record('focus-handler-entry',event);
    if (caseId === 'ce-focus-detach') {
      replacement = held.cloneNode(false);
      replacement.textContent = 'untouched replacement';
      nodeIds.set(replacement,'replacement-entry');
      nodeIds.set(replacement.firstChild,'replacement-text');
      held.replaceWith(replacement);
    } else {
      replacement = document.createElement('span');
      replacement.id = 'fresh-child';
      replacement.textContent = 'fresh-after-focus';
      nodeIds.set(replacement,'fresh-child');
      nodeIds.set(replacement.firstChild,'fresh-text');
      held.replaceChildren(replacement);
    }
    const after = record('focus-handler-exit',event);
    state.focusMutation = {before,after};
  });
  held.addEventListener('paste',event => {
    if (caseId === 'ce-focus-replace-cancel') event.preventDefault();
    const row = record('paste-handler',event,{preventedByFixture:caseId === 'ce-focus-replace-cancel'});
    state.pastes.push(row);
  });
  window.__ceProbe = {snapshot() {
    return {caseId,readyState:document.readyState,timeOrigin:performance.timeOrigin,
      observedAt:performance.now(),url:location.href,viewport:{innerWidth,innerHeight,devicePixelRatio},
      state:entryState(),focusHandlers:state.focusHandlers,focusMutation:state.focusMutation,
      pastes:state.pastes,documentPastes:state.documentPastes,events:state.events};
  }};
})();
</script>
