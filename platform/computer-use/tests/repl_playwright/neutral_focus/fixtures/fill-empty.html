<!doctype html><meta charset="utf-8"><title>Original browser write fixture fill-empty</title>
<label for="entry">Message</label><input id="entry" value="seed"><output id="case">fill-empty</output>
<script>
  window.__fixture = {caseId: "fill-empty", events: []};
  const entry = document.querySelector('#entry');
  for (const name of ['focus','blur','paste','beforeinput','input','change','keydown','keyup','select','selectionchange']) {
    document.addEventListener(name, event => {
      if (event.target !== entry && name !== 'selectionchange') return;
      const row = {type:event.type, trusted:event.isTrusted, value:entry.value,
        selectionStart:entry.selectionStart, selectionEnd:entry.selectionEnd,
        key:event.key ?? null, code:event.code ?? null, inputType:event.inputType ?? null,
        data:event.data ?? null, defaultPrevented:event.defaultPrevented,
        ctrl:event.ctrlKey ?? false, meta:event.metaKey ?? false,
        clipboardTypes:event.clipboardData ? Array.from(event.clipboardData.types) : null,
        clipboardText:event.clipboardData ? event.clipboardData.getData('text/plain') : null};
      window.__fixture.events.push(row);
      queueMicrotask(() => { row.defaultPreventedAfterDispatch=event.defaultPrevented; row.valueAfterDispatch=entry.value; });
    }, true);
  }
  if ("fill-empty" === 'prevent-paste') entry.addEventListener('paste', event => event.preventDefault());
</script>
<script>(() => {
  const view=window,doc=view.document,entry=doc.querySelector('#entry');
  if (!entry || entry.localName!=='input') throw new Error('Owned INPUT fixture required');
  if (view.__inputOrderDiagnostics) throw new Error('Diagnostics already installed');
  const describe=node=>node?{
    nodeType:node.nodeType??null,nodeName:node.nodeName??null,
    tag:node.localName??null,id:node.id??null,
    parentId:node.parentElement?.id??null,
    childIndex:node.parentNode?Array.prototype.indexOf.call(node.parentNode.childNodes,node):null,
    entryContains:node.nodeType?entry.contains(node):false
  }:null;
  const active=()=>{
    const nodes=[];
    for(let node=doc.activeElement;node;node=node.shadowRoot?.activeElement??null)
      nodes.push(describe(node));
    return nodes;
  };
  const selection=()=>{
    const selected=doc.getSelection();
    if(!selected)return null;
    const ranges=[];
    for(let index=0;index<selected.rangeCount;index++){
      const range=selected.getRangeAt(index);
      ranges.push({startContainer:describe(range.startContainer),startOffset:range.startOffset,
        endContainer:describe(range.endContainer),endOffset:range.endOffset,collapsed:range.collapsed});
    }
    return {type:selected.type,rangeCount:selected.rangeCount,isCollapsed:selected.isCollapsed,
      anchorNode:describe(selected.anchorNode),anchorOffset:selected.anchorOffset,
      focusNode:describe(selected.focusNode),focusOffset:selected.focusOffset,ranges};
  };
  const viewport=()=>{
    const visual=view.visualViewport;
    return {innerWidth:view.innerWidth,innerHeight:view.innerHeight,
      outerWidth:view.outerWidth,outerHeight:view.outerHeight,
      devicePixelRatio:view.devicePixelRatio,scrollX:view.scrollX,scrollY:view.scrollY,
      visualViewport:visual?{offsetLeft:visual.offsetLeft,offsetTop:visual.offsetTop,
        pageLeft:visual.pageLeft,pageTop:visual.pageTop,width:visual.width,height:visual.height,scale:visual.scale}:null};
  };
  const state=()=>({url:view.location.href,timeOrigin:view.performance.timeOrigin,
    observedAt:view.performance.now(),hasFocus:doc.hasFocus(),visibilityState:doc.visibilityState,
    readyState:doc.readyState,activeElements:active(),value:entry.value,
    selectionStart:entry.selectionStart,selectionEnd:entry.selectionEnd,
    selectionDirection:entry.selectionDirection,documentSelection:selection(),
    viewport:viewport(),fontsStatus:doc.fonts?.status??null,
    methodProperties:{ownSelect:Object.prototype.hasOwnProperty.call(entry,'select'),
      ownFocus:Object.prototype.hasOwnProperty.call(entry,'focus'),
      selectName:entry.select?.name??null,focusName:entry.focus?.name??null}});
  const diagnostics={kind:'owned-input-passive-diagnostics',events:[],installed:state()};
  view.__inputOrderDiagnostics=diagnostics;
  const record=(event,listener)=>{
    const target=event.target;
    const scroller=target?.nodeType===9?target.scrollingElement:target;
    diagnostics.events.push({index:diagnostics.events.length,listener,
      type:event.type,timeStamp:event.timeStamp,observedAt:view.performance.now(),
      timeOrigin:view.performance.timeOrigin,trusted:event.isTrusted,
      target:describe(target),currentTarget:describe(event.currentTarget),
      relatedTarget:describe(event.relatedTarget),eventPhase:event.eventPhase,
      bubbles:event.bubbles,cancelable:event.cancelable,composed:event.composed,
      defaultPrevented:event.defaultPrevented,
      path:event.composedPath().map(describe),
      inputType:event.inputType??null,data:event.data??null,
      key:event.key??null,code:event.code??null,
      clipboardTypes:event.clipboardData?Array.from(event.clipboardData.types):null,
      clipboardText:event.clipboardData?event.clipboardData.getData('text/plain'):null,
      hasFocus:doc.hasFocus(),visibilityState:doc.visibilityState,activeElements:active(),
      value:entry.value,selectionStart:entry.selectionStart,selectionEnd:entry.selectionEnd,
      selectionDirection:entry.selectionDirection,documentSelection:selection(),
      windowScrollX:view.scrollX,windowScrollY:view.scrollY,
      targetScrollLeft:scroller?.scrollLeft??null,targetScrollTop:scroller?.scrollTop??null,
      legacyEventCount:view.__fixture?.events?.length??null});
  };
  for(const type of ['focus','blur','focusin','focusout','paste','beforeinput','input',
      'change','keydown','keyup','select','selectionchange','visibilitychange','scroll']){
    doc.addEventListener(type,event=>{
      if(event.target===entry||['selectionchange','visibilitychange','scroll'].includes(type))
        record(event,'document-capture');
    },{capture:true,passive:true});
  }
  for(const type of ['focus','blur'])view.addEventListener(type,event=>{
    if(event.target===view)record(event,'window-capture');
  },{capture:true,passive:true});
  diagnostics.read=()=>({kind:diagnostics.kind,installed:diagnostics.installed,
    state:state(),events:structuredClone(diagnostics.events),
    timing:'Passive instrumented observation; clocks belong to this document. No focus/scroll/selection reset, timers, RAF, task markers or prototype replacement.'});
  return true;
})()</script>
