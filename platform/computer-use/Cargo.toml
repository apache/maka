[package]
autotests = false
name = "maka-computer-use"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
native-desktop = [
    "dep:anyhow",
    "dep:hex",
    "dep:cua-driver-contract",
    "dep:cua-driver-sdk",
    "dep:cua-driver-core",
    "dep:libc",
    "dep:base64",
    "dep:cursor-overlay",
    "dep:sha2",
    "dep:tempfile",
    "dep:platform-windows",
    "dep:windows-sys",
    "dep:platform-linux",
    "dep:platform-macos",
    "dep:core-foundation",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:unicode-segmentation",
    "dep:image",
    "dep:tracing",
    "dep:regex",
    "dep:markdown",
]

[dependencies]
anyhow = { version = "1", optional = true }
maka-code-runtime.workspace = true
hex = { workspace = true, optional = true }
maka-agent-facts.workspace = true
maka-capabilities.workspace = true
maka-plugin-core.workspace = true
futures-util.workspace = true
cua-driver-contract = { workspace = true, optional = true }
cua-driver-sdk = { workspace = true, optional = true }
cua-driver-core = { git = "https://github.com/maka-agent/cua", rev = "bb63f88d7a1794b5b24afeb820776dcec3b01664", optional = true }
serde.workspace = true
schemars.workspace = true
uuid.workspace = true
libc = { workspace = true, optional = true }
reqwest.workspace = true
base64 = { version = "0.23.1", optional = true }
cursor-overlay = { git = "https://github.com/maka-agent/cua", rev = "bb63f88d7a1794b5b24afeb820776dcec3b01664", features = ["theme-authoring"], optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
serde_json.workspace = true
regex = { version = "1.13.1", optional = true }
markdown = { version = "1.0.0", optional = true }
tokio = { workspace = true, features = ["io-std", "process"] }
tokio-util.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
maka-agent-authority.workspace = true
maka-event-log.workspace = true
tempfile.workspace = true
maka-js-runtime.workspace = true
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
tiny-skia = { version = "0.12.0", features = ["png-format"] }
# Cua's native theme renderer accepts its own tiny-skia 0.11 Pixmap.
cua-skia = { package = "tiny-skia", version = "0.11.4", features = ["png-format"] }

[target.'cfg(windows)'.dependencies]
platform-windows = { git = "https://github.com/maka-agent/cua", rev = "bb63f88d7a1794b5b24afeb820776dcec3b01664", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
platform-linux = { git = "https://github.com/maka-agent/cua", rev = "bb63f88d7a1794b5b24afeb820776dcec3b01664", optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
unicode-segmentation = { workspace = true, optional = true }
platform-macos = { git = "https://github.com/maka-agent/cua", rev = "bb63f88d7a1794b5b24afeb820776dcec3b01664", optional = true }
core-foundation = { version = "0.10.1", optional = true }
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"], optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"], optional = true }

[[example]]
name = "cursor-preview"
required-features = ["native-desktop"]

[[example]]
name = "desktop-host"
required-features = ["native-desktop"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
