[package]
name = "maka-host-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
maka-agent-facts.workspace = true
maka-packages.workspace = true
maka-capabilities.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
maka-plugin-core.workspace = true
maka-event-log.workspace = true
maka-config.workspace = true
maka-fs-tools.workspace = true
maka-process.workspace = true
maka-sandbox.workspace = true
maka-network.workspace = true
reqwest = { workspace = true, features = ["stream"] }
maka-presentation.workspace = true
serde_json.workspace = true
serde.workspace = true
schemars.workspace = true
sha2.workspace = true
base64 = "0.22"
getrandom = "0.4.3"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
tokio-tungstenite.workspace = true
thiserror.workspace = true
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { workspace = true, features = ["net", "process"] }
tokio-util.workspace = true
uuid.workspace = true
libc.workspace = true
tempfile.workspace = true
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio-util = { workspace = true, features = ["compat"] }
tempfile.workspace = true
sqlx.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }
