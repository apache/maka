[package]
name = "maka-event-log"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
ignore = "0.4.33"
cap-std.workspace = true
cap-fs-ext.workspace = true
hex.workspace = true
maka-packages.workspace = true
maka-sandbox.workspace = true
maka-plugin-core.workspace = true
libc.workspace = true
serde.workspace = true
schemars.workspace = true
uuid.workspace = true
rusqlite = { workspace = true, features = ["functions", "blob", "hooks"] }
async-channel = "2.5.0"
url = "2"
futures-util.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Shell"] }

[[test]]
name = "root_lease"
path = "tests/root_lease.rs"

[[test]]
name = "checkpoint_restore"
path = "tests/checkpoint_restore.rs"
