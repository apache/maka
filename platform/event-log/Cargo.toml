[package]
name = "maka-event-log"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[dependencies]
hex.workspace = true
postcard.workspace = true
maka-agent-facts.workspace = true
maka-packages.workspace = true
maka-agent-ports.workspace = true
maka-capabilities.workspace = true
maka-sandbox.workspace = true
maka-plugin-core.workspace = true
libc.workspace = true
serde.workspace = true
schemars.workspace = true
uuid.workspace = true
maka-presentation.workspace = true
rusqlite = { workspace = true, features = ["functions", "blob"] }
sqlx = { workspace = true, features = ["sqlite-preupdate-hook"] }
# Explicit acknowledged rollback after a failed COMMIT; SQLx does not reexport the trait.
sqlx-core = { version = "0.9.0", default-features = false }
futures-util.workspace = true
serde_json.workspace = true
regex = "1.13.1"
unicode-normalization = "0.1.25"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_Shell"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "root_lease"
path = "tests/root_lease.rs"
