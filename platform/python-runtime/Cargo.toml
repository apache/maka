[package]
autotests = false
name = "maka-python-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "maka-python-worker"
path = "src/main.rs"
test = false

[dependencies]
maka-agent-facts.workspace = true
maka-code-runtime.workspace = true
futures-util.workspace = true
monty = "=1.3.0"
monty-types = "=1.3.0"
monty-alloc = { version = "=1.3.0", features = ["exit-code"] }
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
maka-session-state.workspace = true
maka-tools.workspace = true
maka-event-log.workspace = true
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
