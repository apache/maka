[package]
name = "maka-remote-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
host = ["dep:maka-host-runtime", "dep:tokio-util", "dep:tracing", "iroh/unstable-net-report"]
relay-server = ["iroh-relay/server", "dep:rcgen", "dep:subtle"]

[dependencies]
hex.workspace = true
httparse = "1.10.1"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-aws-lc-rs", "platform-verifier"] }
iroh-relay = { version = "=1.5.0", default-features = false, features = ["tls-aws-lc-rs", "platform-verifier"] }
maka-host-runtime = { workspace = true, optional = true }
maka-remote-pairing.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
sha2.workspace = true
subtle = { version = "2.6.1", optional = true }
tokio = { workspace = true, features = ["net"] }
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-tungstenite = { workspace = true, features = ["__rustls-tls"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = "2.5.9"
x509-parser = { version = "0.18.1", default-features = false }

[dev-dependencies]
futures-util.workspace = true
log = "0.4.35"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
maka-event-log.workspace = true
maka-packages.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true

[[test]]
name = "quic_transport_behaviors"
required-features = ["host", "relay-server"]

[[test]]
name = "websocket"
required-features = ["relay-server"]
