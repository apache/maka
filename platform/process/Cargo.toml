[package]
name = "maka-process"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
maka-agent-facts.workspace = true
alacritty_terminal = { version = "0.26.0", default-features = false }
maka-sandbox.workspace = true
maka-network.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "net"] }
tokio-util.workspace = true
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.5", features = ["pty", "termios", "fs", "process", "net"] }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
uuid.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }

[dev-dependencies]
tempfile.workspace = true
