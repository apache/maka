[package]
name = "maka-desktop-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
maka-event-log.workspace = true
maka-host-runtime.workspace = true
maka-workbench.workspace = true
nsh-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(windows)'.dependencies]
nsh-platform-windows.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSDraggingItem", "NSDraggingSession"] }
