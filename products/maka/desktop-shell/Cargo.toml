[package]
name = "maka-desktop-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
base64 = "0.23.1"
sha2.workspace = true
maka-event-log.workspace = true
maka-host-runtime.workspace = true
maka-workbench.workspace = true
nsh-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux.workspace = true

[target.'cfg(windows)'.dependencies]
nsh-platform-windows.workspace = true
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSDraggingItem",
  "NSDraggingSession",
  "NSEvent",
  "NSGraphics",
  "NSOpenPanel",
  "NSPanel",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
block2 = "0.6.2"
raw-window-handle = "0.6"

[dev-dependencies]
tempfile.workspace = true
