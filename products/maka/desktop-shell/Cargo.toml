[package]
name = "maka-desktop-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
maka-event-log.workspace = true
maka-host-runtime.workspace = true
maka-workbench.workspace = true
nsh-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
# Shaders compile at run time, so building needs no Metal Toolchain (macOS).
nsh-platform-gpui = { workspace = true, features = ["runtime-shaders"] }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.10", default-features = false, features = ["font-kit", "wayland", "x11"] }
