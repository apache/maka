[package]
name = "maka-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
zstd.workspace = true
base64 = "0.23.1"
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
open = "5.4.5"
percent-encoding = "2.3.2"
url = "2.5.9"
usvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }
maka-agent-api.workspace = true
maka-agent-facts.workspace = true
maka-app-client.workspace = true
maka-capabilities.workspace = true
maka-event-log.workspace = true
maka-host-runtime.workspace = true
maka-i18n.workspace = true
maka-plugin-core.workspace = true
maka-packages.workspace = true
maka-process.workspace = true
maka-workspace-api.workspace = true
maka-settings-native.workspace = true
maka-ui-support.workspace = true
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["net"] }
nsh-base.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
tempfile.workspace = true
regex.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
unicode-segmentation.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Storage_EnhancedStorage", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
clipboard-win = "5.4.1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["tiff"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSArray", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL"] }

[build-dependencies]
zstd.workspace = true
cc = "1"
maka-ui-build.workspace = true

[dev-dependencies]
nsh-system-controls.workspace = true
nsh-testing = { path = "../../../third-party/nsh/crates/nsh-testing", default-features = false }
nsh-bundler = { workspace = true, features = ["bundle"] }
# The ui_types example writes the specs' TypeScript, which only this feature keeps.
nsh-core = { workspace = true, features = ["declarations"] }
nsh-js.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }
