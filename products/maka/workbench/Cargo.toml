[package]
name = "maka-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
base64 = "0.23.1"
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5.4.5"
percent-encoding = "2.3.2"
url = "2.5.8"
maka-agent-api.workspace = true
maka-agent-facts.workspace = true
maka-app-client.workspace = true
maka-capabilities.workspace = true
maka-event-log.workspace = true
maka-host-runtime.workspace = true
maka-plugin-core.workspace = true
maka-packages.workspace = true
maka-process.workspace = true
maka-workspace-api.workspace = true
maka-settings-native.workspace = true
maka-ui-support.workspace = true
nsh-core.workspace = true
nsh-engine.workspace = true
nsh-base.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
image = { version = "0.25", default-features = false, features = ["tiff"] }

[build-dependencies]
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-core.workspace = true
nsh-base.workspace = true

[dev-dependencies]
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-js.workspace = true
tempfile.workspace = true
