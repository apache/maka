[package]
name = "maka-admin-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "maka-admin"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap.workspace = true
crossterm.workspace = true
hex.workspace = true
jiff.workspace = true
maka-config.workspace = true
maka-event-log.workspace = true
maka-host-runtime.workspace = true
maka-plugin-core.workspace = true
maka-remote-pairing.workspace = true
maka-remote-transport = { workspace = true, features = ["host", "relay-server"] }
maka-sandbox.workspace = true
maka-updater.workspace = true
nsh-base.workspace = true
nsh-core.workspace = true
nsh-engine.workspace = true
nsh-platform-tui = { workspace = true, features = ["run-app"] }
ratatui.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
