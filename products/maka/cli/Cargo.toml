[package]
name = "maka-cli"
default-run = "maka"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["native-desktop"]
native-desktop = ["maka-computer-use/native-desktop"]

[[bin]]
name = "maka"
path = "src/main.rs"

# Internal Windows service entry; the public console command remains `maka`.
[[bin]]
name = "maka-service"
path = "src/service_main.rs"
test = false

[[test]]
name = "terminal_real_host"
path = "../terminal-shell/tests/real_host.rs"

[dependencies]
maka-code-runtime.workspace = true
hex.workspace = true
maka-agent-facts.workspace = true
maka-agent-ports.workspace = true
maka-packages.workspace = true
maka-product-native.workspace = true
maka-settings-native.workspace = true
maka-schema.workspace = true
maka-skills-api.workspace = true
maka-workspace-api.workspace = true
maka-agent-api.workspace = true
maka-host-js.workspace = true
maka-transport.workspace = true
maka-computer-use.workspace = true
maka-acp.workspace = true
maka-config.workspace = true
maka-terminal-shell.workspace = true
maka-plugin-core.workspace = true
base64 = "0.22"
clap.workspace = true
flate2 = "1"
reqwest.workspace = true
semver = "1"
tar = { version = "0.4.46", default-features = false }
maka-host-runtime.workspace = true
maka-event-log.workspace = true
maka-js-runtime.workspace = true
maka-process.workspace = true
maka-sandbox.workspace = true
maka-fs-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true, features = ["io-util"] }
uuid.workspace = true
tempfile.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "tracing-log"] }

[build-dependencies]
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-core.workspace = true
nsh-base.workspace = true

[dev-dependencies]
maka-capabilities.workspace = true
maka-ui-runtime.workspace = true
crossterm.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
maka-agent-native.workspace = true
maka-app-client.workspace = true
maka-files-native.workspace = true
maka-providers.workspace = true
nsh-base.workspace = true
nsh-bundler.workspace = true
nsh-core.workspace = true
nsh-engine.workspace = true
nsh-platform-tui.workspace = true
ratatui.workspace = true
rusqlite.workspace = true
log = "0.4"
schemars.workspace = true
agent-client-protocol.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.5"
futures-util.workspace = true
libc.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Debug", "Win32_System_StationsAndDesktops", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Shared integration fixtures use schema derives from ui-js.
[package.metadata.cargo-machete]
ignored = ["schemars"]
