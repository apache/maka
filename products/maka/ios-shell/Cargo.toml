[package]
name = "maka-ios-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "maka-ios"
path = "src/main.rs"

[dependencies]
log = "0.4.34"
maka-peer.workspace = true
maka-peer-mesh.workspace = true
maka-remote-client.workspace = true
nsh-base.workspace = true
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["js-core", "net"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
uuid.workspace = true

[build-dependencies]
maka-ui-build.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-apple.workspace = true
nsh-platform-ios.workspace = true

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
maka-agent-api.workspace = true
maka-agent-facts.workspace = true
maka-agent-ports.workspace = true
maka-event-log.workspace = true
maka-fs-tools.workspace = true
maka-host-runtime.workspace = true
maka-packages.workspace = true
maka-plugin-core.workspace = true
maka-sandbox.workspace = true
maka-scheduler.workspace = true
nsh-testing.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
