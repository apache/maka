[package]
name = "maka-ios-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "maka-ios-shell"
path = "src/main.rs"

[dependencies]
log = "0.4.34"
maka-remote-client.workspace = true
nsh-base.workspace = true
nsh-core.workspace = true
nsh-engine = { workspace = true, features = ["js-core"] }
nsh-system-controls.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

tokio-util.workspace = true

[build-dependencies]
maka-ui-build.workspace = true
nsh-system-controls.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "AVAnimation", "AVCaptureDevice", "AVCaptureInput", "AVCaptureMetadataOutput",
    "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureVideoPreviewLayer",
    "AVMediaFormat", "AVMetadataObject", "block2", "dispatch2", "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIResponder", "UIView", "objc2-quartz-core"] }
core-foundation = "0.10.1"
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
zeroize = "1"
nsh-platform-apple = { path = "../../../third-party/nsh/crates/nsh-platform-apple" }
nsh-platform-ios = { path = "../../../third-party/nsh/crates/nsh-platform-ios", default-features = false, features = ["js", "math"] }

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
nsh-testing = { path = "../../../third-party/nsh/crates/nsh-testing" }
tempfile.workspace = true
maka-agent-api.workspace = true
maka-agent-facts.workspace = true
maka-event-log.workspace = true
maka-host-runtime.workspace = true
maka-packages.workspace = true
maka-web.workspace = true
maka-web-api.workspace = true
maka-remote-transport = { workspace = true, features = ["host", "relay-server"] }
uuid.workspace = true
hex.workspace = true
maka-remote-pairing.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
