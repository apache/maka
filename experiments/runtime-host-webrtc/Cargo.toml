[package]
name = "maka-runtime-host-webrtc-experiment"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
libp2p = { version = "0.56", features = [
  "dcutr",
  "identify",
  "macros",
  "noise",
  "ping",
  "quic",
  "relay",
  "tcp",
  "tokio",
  "yamux",
] }
libp2p-stream = "0.4.0-alpha"
libp2p-webrtc-utils = "0.4"
prost = "0.14"
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
unsigned-varint = "0.8"
webrtc = { git = "https://github.com/webrtc-rs/webrtc", rev = "e132552fc67b84c30e63c5ce916a9a63e2484b6f" }
