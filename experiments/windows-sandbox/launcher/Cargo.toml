[package]
name = "maka-windows-sandbox-spike"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "maka-windows-sandbox"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  # CreateDesktopW's signature references DEVMODEW (passed as null here), so
  # windows-sys only exposes it when Win32_Graphics_Gdi is also enabled.
  "Win32_Graphics_Gdi",
  "Win32_Security",
  # BCryptGenRandom: CSPRNG nonce for per-launch desktop names.
  "Win32_Security_Cryptography",
  "Win32_Security_Isolation",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
] }
