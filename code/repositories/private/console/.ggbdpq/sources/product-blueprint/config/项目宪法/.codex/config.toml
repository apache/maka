model = "gpt-5.4"
model_provider = "openai"
approval_policy = "never"
sandbox_mode = "workspace-write"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"
model_verbosity = "medium"
file_opener = "cursor"
project_doc_max_bytes = 32768
check_for_update_on_startup = true
hide_agent_reasoning = false
disable_paste_burst = false
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "auto"
web_search = "live"
suppress_unstable_features_warning = true
personality = "pragmatic"
notify = [ "/usr/bin/env", "node", "/Users/ggbdpq/.vibeusage/bin/notify.cjs" ]

[sandbox_workspace_write]
writable_roots = []
network_access = true
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = true
exclude = [ "AWS_*", "AZURE_*", "GCP_*", "*TOKEN*", "*SECRET*", "*KEY*" ]
include_only = [ "PATH", "HOME", "SHELL", "LANG", "LC_ALL" ]
experimental_use_profile = false

[shell_environment_policy.set]
[history]
persistence = "save-all"
max_bytes = 104857600

[features]
shell_tool = true
exec_policy = true
shell_snapshot = true
unified_exec = false
apply_patch_freeform = false
remote_compaction = true
remote_models = false
powershell_utf8 = true
child_agents_md = false
voice_transcription = true

[mcp_servers.context7]
type = "stdio"
command = "npx"
args = [ "-y", "@upstash/context7-mcp" ]

[mcp_servers.pencil]
command = "/Users/ggbdpq/.pencil/mcp/visual_studio_code/out/mcp-server-darwin-arm64"
args = [ "--app", "visual_studio_code" ]

[notice.model_migrations]
"gpt-5.2" = "gpt-5.3-codex"

