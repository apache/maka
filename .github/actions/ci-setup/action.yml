name: CI setup
description: Prepare the selected worker and cache reusable Rust dependencies.
inputs:
  role:
    description: Stable worker identity.
    required: true
  workspace:
    description: Owning Cargo workspace.
    default: root
  dependencies:
    description: Linux native dependency group.
    default: ""
  javascript:
    description: Install locked npm dependencies.
    default: "false"
  compile:
    description: Cache compiler outputs.
    default: "true"
  nextest:
    description: Producer version for archive consumers; otherwise resolve latest.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "26"
        package-manager-cache: false
    - name: Update Rust
      if: inputs.role != 'replay'
      shell: bash
      run: rustup update stable --no-self-update
    - name: Select Rust tools
      id: tools
      shell: bash
      env:
        MAKA_CI_ROLE: ${{ inputs.role }}
        MAKA_CI_WORKSPACE: ${{ inputs.workspace }}
        MAKA_CI_NEXTEST: ${{ inputs.nextest }}
      run: node scripts/ci/setup.mjs tool-list
    - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
      if: steps.tools.outputs.tools != ''
      with:
        tool: cargo-binstall
    - name: Install Rust tools
      if: steps.tools.outputs.tools != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MAKA_CI_ROLE: ${{ inputs.role }}
        MAKA_CI_NEXTEST: ${{ inputs.nextest }}
      run: node scripts/ci/setup.mjs tools
    - name: Install native dependencies
      if: runner.os == 'Linux' && inputs.dependencies != ''
      shell: bash
      env:
        MAKA_CI_DEPENDENCIES: ${{ inputs.dependencies }}
      run: node scripts/ci/setup.mjs native
    - name: Cache Rust dependencies
      if: inputs.role != 'replay'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        shared-key: ${{ inputs.role }}
        workspaces: ${{ steps.tools.outputs.workspace }} -> ${{ github.workspace }}/target
        cache-targets: ${{ inputs.compile }}
        cache-bin: false
    - uses: actions/cache@v6
      if: inputs.javascript == 'true'
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-
    - name: Install JavaScript dependencies
      if: inputs.javascript == 'true'
      shell: bash
      run: |
        npm install --global --no-audit --no-fund npm@latest
        node scripts/setup.mjs
