name: Publish compiler cache
description: Keep reusable dependencies even when a behavior test fails.
inputs:
  key:
    description: Compiler cache key from setup.
    required: true
  hit:
    description: Whether the exact compiler cache already exists.
    required: true
  workspace:
    description: Owning Cargo workspace.
    default: root
runs:
  using: composite
  steps:
    - name: Keep only reusable compiler outputs
      if: inputs.hit != 'true'
      shell: bash
      env:
        MAKA_CI_WORKSPACE: ${{ inputs.workspace }}
      run: node scripts/ci/setup.mjs prune
    - uses: actions/cache/save@v6
      if: inputs.hit != 'true'
      with:
        path: |
          target/**/.fingerprint
          target/**/build
          target/**/deps/*.*
          !target/**/deps/*.exe
        key: ${{ inputs.key }}
