name: Computer Use Contracts

on:
  push:
    branches: [ci/computer-use-contracts]

permissions:
  contents: read

concurrency:
  group: computer-use-contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update Rust
        run: rustup update stable --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libx11-dev libxi-dev libxtst-dev libxext-dev libxrandr-dev libxfixes-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev libssl-dev
      - name: Check native computer-use library
        run: cargo check --locked -p maka-computer-use --lib --features native-desktop
      - name: Compare native key error formatting
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PYORACLE'
          import base64, hashlib, os, pathlib, subprocess
          script = pathlib.Path(os.environ["RUNNER_TEMP"]) / "maka-alias-oracle.py"
          script.write_bytes(base64.b64decode(""))
          assert hashlib.sha256(script.read_bytes()).hexdigest() == "b4487dd6195fd01d09aa1a9aae9c9432b142a2a00b8f9ac1a9e62b28220da15e"
          subprocess.run(["python3", str(script), "--source", "platform/computer-use/src/macos/keyboard/aliases.rs", "--expected-source-sha256", "cd7ca9243e095568e3f08e14df5a3ffc9b89ecf0d3b1a009c6da84cc78244e04", "--lockfile", "Cargo.lock", "--expected-lockfile-sha256", "e3480b7eadf2abc5641addea0710fd7338c6301b17a8ff027d824e261c53fa38", "--output-dir", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "alias-format-oracle")], check=True)
          PYORACLE
      - name: Preserve native formatting evidence
        if: ${{ always() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-native-error-formatting
          path: ${{ runner.temp }}/alias-format-oracle/
          if-no-files-found: warn
          retention-days: 7

