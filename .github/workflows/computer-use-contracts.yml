name: Computer Use Contracts

on:
  push:
    branches: [ci/computer-use-contracts]

permissions:
  contents: read

concurrency:
  group: computer-use-contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update Rust
        run: rustup update stable --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check native computer-use library
        run: cargo check --locked -p maka-computer-use --lib --features native-desktop
      - name: Compare native key-group error descriptions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PYGROUP'
          import base64, hashlib, os, pathlib, subprocess
          script = pathlib.Path(os.environ["RUNNER_TEMP"]) / "maka-group-error-oracle.py"
          data = base64.b64decode('')
          assert hashlib.sha256(data).hexdigest() == 'd23d2f09e7a20d5f1907e271da0801e0b8ee70257dc8f8b28b34552dd7371202'
          script.write_bytes(data)
          subprocess.run(["python3", str(script), "--source", "platform/computer-use/src/macos/keyboard/aliases.rs", "--expected-source-sha256", 'f88bd98b407b8e7d148c5eb4d478eddd431157aaffeef5f4064c2ee0f5664000', "--lockfile", "Cargo.lock", "--expected-lockfile-sha256", '62164097a091ab3ed0cf3c14531e33ef0f7611e4c853f7e1407e1685e85eebf6', "--output-dir", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "group-error-oracle")], check=True)
          PYGROUP
      - name: Preserve group-description evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && runner.os == 'macOS' }}
        with:
          name: macos-key-group-errors
          path: ${{ runner.temp }}/group-error-oracle/
          if-no-files-found: error
          retention-days: 7
