name: ASF source candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version from the root package.json
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: asf-source-${{ github.sha }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CANDIDATE_PATH: release/asf/apache-maka-${{ inputs.version }}-incubating-src.tar.gz
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Update Rust
        run: rustup update stable --no-self-update
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.59.0,cargo-nextest@0.9.149,cargo-deny
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep pkg-config libx11-dev libxi-dev libxtst-dev libxext-dev
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Select npm
        run: npm install --global --no-audit --no-fund "$(node -p 'require("./package.json").packageManager')"
      - name: Create source candidate
        run: just source "$RELEASE_VERSION" "$GITHUB_SHA"
      - name: Extract exact candidate
        run: |
          mkdir candidate-source
          tar -xzf "$CANDIDATE_PATH" --strip-components=1 -C candidate-source
      - name: Audit extracted source
        working-directory: candidate-source
        run: node scripts/asf-license-headers.mjs check --report
      - name: Install extracted dependencies
        working-directory: candidate-source
        run: just setup
      - name: Verify extracted source
        working-directory: candidate-source
        run: |
          just check
          just build
          target/debug/maka --version
      - name: Verify website
        working-directory: candidate-source
        run: |
          just website-setup
          just website-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asf-source-candidate
          path: release/asf/*
          if-no-files-found: error
