name: PR triage

# Every trigger here is an event that can change which of the two questions a
# pull request answers differently: whose move it is, and how much reading it
# is. CI finishing is one of those, so the CI workflow completing re-runs this
# as well; without it a pull request would sit mislabelled until its next push.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    pr-triage-${{ github.event.pull_request.number
      || github.event.workflow_run.id
      || github.run_id }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # pull_request_target runs with a writable token against fork pull
      # requests. This checkout is the base branch, never the pull request head,
      # and nothing from the pull request is executed or installed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require("node:path")
            const { pathToFileURL } = require("node:url")

            const { planLabels } = await import(
              pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, "scripts/pr-triage.mjs")).href
            )

            const { owner, repo } = context.repo

            // workflow_run carries the head SHA rather than a pull request, so
            // the run is mapped back to whatever pull requests that SHA heads.
            async function resolveNumbers() {
              const fromEvent = context.payload.pull_request?.number
              if (fromEvent) return [fromEvent]

              const sha = context.payload.workflow_run?.head_sha
              if (!sha) return []

              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              })
              return data.filter((pull) => pull.state === "open").map((pull) => pull.number)
            }

            for (const pull_number of await resolveNumbers()) {
              const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number })

              // Re-read the head from the API rather than trusting the event
              // payload: a push racing this run would otherwise let a stale
              // approval be projected as merge-ready.
              const headSha = pull.head.sha

              const [checks, reviews, files, current] = await Promise.all([
                github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: headSha,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number, per_page: 100 }),
                github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 }),
                github.paginate(github.rest.issues.listLabelsOnIssue, {
                  owner,
                  repo,
                  issue_number: pull_number,
                  per_page: 100,
                }),
              ])

              const plan = planLabels(
                {
                  isDraft: pull.draft,
                  headSha,
                  authorLogin: pull.user?.login,
                  checks: checks.map((check) => ({
                    status: check.status,
                    conclusion: check.conclusion,
                  })),
                  reviews,
                  files,
                },
                current.map((label) => label.name),
              )

              if (plan.addLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pull_number,
                  labels: plan.addLabels,
                })
              }

              for (const name of plan.removeLabels) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name })
                } catch (error) {
                  // Another run may have removed it first; anything else is real.
                  if (error.status !== 404) throw error
                }
              }

              core.info(
                `#${pull_number}: status=${plan.status ?? "(none)"} effort=${plan.effort ?? "(none)"}` +
                  ` +[${plan.addLabels.join(", ")}] -[${plan.removeLabels.join(", ")}]`,
              )
            }
