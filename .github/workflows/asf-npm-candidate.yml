name: Prepare ASF npm candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Apache Maka and maka-agent version
        required: true
        type: string
      rc_number:
        description: Positive ASF source release-candidate number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: asf-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Resolve ASF source candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_candidate_tag: ${{ steps.source.outputs.source_candidate_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact ASF source candidate tag
        id: source
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          node scripts/release-version.mjs "$RELEASE_VERSION"
          node -e "if (!/^[1-9]\\d*$/.test(process.env.RC_NUMBER)) throw new Error('RC number must be a positive integer')"
          source_candidate_tag="v${RELEASE_VERSION}-incubating-rc${RC_NUMBER}"
          if [[ "$RELEASE_REF" != "refs/tags/$source_candidate_tag" ]]; then
            echo "ASF npm candidates must be dispatched from $source_candidate_tag; found $RELEASE_REF" >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "refs/tags/$source_candidate_tag:refs/tags/$source_candidate_tag"
          test "$(git cat-file -t "refs/tags/$source_candidate_tag")" = tag
          source_commit="$(git rev-parse "refs/tags/$source_candidate_tag^{commit}")"
          test "$source_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$source_commit" origin/main
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "source_candidate_tag=$source_candidate_tag" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate immutable npm candidate
    needs: authorize
    permissions:
      contents: read
    uses: ./.github/workflows/cli-package-validation.yml
    with:
      source_commit: ${{ needs.authorize.outputs.source_commit }}

  handoff:
    name: Record unsigned ASF npm candidate
    needs: [authorize, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Download the exact validated npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.release_candidate_artifact_id }}
          path: packages/cli/release
      - name: Bind the npm candidate to the ASF source RC
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_CANDIDATE_TAG: ${{ needs.authorize.outputs.source_candidate_tag }}
          SOURCE_COMMIT: ${{ needs.authorize.outputs.source_commit }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          npm run release:asf:npm:record -- \
            packages/cli/release \
            "$RELEASE_VERSION" \
            "$SOURCE_CANDIDATE_TAG" \
            "$SOURCE_COMMIT" \
            "$RELEASE_RUN_ID" \
            "$RELEASE_RUN_ATTEMPT"
          npm run release:asf:npm:verify -- \
            "packages/cli/release/maka-agent-${RELEASE_VERSION}.tgz.asf-candidate.json"
      - name: Upload the unsigned ASF npm candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apache-maka-${{ inputs.version }}-incubating-rc${{ inputs.rc_number }}-npm-${{ needs.authorize.outputs.source_commit }}-unsigned
          path: |
            packages/cli/release/*.tgz
            packages/cli/release/*.tgz.sha256
            packages/cli/release/*.tgz.sha512
            packages/cli/release/*.tgz.files.json
            packages/cli/release/*.tgz.asf-candidate.json
          if-no-files-found: error
          retention-days: 14
      - name: Record Release Manager handoff
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_CANDIDATE_TAG: ${{ needs.authorize.outputs.source_candidate_tag }}
          SOURCE_COMMIT: ${{ needs.authorize.outputs.source_commit }}
          RUNBOOK_URL: https://github.com/${{ github.repository }}/blob/${{ needs.authorize.outputs.source_commit }}/.github/ASF_NPM_RELEASE.md
        run: |
          {
            echo "## Unsigned ASF npm convenience candidate"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- ASF source candidate: \`$SOURCE_CANDIDATE_TAG\`"
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- Runbook: $RUNBOOK_URL"
            echo
            echo "This workflow does not publish to npm and does not establish source-release approval."
          } >> "$GITHUB_STEP_SUMMARY"
