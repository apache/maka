name: Computer Use

on:
  pull_request:
    branches: [main, rust-preview]
    paths:
      - .github/workflows/computer-use.yml
      - Cargo.toml
      - Cargo.lock
      - platform/computer-use/**
  push:
    branches: [rust-preview]
    paths:
      - .github/workflows/computer-use.yml
      - Cargo.toml
      - Cargo.lock
      - platform/computer-use/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-use-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update Rust
        run: rustup update stable --no-self-update
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libx11-dev libxi-dev libxtst-dev libxext-dev libxrandr-dev libxfixes-dev libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev libssl-dev
      - name: Check native computer-use library
        run: cargo check --locked -p maka-computer-use --lib --features native-desktop
