name: Release macOS arm64

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-arm64
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    timeout-minutes: 45

    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_Maka.p8
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"

      - name: Resolve and reserve release identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          tag="v${version}"
          dmg="apps/desktop/release/Maka-${version}-mac-arm64.dmg"
          zip="apps/desktop/release/Maka-${version}-mac-arm64.zip"
          update_yml="apps/desktop/release/latest-mac.yml"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists." >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "dmg=${dmg}"
            echo "zip=${zip}"
            echo "update_yml=${update_yml}"
          } >> "$GITHUB_OUTPUT"

      - name: Package signed and notarized DMG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_Maka.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run package:macos-arm64

      - name: Remove the temporary notarization key
        run: rm -f "${{ runner.temp }}/AuthKey_Maka.p8"

      - name: Verify the final DMG
        run: npm run verify:macos-arm64 -- "${{ steps.release.outputs.dmg }}"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DMG_PATH: ${{ steps.release.outputs.dmg }}
        run: |
          notes="Apple Silicon macOS release built from commit ${GITHUB_SHA}.

          Before publishing, download this draft asset on another Apple Silicon Mac and complete .github/RELEASE_CHECKLIST.md.

          Known limitation: Computer Use is not included in this release."

          gh release create "$RELEASE_TAG" \
            "$DMG_PATH" \
            "${DMG_PATH}.sha256" \
            "${{ steps.release.outputs.zip }}" \
            "${{ steps.release.outputs.update_yml }}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Maka ${RELEASE_VERSION}" \
            --notes "$notes"

          echo "Draft release ${RELEASE_TAG} created from ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure the temporary notarization key is removed
        if: always()
        run: rm -f "${{ runner.temp }}/AuthKey_Maka.p8"
