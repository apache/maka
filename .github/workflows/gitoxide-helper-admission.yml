name: Gitoxide helper admission

on:
  pull_request:
    paths:
      - 'packages/runtime-host/src/**'
      - 'packages/core/src/session.ts'
      - 'apps/desktop/src/**'
      - 'packages/ui/src/**'
      - '.github/workflows/gitoxide-helper-admission.yml'
      - 'native/gitoxide-helper/**'
      - 'packages/runtime-host/src/server/gitoxide-helper-*.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-helper-*.test.ts'
      - 'packages/runtime-host/src/server/gitoxide-repository-admission-authority-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-workspace-baseline-owner-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-candidate-settlement-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-mutation-admission-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-runtime-mutation-internal.ts'
      - 'packages/runtime/src/tool-runtime.ts'
      - 'packages/runtime/src/__tests__/tool-runtime-durable-boundary.test.ts'
      - 'packages/runtime/src/managed-mutation-transform.ts'
      - 'packages/runtime/src/edit-replace.ts'
      - 'packages/runtime/src/unified-diff.ts'
      - 'packages/runtime/package.json'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-baseline-reopen-child.ts'
      - 'packages/runtime/src/continuation-safety.ts'
      - 'packages/runtime/src/runtime-kernel.ts'
      - 'packages/runtime/src/runtime-resume.ts'
      - 'packages/runtime/src/session-manager.ts'
      - 'packages/runtime/src/__tests__/runtime-continuation.test.ts'
      - 'packages/runtime/src/__tests__/session-manager.test.ts'
      - 'packages/storage/src/**'
      - 'packages/runtime-host/src/__tests__/gitoxide-repository-admission-authority-internal.test.ts'
      - 'docs/architecture/gitoxide-*.md'
  push:
    branches:
      - main
    paths:
      - 'packages/runtime-host/src/**'
      - 'packages/core/src/session.ts'
      - 'apps/desktop/src/**'
      - 'packages/ui/src/**'
      - '.github/workflows/gitoxide-helper-admission.yml'
      - 'native/gitoxide-helper/**'
      - 'packages/runtime-host/src/server/gitoxide-helper-*.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-helper-*.test.ts'
      - 'packages/runtime-host/src/server/gitoxide-repository-admission-authority-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-workspace-baseline-owner-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-candidate-settlement-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-mutation-admission-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-runtime-mutation-internal.ts'
      - 'packages/runtime/src/tool-runtime.ts'
      - 'packages/runtime/src/__tests__/tool-runtime-durable-boundary.test.ts'
      - 'packages/runtime/src/managed-mutation-transform.ts'
      - 'packages/runtime/src/edit-replace.ts'
      - 'packages/runtime/src/unified-diff.ts'
      - 'packages/runtime/package.json'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-baseline-reopen-child.ts'
      - 'packages/runtime/src/continuation-safety.ts'
      - 'packages/runtime/src/runtime-kernel.ts'
      - 'packages/runtime/src/runtime-resume.ts'
      - 'packages/runtime/src/session-manager.ts'
      - 'packages/runtime/src/__tests__/runtime-continuation.test.ts'
      - 'packages/runtime/src/__tests__/session-manager.test.ts'
      - 'packages/storage/src/**'
      - 'packages/runtime-host/src/__tests__/gitoxide-repository-admission-authority-internal.test.ts'
      - 'docs/architecture/gitoxide-*.md'

permissions:
  contents: read

concurrency:
  group: gitoxide-helper-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - id: rustc
        name: Resolve Rust cache version
        shell: bash
        run: |
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "KACHE_CACHE_DIR=${{ runner.temp }}/kache"
            echo "KACHE_RUNTIME_DIR=${{ runner.temp }}/kache-runtime"
            echo "RUSTC_WRAPPER=kache"
          } >> "$GITHUB_ENV"
      - name: Install Kache
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: kache@0.16.0
      - id: kache-cache
        name: Restore Rust build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kache
          key: kache-gitoxide-helper-test-v0.16.0-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rustc.outputs.version }}-${{ steps.rustc.outputs.revision }}
          restore-keys: |
            kache-gitoxide-helper-test-v0.16.0-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rustc.outputs.version }}-
      - name: Check Rust formatting
        working-directory: native/gitoxide-helper
        run: cargo fmt --check
      - name: Test the short-lived Gitoxide helper
        working-directory: native/gitoxide-helper
        run: cargo test --locked
      - name: Report Rust build cache
        shell: bash
        run: |
          set -o pipefail
          kache report --format github | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save Rust build cache
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kache
          key: ${{ steps.kache-cache.outputs.cache-primary-key }}
      - name: Install JavaScript dependencies without packaging hooks
        run: npm ci --ignore-scripts
      - name: Build the helper invocation owner
        run: >-
          npm --workspace @maka/core run build &&
          npm --workspace @maka/storage run build &&
          npm --workspace @maka/runtime run build &&
          npm --workspace @maka/runtime-host run build
      - name: Test the real helper invocation contract
        env:
          MAKA_GITOXIDE_HELPER_PATH: ${{ github.workspace }}/native/gitoxide-helper/target/debug/maka-gitoxide-helper${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >-
          node --test
          packages/runtime/dist/__tests__/tool-runtime-durable-boundary.test.js
          packages/runtime/dist/__tests__/runtime-continuation.test.js
          packages/runtime/dist/__tests__/session-manager.test.js
          packages/runtime-host/dist/__tests__/gitoxide-helper-artifact-authority-internal.test.js
          packages/runtime-host/dist/__tests__/gitoxide-helper-invocation-internal.test.js
          packages/runtime-host/dist/__tests__/gitoxide-repository-admission-authority-internal.test.js
      - name: Test managed task creation and pinned developer admission
        env:
          MAKA_GITOXIDE_HELPER_PATH: ${{ github.workspace }}/native/gitoxide-helper/target/debug/maka-gitoxide-helper${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >-
          node --test --test-force-exit
          --test-name-pattern="managed|development helper|prepared create|metadata 39|stable create|execution capability query|root backend preparation|pins the selected helper|forwards its pinned helper"
          packages/runtime-host/dist/__tests__/managed-files-dev-bootstrap.test.js
          packages/runtime-host/dist/__tests__/execution-composition-factory.test.js
          packages/runtime-host/dist/__tests__/execution-model-composition.test.js
          packages/runtime-host/dist/__tests__/hosted-execution-tool-profile.test.js
          packages/runtime-host/dist/__tests__/session-catalog-coordinator.test.js
          packages/runtime-host/dist/__tests__/handshake-compatibility.test.js
          packages/runtime-host/dist/__tests__/protocol.test.js
          packages/storage/dist/__tests__/sqlite-session-metadata-store.test.js
