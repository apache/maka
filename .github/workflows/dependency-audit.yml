name: Dependency audit

on:
  schedule:
    # Offset from the hour to reduce peak-time scheduling delays.
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/dependency-audit.yml
      - scripts/rust/dependencies.mjs
      - deny.toml
      - Cargo.toml
      - Cargo.lock
      - "platform/**/Cargo.toml"
      - "plugins/**/Cargo.toml"
      - "products/**/Cargo.toml"
      - "tools/**/Cargo.toml"
      - products/maka/cli/DEPENDENCIES.rust.tsv
      - package.json
      - package-lock.json
      - "packages/*/package.json"
  push:
    branches: [main]
    paths:
      - .github/workflows/dependency-audit.yml
      - scripts/rust/dependencies.mjs
      - deny.toml
      - Cargo.toml
      - Cargo.lock
      - "platform/**/Cargo.toml"
      - "plugins/**/Cargo.toml"
      - "products/**/Cargo.toml"
      - "tools/**/Cargo.toml"
      - products/maka/cli/DEPENDENCIES.rust.tsv
      - package.json
      - package-lock.json
      - "packages/*/package.json"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Update stable Rust for dependency resolution
        run: rustup update stable --no-self-update
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-binstall
      - name: Install latest Rust tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo binstall --no-confirm --force cargo-binstall
          cargo binstall --no-confirm --force cargo-deny
      - name: Check Rust licenses and dependency inventory
        run: node scripts/rust/dependencies.mjs check

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify registry signatures
        run: npm audit signatures
