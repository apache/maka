name: Build Distribution Artifacts

on:
  workflow_call:
    inputs:
      channel:
        description: Distribution channel (nightly or release)
        required: true
        type: string
      version:
        description: Exact package version
        required: true
        type: string
      commit:
        description: Exact commit SHA to check out and build
        required: true
        type: string
      environment:
        description: GitHub environment supplying signing secrets and updater public key
        required: true
        type: string
      pack_npm:
        description: Whether to build npm platform packages
        required: true
        type: boolean
      v8_linux_arm64_key:
        description: V8 cache key for aarch64-unknown-linux-gnu
        required: true
        type: string
      v8_linux_arm64_pinned:
        description: Whether the Linux ARM64 V8 prebuilt is pinned
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  v8-linux-arm64:
    if: ${{ !cancelled() && inputs.v8_linux_arm64_pinned != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Update Rust and add Linux ARM64 target
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-unknown-linux-gnu

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install V8 bindgen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev llvm-dev
          echo "LIBCLANG_PATH=$(/usr/bin/llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Restore Linux ARM64 V8 cache
        id: v8-cache
        uses: actions/cache/restore@v6
        with:
          path: target/v8/${{ inputs.v8_linux_arm64_key }}
          key: maka-v8-linux-arm64-gnu-${{ inputs.v8_linux_arm64_key }}

      - name: Cross-compile V8 for aarch64-unknown-linux-gnu on linux/x64
        run: |
          node scripts/rust/build-v8.mjs --build             --target aarch64-unknown-linux-gnu             --cache target/v8             --export v8-staged

      - name: Save Linux ARM64 V8 cache
        uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.v8-cache.outputs.cache-hit != 'true' && hashFiles(format('target/v8/{0}/receipt.json', inputs.v8_linux_arm64_key)) != '' }}
        with:
          path: target/v8/${{ inputs.v8_linux_arm64_key }}
          key: maka-v8-linux-arm64-gnu-${{ inputs.v8_linux_arm64_key }}

      - name: Upload staged Linux ARM64 V8 bundle for native ARM64 build and smoke
        uses: actions/upload-artifact@v7
        with:
          name: v8-linux-arm64-staged
          path: v8-staged/*
          if-no-files-found: error
          compression-level: 0

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: win32-x64
            runner: windows-latest
    uses: ./.github/workflows/build-distribution-target.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
      environment: ${{ inputs.environment }}
      pack_npm: ${{ inputs.pack_npm }}
    secrets: inherit

  build-linux-x64:
    uses: ./.github/workflows/build-distribution-target.yml
    with:
      target: linux-x64-gnu
      runner: ubuntu-latest
      channel: ${{ inputs.channel }}
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
      environment: ${{ inputs.environment }}
      pack_npm: ${{ inputs.pack_npm }}
    secrets: inherit

  build-linux-arm64:
    needs: [v8-linux-arm64]
    if: >-
      !cancelled() &&
      (needs.v8-linux-arm64.result == 'success' || needs.v8-linux-arm64.result == 'skipped')
    runs-on: ubuntu-26.04-arm
    environment: ${{ inputs.environment }}
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MAKA_UPDATE_REPO: ${{ github.repository }}
      MAKA_UPDATE_PUBLIC_KEY: ${{ vars.MAKA_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Update Rust
        run: rustup update stable --no-self-update

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev llvm-dev libssl-dev libglib2.0-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxi-dev libxtst-dev libxext-dev libxcb1-dev libxrandr-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          echo "LIBCLANG_PATH=$(/usr/bin/llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Set up Zig (Linux glibc 2.28 baseline)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: latest

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-zigbuild

      - name: Install JavaScript build dependencies
        run: |
          npm ci --include=dev --include=optional --ignore-scripts --no-audit --no-fund
          node scripts/apply-dependency-patches.mjs

      - name: Identify Cargo download cache
        id: rust-cache-keys
        env:
          MAKA_CI_ROLE: nightly-release-linux-arm64-gnu
          MAKA_CI_WORKSPACE: root
          MAKA_CI_PROFILE: dist
        run: node scripts/ci/setup.mjs keys

      - name: Restore shared Cargo downloads
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/.rusty_v8
          key: ${{ steps.rust-cache-keys.outputs.downloads }}
          restore-keys: ${{ steps.rust-cache-keys.outputs.downloads_prefix }}
          enableCrossOsArchive: true

      - name: Compute V8 cache key
        id: v8-key
        run: echo "key=$(node scripts/rust/build-v8.mjs --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore V8 cache
        id: v8-cache
        uses: actions/cache/restore@v6
        with:
          path: target/v8/${{ steps.v8-key.outputs.key }}
          key: maka-v8-linux-arm64-gnu-${{ steps.v8-key.outputs.key }}

      - name: Download cross-built Linux ARM64 V8 bundle
        if: >-
          inputs.v8_linux_arm64_pinned != 'true' &&
          steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: v8-linux-arm64-staged
          path: v8-staged

      - name: Stage Linux ARM64 V8 bundle into cache
        if: >-
          inputs.v8_linux_arm64_pinned != 'true' &&
          steps.v8-cache.outputs.cache-hit != 'true'
        env:
          V8_KEY: ${{ steps.v8-key.outputs.key }}
        run: |
          dest="target/v8/$V8_KEY"
          mkdir -p "$dest"
          tar -xzf "v8-staged/v8-aarch64-unknown-linux-gnu-${V8_KEY}.tar.gz" -C "$dest"

      - name: Build, smoke test, and package artifacts
        id: build
        env:
          V8_CACHE_KEY: ${{ steps.v8-key.outputs.key }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          PACK_NPM: ${{ inputs.pack_npm }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm_args=()
          if [[ "$PACK_NPM" == "true" ]]; then
            npm_args+=(--npm-output npm-out)
          fi
          node scripts/rust/package-nightly.mjs build \
            --channel "$RELEASE_CHANNEL" \
            --target "linux-arm64-gnu" \
            --version "$RELEASE_VERSION" \
            --output dist-out \
            "${npm_args[@]}" \
            --v8-output v8-out

      - name: Upload installers and update archives
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.channel }}-pkg-linux-arm64-gnu
          path: dist-out/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload npm platform package
        if: inputs.pack_npm
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.channel }}-npm-linux-arm64-gnu
          path: npm-out/*.tgz
          if-no-files-found: error
          compression-level: 0

      - name: Upload newly built V8 prebuilt (when not yet pinned)
        if: ${{ hashFiles('v8-out/*.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: v8-prebuilt-linux-arm64-gnu
          path: v8-out/*
          if-no-files-found: error
          compression-level: 0

  compat-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          role: compat-harness
          stage_v8: "false"

      - name: Build upgrade compatibility harness
        run: cargo build --locked -p maka-upgrade-compat

      - name: Upload upgrade compatibility harness
        uses: actions/upload-artifact@v7
        with:
          name: compat-harness-linux-x64
          path: target/debug/maka-upgrade-compat
          if-no-files-found: error

      - name: Save harness dependencies
        uses: actions/cache/save@v6
        if: steps.setup.outputs.compiled_hit != 'true'
        with:
          path: |
            target/CACHEDIR.TAG
            target/**/.fingerprint
            target/**/build
            target/**/gn_out
            target/**/deps/*.*
            !target/**/deps/*.exe
          key: ${{ steps.setup.outputs.compiled_key }}

  compat-gate:
    needs: [build-linux-x64, compat-harness]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Verify immutable migration ledger
        run: node scripts/ci.mjs check migrations

      - name: Install Linux runtime libraries for the candidate
        run: sudo apt-get install -y --no-install-recommends libx11-6 libxi6 libxkbcommon0

      - name: Download built Linux x64 archive
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.channel }}-pkg-linux-x64-gnu
          path: compat-pkg

      - name: Extract release maka binary
        id: extract-bin
        env:
          ARCHIVE_NAME: ${{ inputs.channel == 'release' && format('Maka-{0}-linux-x64.tar.gz', inputs.version) || 'Maka-nightly-linux-x64.tar.gz' }}
        run: |
          mkdir -p compat-bin
          tar -xzf "compat-pkg/$ARCHIVE_NAME" -C compat-bin
          bin_path="$(find compat-bin -maxdepth 3 -type f -name maka -perm -111 | head -n 1)"
          if [[ -z "$bin_path" ]]; then
            echo "::error::Could not find executable maka binary inside $ARCHIVE_NAME"
            exit 1
          fi
          echo "bin=$bin_path" >> "$GITHUB_OUTPUT"
          "$bin_path" --version

      - name: Download upgrade compatibility harness
        uses: actions/download-artifact@v8
        with:
          name: compat-harness-linux-x64
          path: compat-harness

      - name: Make the downloaded harness executable
        run: chmod +x compat-harness/maka-upgrade-compat

      - name: Produce candidate time capsule and verify self-roundtrip
        env:
          MAKA_BIN: ${{ steps.extract-bin.outputs.bin }}
          GITHUB_SHA: ${{ inputs.commit }}
        run: |
          node scripts/rust/compat-capsule.mjs produce \
            --bin "$MAKA_BIN" \
            --test-bin compat-harness/maka-upgrade-compat \
            --out compat-capsule.tar.gz
          node scripts/rust/compat-capsule.mjs verify \
            --bin "$MAKA_BIN" \
            --test-bin compat-harness/maka-upgrade-compat \
            --capsule compat-capsule.tar.gz

      - name: Verify upgrade from all retained historical time capsules
        env:
          GH_TOKEN: ${{ github.token }}
          MAKA_BIN: ${{ steps.extract-bin.outputs.bin }}
        run: |
          node scripts/rust/compat-capsule.mjs verify-release \
            --bin "$MAKA_BIN" \
            --test-bin compat-harness/maka-upgrade-compat \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload verified candidate time capsule
        uses: actions/upload-artifact@v7
        with:
          name: compat-capsule-candidate
          path: compat-capsule.tar.gz
          if-no-files-found: error
          compression-level: 0
