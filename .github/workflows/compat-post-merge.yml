name: Upgrade Compatibility (Post-Merge)

# Runs after commits land on main (not on ordinary PRs) to replay historical
# State Root time capsules against the newly built maka binary and catch
# forward-upgrade regressions the same day they merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-post-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/ci-setup
        with:
          role: compat-post-merge
          cache_role: root
          dependencies: headless
          javascript: "true"

      - name: Verify immutable migration ledger
        run: node scripts/ci.mjs check migrations

      - name: Build maka binary and upgrade compatibility harness
        run: cargo build --locked -p maka-cli --bin maka -p maka-upgrade-compat --bin maka-upgrade-compat

      - name: Run current-HEAD self-roundtrip scenario
        run: |
          bin_dir="$(realpath "${CARGO_TARGET_DIR:-target}/debug")"
          MAKA_COMPAT_BIN="$bin_dir/maka" "$bin_dir/maka-upgrade-compat"

      - name: Replay all published historical time capsules against current HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/rust/compat-capsule.mjs verify-release \
            --bin "${CARGO_TARGET_DIR:-target}/debug/maka" \
            --test-bin "${CARGO_TARGET_DIR:-target}/debug/maka-upgrade-compat" \
            --repo "$GITHUB_REPOSITORY"
