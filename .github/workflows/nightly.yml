name: Nightly Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the rolling GitHub nightly pre-release (set false for dry-run / V8 prebuilt warmup)"
        type: boolean
        default: true
      publish_npm:
        description: "Also publish @maka-agent/cli and maka-agent under the npm @nightly tag"
        type: boolean
        default: false
      notes:
        description: "Optional short note appended to the pre-release description"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      commit: ${{ github.sha }}
      v8_linux_arm64_key: ${{ steps.v8.outputs.key }}
      v8_linux_arm64_pinned: ${{ steps.v8.outputs.pinned }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Verify updater signing keypair before building or publishing
        env:
          MAKA_UPDATE_SIGNING_KEY: ${{ secrets.MAKA_UPDATE_SIGNING_KEY }}
          MAKA_UPDATE_PUBLIC_KEY: ${{ vars.MAKA_UPDATE_PUBLIC_KEY }}
        run: |
          node --input-type=module -e '
            import { derivePublicKey } from "./scripts/rust/nightly-manifest.mjs";
            const secret = (process.env.MAKA_UPDATE_SIGNING_KEY ?? "").trim();
            const pub = (process.env.MAKA_UPDATE_PUBLIC_KEY ?? "").trim();
            if (!secret || !pub) {
              throw new Error("Both MAKA_UPDATE_SIGNING_KEY secret and MAKA_UPDATE_PUBLIC_KEY variable must be configured in the nightly environment");
            }
            if (derivePublicKey(secret) !== pub) {
              throw new Error("MAKA_UPDATE_SIGNING_KEY does not match MAKA_UPDATE_PUBLIC_KEY");
            }
          '

      - id: meta
        run: |
          base=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          day=$(date -u +%Y%m%d)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=${base}-nightly.${day}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"

      - id: v8
        name: Check Linux ARM64 V8 prebuilt pin
        run: |
          key=$(node scripts/rust/build-v8.mjs --cache-key --target aarch64-unknown-linux-gnu)
          pinned=$(node scripts/rust/build-v8.mjs --pinned --target aarch64-unknown-linux-gnu)
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"

  artifacts:
    needs: [prepare]
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      channel: nightly
      pack_npm: ${{ inputs.publish_npm }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      environment: nightly
      v8_linux_arm64_key: ${{ needs.prepare.outputs.v8_linux_arm64_key }}
      v8_linux_arm64_pinned: ${{ needs.prepare.outputs.v8_linux_arm64_pinned }}
    secrets: inherit

  build-ios:
    needs: [prepare]
    runs-on: macos-latest
    environment: nightly
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install Rust and iOS target
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-apple-ios

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ios-ipa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ios-ipa-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and verify nightly IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/rust/package-ios.mjs --target ios --profile release --build-number "$BUILD_NUMBER" --out dist/ios
          cd dist/ios
          shasum -a 256 -c Maka-ios-arm64.ipa.sha256
          unzip -Z1 Maka-ios-arm64.ipa > "$RUNNER_TEMP/maka-ios-entries"
          grep -Fx 'Payload/Maka.app/maka-ios-shell' "$RUNNER_TEMP/maka-ios-entries"
          grep -Fx 'Payload/Maka.app/Info.plist' "$RUNNER_TEMP/maka-ios-entries"
          mkdir -p "$GITHUB_WORKSPACE/nightly-out"
          cp Maka-ios-arm64.ipa "$GITHUB_WORKSPACE/nightly-out/Maka-nightly-ios-arm64.ipa"

      - name: Upload nightly iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: nightly-pkg-ios-arm64
          path: nightly-out/*
          if-no-files-found: error
          compression-level: 0

  publish-npm:
    needs: [prepare, artifacts, build-ios]
    if: >-
      inputs.publish_npm &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.artifacts.result == 'success' &&
      needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install --global --no-audit --no-fund npm@latest

      - name: Download nightly npm platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-npm-*
          path: npm-dist
          merge-multiple: true

      - name: Pack @maka-agent/cli launcher and maka-agent alias
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/rust/package-nightly.mjs pack-npm-launchers \
            --channel nightly \
            --version "$VERSION" \
            --output npm-dist \
            --tag nightly

      - name: Publish packages under the @nightly tag via npm Trusted Publishing (OIDC)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/rust/package-nightly.mjs publish-npm \
            --dir npm-dist \
            --version "$VERSION" \
            --tag nightly \
            --provenance

  release:
    needs: [prepare, artifacts, build-ios, publish-npm]
    if: >-
      inputs.publish_release &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.artifacts.result == 'success' &&
      needs.build-ios.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Download nightly platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-pkg-*
          path: dist
          merge-multiple: true

      - name: Include installer script and ASF DISCLAIMER
        run: |
          cp scripts/install-nightly.sh dist/install.sh
          chmod +x dist/install.sh
          cp DISCLAIMER dist/DISCLAIMER

      - name: Roll previous nightly into nightly-previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          http_code=$(curl -sS -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/nightly")
          if [[ "$http_code" == "404" ]]; then
            echo "No existing nightly release to roll over."
            exit 0
          elif [[ "$http_code" != "200" ]]; then
            echo "::error::Failed to query existing nightly release (HTTP ${http_code})"
            exit 1
          fi

          mkdir -p prev-dist
          gh release download nightly --repo "$GITHUB_REPOSITORY" --dir prev-dist

          if [[ -f prev-dist/nightly-meta.json ]]; then
            cp prev-dist/nightly-meta.json prev-meta.json
            node --input-type=module -e '
              import { statSync } from "node:fs";
              import { readFileSync } from "node:fs";
              const meta = JSON.parse(readFileSync("prev-meta.json", "utf8"));
              for (const name of meta.assets ?? []) {
                const st = statSync("prev-dist/" + name);
                if (!st.isFile() || st.size === 0) {
                  throw new Error("Previous nightly asset missing or empty: " + name);
                }
              }
            '
            PREV_COMMIT=$(node -p "JSON.parse(require('fs').readFileSync('prev-meta.json','utf8')).commit")
            PREV_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('prev-meta.json','utf8')).version")
          else
            PREV_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq '.target_commitish')
            PREV_VERSION=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq '.name')
            PREV_VERSION="${PREV_VERSION#Maka Nightly (}"
            PREV_VERSION="${PREV_VERSION%)}"
            export PREV_COMMIT PREV_VERSION
            node --input-type=module -e '
              import { readdirSync, writeFileSync } from "node:fs";
              const assets = readdirSync("prev-dist").sort();
              writeFileSync("prev-meta.json", JSON.stringify({
                version: process.env.PREV_VERSION,
                commit: process.env.PREV_COMMIT,
                assets,
              }, null, 2));
            '
          fi

          gh release delete nightly-previous --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-previous" 2>/dev/null || true

          export PREV_COMMIT PREV_VERSION
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const disclaimer = readFileSync("DISCLAIMER", "utf8").trim();
            const v = process.env.PREV_VERSION;
            const c = process.env.PREV_COMMIT;
            writeFileSync("prev-notes.md", [
              "> [!WARNING]",
              "> **UNOFFICIAL PREVIOUS NIGHTLY BUILD — NOT AN APACHE SOFTWARE FOUNDATION RELEASE**",
              ">",
              "> Retained copy of the immediately preceding nightly build (`" + v + "`, commit `" + c + "`) for developer rollback and testing only. Not an official ASF release.",
              "",
              disclaimer,
              "",
            ].join("\n"));
          '

          shopt -s nullglob
          prev_files=(prev-dist/*)
          # Point the rolling tag at main (not $PREV_COMMIT) so GITHUB_TOKEN
          # never hits HTTP 403 when .github/workflows/ changed since $PREV_COMMIT;
          # exact PREV_COMMIT and PREV_VERSION live in prev-meta.json and prev-notes.md.
          gh release create nightly-previous "${prev_files[@]}"             --repo "$GITHUB_REPOSITORY"             --target main             --prerelease             --latest=false             --title "Maka Nightly (Previous: ${PREV_VERSION})"             --notes-file prev-notes.md

      - name: Generate checksums, signed updater manifest, and release notes
        env:
          MAKA_UPDATE_SIGNING_KEY: ${{ secrets.MAKA_UPDATE_SIGNING_KEY }}
          MAKA_UPDATE_PUBLIC_KEY: ${{ vars.MAKA_UPDATE_PUBLIC_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          NIGHTLY_NOTES: ${{ inputs.notes }}
          NPM_PUBLISHED: ${{ needs.publish-npm.result == 'success' }}
        run: |
          args=(
            --channel nightly
            --dir dist
            --version "$VERSION"
            --commit "$COMMIT"
            --build-date "$BUILD_DATE"
            --repo "$GITHUB_REPOSITORY"
            --notes-out release-notes.md
            --require-signature
            --expected-public-key "$MAKA_UPDATE_PUBLIC_KEY"
          )
          if [[ -n "$NIGHTLY_NOTES" ]]; then
            args+=(--notes "$NIGHTLY_NOTES")
          fi
          if [[ "$NPM_PUBLISHED" == "true" ]]; then
            args+=(--npm-published)
          fi
          if [[ -f prev-meta.json ]]; then
            args+=(--previous-meta prev-meta.json)
          fi
          node scripts/rust/nightly-manifest.mjs generate "${args[@]}"

      - name: Publish rolling nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" 2>/dev/null || true

          shopt -s nullglob
          assets=(dist/*)
          # Point the rolling tag at main so GITHUB_TOKEN never hits HTTP 403 if a
          # workflow change landed on main during the build; exact build commit lives
          # in nightly-meta.json, latest.json, and release-notes.md.
          gh release create nightly "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --prerelease \
            --latest=false \
            --title "Maka Nightly (${VERSION})" \
            --notes-file release-notes.md

  seal-capsule:
    needs: [prepare, artifacts, release]
    if: >-
      inputs.publish_release &&
      !cancelled() &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Download verified candidate time capsule
        uses: actions/download-artifact@v8
        with:
          name: compat-capsule-candidate
          path: compat-capsule

      - name: Publish time capsule to compat-capsules release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          short_sha="${RELEASE_COMMIT:0:9}"
          node scripts/rust/compat-capsule.mjs publish \
            --capsule compat-capsule/compat-capsule.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --name "capsule-nightly-${RELEASE_VERSION}-${short_sha}.tar.gz" \
            --max-rolling 3
