name: Nightly Build
run-name: Nightly build (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the rolling GitHub nightly pre-release (set false for dry-run / V8 prebuilt warmup)"
        type: boolean
        default: true
      publish_npm:
        description: "Also publish @maka-agent/cli and maka-agent under the npm @nightly tag"
        type: boolean
        default: false
      notes:
        description: "Optional short note appended to the pre-release description"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      commit: ${{ github.sha }}
      v8_linux_arm64_key: ${{ steps.v8.outputs.key }}
      v8_linux_arm64_pinned: ${{ steps.v8.outputs.pinned }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Update Rust
        run: rustup update stable --no-self-update

      - name: Verify updater signing keypair before building or publishing
        env:
          MAKA_UPDATE_SIGNING_KEY: ${{ secrets.MAKA_UPDATE_SIGNING_KEY }}
          MAKA_UPDATE_PUBLIC_KEY: ${{ vars.MAKA_UPDATE_PUBLIC_KEY }}
        run: |
          node --input-type=module -e '
            import { derivePublicKey } from "./scripts/rust/nightly-manifest.mjs";
            const secret = (process.env.MAKA_UPDATE_SIGNING_KEY ?? "").trim();
            const pub = (process.env.MAKA_UPDATE_PUBLIC_KEY ?? "").trim();
            if (!secret || !pub) {
              throw new Error("Both MAKA_UPDATE_SIGNING_KEY secret and MAKA_UPDATE_PUBLIC_KEY variable must be configured in the nightly environment");
            }
            if (derivePublicKey(secret) !== pub) {
              throw new Error("MAKA_UPDATE_SIGNING_KEY does not match MAKA_UPDATE_PUBLIC_KEY");
            }
          '

      - id: meta
        run: |
          base=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          day=$(date -u +%Y%m%d)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=${base}-nightly.${day}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"

      - id: v8
        name: Check Linux ARM64 V8 prebuilt pin
        run: |
          key=$(node scripts/rust/build-v8.mjs --cache-key --target aarch64-unknown-linux-gnu)
          pinned=$(node scripts/rust/build-v8.mjs --pinned --target aarch64-unknown-linux-gnu)
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"

  v8-linux-arm64:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.v8_linux_arm64_pinned != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Update Rust and add Linux ARM64 target
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-unknown-linux-gnu

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install V8 bindgen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev llvm-dev
          echo "LIBCLANG_PATH=$(/usr/bin/llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Restore Linux ARM64 V8 cache
        id: v8-cache
        uses: actions/cache/restore@v6
        with:
          path: target/v8/${{ needs.prepare.outputs.v8_linux_arm64_key }}
          key: maka-v8-linux-arm64-gnu-${{ needs.prepare.outputs.v8_linux_arm64_key }}

      - name: Cross-compile V8 for aarch64-unknown-linux-gnu on linux/x64
        run: |
          node scripts/rust/build-v8.mjs --build             --target aarch64-unknown-linux-gnu             --cache target/v8             --export v8-staged

      - name: Save Linux ARM64 V8 cache
        uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.v8-cache.outputs.cache-hit != 'true' && hashFiles(format('target/v8/{0}/receipt.json', needs.prepare.outputs.v8_linux_arm64_key)) != '' }}
        with:
          path: target/v8/${{ needs.prepare.outputs.v8_linux_arm64_key }}
          key: maka-v8-linux-arm64-gnu-${{ needs.prepare.outputs.v8_linux_arm64_key }}

      - name: Upload staged Linux ARM64 V8 bundle for native ARM64 build and smoke
        uses: actions/upload-artifact@v7
        with:
          name: v8-linux-arm64-staged
          path: v8-staged/*
          if-no-files-found: error
          compression-level: 0

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    environment: nightly
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64-gnu
            runner: ubuntu-latest
          - target: win32-x64
            runner: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MAKA_UPDATE_REPO: ${{ github.repository }}
      MAKA_UPDATE_PUBLIC_KEY: ${{ vars.MAKA_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Update Rust
        run: rustup update stable --no-self-update

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev llvm-dev libssl-dev libglib2.0-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxi-dev libxtst-dev libxext-dev libxcb1-dev libxrandr-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          echo "LIBCLANG_PATH=$(/usr/bin/llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Set up Zig (Linux glibc 2.28 baseline)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: latest

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-zigbuild

      - name: Select libclang on macOS
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Configure Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import macOS signing certificate and notarization key
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "CSC_LINK not set; building ad-hoc signed macOS artifacts."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/maka-signing.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          P12="$RUNNER_TEMP/maka-cert.p12"
          umask 077
          if [[ "$CSC_LINK" == file://* ]]; then
            cp "${CSC_LINK#file://}" "$P12"
          elif [[ -f "$CSC_LINK" ]]; then
            cp "$CSC_LINK" "$P12"
          else
            printf '%s' "$CSC_LINK" | base64 --decode > "$P12"
          fi
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$P12" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -nE 's/.*"(Developer ID Application:[^"]*)".*/\1/p' | head -n 1)
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No Developer ID Application identity found in CSC_LINK"
            exit 1
          fi
          echo "MAKA_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_Maka.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
            echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            # Avoid HTTP/3 UDP 443 ticket delivery stalls on macOS runners.
            echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f - || true
            sudo pfctl -E || true
          fi

      - name: Install JavaScript build dependencies
        run: |
          npm ci --include=dev --include=optional --ignore-scripts --no-audit --no-fund
          node scripts/apply-dependency-patches.mjs

      - name: Compute V8 cache key
        id: v8-key
        run: echo "key=$(node scripts/rust/build-v8.mjs --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore V8 cache
        id: v8-cache
        uses: actions/cache/restore@v6
        with:
          path: target/v8/${{ steps.v8-key.outputs.key }}
          key: maka-v8-${{ matrix.target }}-${{ steps.v8-key.outputs.key }}

      - name: Build, smoke test, and package nightly artifacts
        env:
          V8_CACHE_KEY: ${{ steps.v8-key.outputs.key }}
        run: |
          node scripts/rust/package-nightly.mjs build \
            --target "${{ matrix.target }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --output nightly-out \
            --npm-output npm-out \
            --v8-output v8-out

      - name: Clean up temporary macOS signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/maka-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/maka-cert.p12" "$RUNNER_TEMP/AuthKey_Maka.p8"

      - name: Save V8 cache
        uses: actions/cache/save@v6
        if: ${{ !cancelled() && steps.v8-cache.outputs.cache-hit != 'true' && hashFiles(format('target/v8/{0}/receipt.json', steps.v8-key.outputs.key)) != '' }}
        with:
          path: target/v8/${{ steps.v8-key.outputs.key }}
          key: maka-v8-${{ matrix.target }}-${{ steps.v8-key.outputs.key }}

      - name: Upload nightly installers and update archives
        uses: actions/upload-artifact@v7
        with:
          name: nightly-pkg-${{ matrix.target }}
          path: nightly-out/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload npm platform package
        uses: actions/upload-artifact@v7
        with:
          name: nightly-npm-${{ matrix.target }}
          path: npm-out/*.tgz
          if-no-files-found: error
          compression-level: 0

      - name: Upload newly built V8 prebuilt (when not yet pinned)
        if: ${{ hashFiles('v8-out/*.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: v8-prebuilt-${{ matrix.target }}
          path: v8-out/*
          if-no-files-found: error
          compression-level: 0

  build-linux-arm64:
    needs: [prepare, v8-linux-arm64]
    if: >-
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.v8-linux-arm64.result == 'success' || needs.v8-linux-arm64.result == 'skipped')
    runs-on: ubuntu-26.04-arm
    environment: nightly
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MAKA_UPDATE_REPO: ${{ github.repository }}
      MAKA_UPDATE_PUBLIC_KEY: ${{ vars.MAKA_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Update Rust
        run: rustup update stable --no-self-update

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev llvm-dev libssl-dev libglib2.0-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxi-dev libxtst-dev libxext-dev libxcb1-dev libxrandr-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
          echo "LIBCLANG_PATH=$(/usr/bin/llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Set up Zig (Linux glibc 2.28 baseline)
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: latest

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-zigbuild

      - name: Install JavaScript build dependencies
        run: |
          npm ci --include=dev --include=optional --ignore-scripts --no-audit --no-fund
          node scripts/apply-dependency-patches.mjs

      - name: Compute V8 cache key
        id: v8-key
        run: echo "key=$(node scripts/rust/build-v8.mjs --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore V8 cache
        id: v8-cache
        uses: actions/cache/restore@v6
        with:
          path: target/v8/${{ steps.v8-key.outputs.key }}
          key: maka-v8-linux-arm64-gnu-${{ steps.v8-key.outputs.key }}

      - name: Download cross-built Linux ARM64 V8 bundle
        if: >-
          needs.prepare.outputs.v8_linux_arm64_pinned != 'true' &&
          steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: v8-linux-arm64-staged
          path: v8-staged

      - name: Stage Linux ARM64 V8 bundle into cache
        if: >-
          needs.prepare.outputs.v8_linux_arm64_pinned != 'true' &&
          steps.v8-cache.outputs.cache-hit != 'true'
        run: |
          dest="target/v8/${{ steps.v8-key.outputs.key }}"
          mkdir -p "$dest"
          tar -xzf "v8-staged/v8-aarch64-unknown-linux-gnu-${{ steps.v8-key.outputs.key }}.tar.gz" -C "$dest"

      - name: Build, smoke test, and package nightly artifacts
        env:
          V8_CACHE_KEY: ${{ steps.v8-key.outputs.key }}
        run: |
          node scripts/rust/package-nightly.mjs build \
            --target "linux-arm64-gnu" \
            --version "${{ needs.prepare.outputs.version }}" \
            --output nightly-out \
            --npm-output npm-out \
            --v8-output v8-out

      - name: Upload nightly installers and update archives
        uses: actions/upload-artifact@v7
        with:
          name: nightly-pkg-linux-arm64-gnu
          path: nightly-out/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload npm platform package
        uses: actions/upload-artifact@v7
        with:
          name: nightly-npm-linux-arm64-gnu
          path: npm-out/*.tgz
          if-no-files-found: error
          compression-level: 0

      - name: Upload newly built V8 prebuilt (when not yet pinned)
        if: ${{ hashFiles('v8-out/*.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: v8-prebuilt-linux-arm64-gnu
          path: v8-out/*
          if-no-files-found: error
          compression-level: 0

  compat-gate:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/ci-setup
        with:
          role: compat-gate
          cache_role: root
          dependencies: headless
          javascript: "true"

      - name: Verify immutable migration ledger
        run: node scripts/ci.mjs check migrations

      - name: Download built Linux x64 nightly archive
        uses: actions/download-artifact@v8
        with:
          name: nightly-pkg-linux-x64-gnu
          path: compat-pkg

      - name: Extract release maka binary
        id: extract-bin
        run: |
          mkdir -p compat-bin
          tar -xzf compat-pkg/Maka-nightly-linux-x64.tar.gz -C compat-bin
          bin_path="$(find compat-bin -maxdepth 3 -type f -name maka -perm -111 | head -n 1)"
          if [[ -z "$bin_path" ]]; then
            echo "::error::Could not find executable maka binary inside Maka-nightly-linux-x64.tar.gz"
            exit 1
          fi
          echo "bin=$bin_path" >> "$GITHUB_OUTPUT"
          "$bin_path" --version

      - name: Build upgrade compatibility harness
        run: cargo test --locked -p maka-cli --test upgrade_compat --no-run

      - name: Produce candidate time capsule and verify self-roundtrip
        run: |
          node scripts/rust/compat-capsule.mjs produce \
            --bin "${{ steps.extract-bin.outputs.bin }}" \
            --out compat-capsule.tar.gz
          node scripts/rust/compat-capsule.mjs verify \
            --bin "${{ steps.extract-bin.outputs.bin }}" \
            --capsule compat-capsule.tar.gz

      - name: Verify upgrade from all retained historical time capsules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/rust/compat-capsule.mjs verify-release \
            --bin "${{ steps.extract-bin.outputs.bin }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload verified candidate time capsule
        uses: actions/upload-artifact@v7
        with:
          name: compat-capsule-candidate
          path: compat-capsule.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-npm:
    needs: [prepare, build, build-linux-arm64, compat-gate]
    if: inputs.publish_npm
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Download npm platform tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-npm-*
          path: npm-dist
          merge-multiple: true

      - name: Pack @maka-agent/cli launcher and maka-agent alias
        run: |
          node scripts/rust/package-nightly.mjs pack-npm-launchers \
            --version "${{ needs.prepare.outputs.version }}" \
            --output npm-dist \
            --tag nightly

      - name: Publish packages under the @nightly tag via npm Trusted Publishing (OIDC)
        run: |
          node scripts/rust/package-nightly.mjs publish-npm \
            --dir npm-dist \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag nightly \
            --provenance

  release:
    needs: [prepare, build, build-linux-arm64, compat-gate, publish-npm]
    if: >-
      inputs.publish_release &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      needs.build-linux-arm64.result == 'success' &&
      needs.compat-gate.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Download nightly platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-pkg-*
          path: dist
          merge-multiple: true

      - name: Include installer script and ASF DISCLAIMER
        run: |
          cp scripts/install-nightly.sh dist/install.sh
          chmod +x dist/install.sh
          cp DISCLAIMER dist/DISCLAIMER

      - name: Roll previous nightly into nightly-previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          http_code=$(curl -sS -o /dev/null -w '%{http_code}'             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/nightly")
          if [[ "$http_code" == "404" ]]; then
            echo "No existing nightly release to roll over."
            exit 0
          elif [[ "$http_code" != "200" ]]; then
            echo "::error::Failed to query existing nightly release (HTTP ${http_code})"
            exit 1
          fi

          mkdir -p prev-dist
          gh release download nightly --repo "$GITHUB_REPOSITORY" --dir prev-dist

          if [[ -f prev-dist/nightly-meta.json ]]; then
            cp prev-dist/nightly-meta.json prev-meta.json
            node --input-type=module -e '
              import { statSync } from "node:fs";
              import { readFileSync } from "node:fs";
              const meta = JSON.parse(readFileSync("prev-meta.json", "utf8"));
              for (const name of meta.assets ?? []) {
                const st = statSync("prev-dist/" + name);
                if (!st.isFile() || st.size === 0) {
                  throw new Error("Previous nightly asset missing or empty: " + name);
                }
              }
            '
            PREV_COMMIT=$(node -p "JSON.parse(require('fs').readFileSync('prev-meta.json','utf8')).commit")
            PREV_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('prev-meta.json','utf8')).version")
          else
            PREV_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq '.object.sha')
            PREV_VERSION=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json name -q .name)
            export PREV_COMMIT PREV_VERSION
            node --input-type=module -e '
              import { readdirSync, writeFileSync } from "node:fs";
              const assets = readdirSync("prev-dist").sort();
              if (assets.length === 0) throw new Error("Downloaded zero assets from existing nightly");
              writeFileSync("prev-meta.json", JSON.stringify({
                version: process.env.PREV_VERSION,
                commit: process.env.PREV_COMMIT,
                assets,
              }, null, 2));
            '
          fi

          gh release delete nightly-previous --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly-previous" 2>/dev/null || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/nightly-previous" -f sha="$PREV_COMMIT"

          export PREV_COMMIT PREV_VERSION
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const disclaimer = readFileSync("DISCLAIMER", "utf8").trim();
            const v = process.env.PREV_VERSION;
            const c = process.env.PREV_COMMIT;
            writeFileSync("prev-notes.md", [
              "> [!WARNING]",
              "> **UNOFFICIAL PREVIOUS NIGHTLY BUILD — NOT AN APACHE SOFTWARE FOUNDATION RELEASE**",
              ">",
              "> Retained copy of the immediately preceding nightly build (`" + v + "`, commit `" + c + "`) for developer rollback and testing only. Not an official ASF release.",
              "",
              disclaimer,
              "",
            ].join("\n"));
          '

          shopt -s nullglob
          prev_files=(prev-dist/*)
          gh release create nightly-previous "${prev_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --latest=false \
            --title "Maka Nightly (Previous: ${PREV_VERSION})" \
            --notes-file prev-notes.md

      - name: Generate checksums, signed updater manifest, and release notes
        env:
          MAKA_UPDATE_SIGNING_KEY: ${{ secrets.MAKA_UPDATE_SIGNING_KEY }}
          MAKA_UPDATE_PUBLIC_KEY: ${{ vars.MAKA_UPDATE_PUBLIC_KEY }}
          NIGHTLY_NOTES: ${{ inputs.notes }}
          NPM_PUBLISHED: ${{ needs.publish-npm.result == 'success' }}
        run: |
          args=(
            --dir dist
            --version "${{ needs.prepare.outputs.version }}"
            --commit "${{ needs.prepare.outputs.commit }}"
            --build-date "${{ needs.prepare.outputs.build_date }}"
            --repo "$GITHUB_REPOSITORY"
            --notes-out release-notes.md
            --require-signature
            --expected-public-key "$MAKA_UPDATE_PUBLIC_KEY"
          )
          if [[ -n "$NIGHTLY_NOTES" ]]; then
            args+=(--notes "$NIGHTLY_NOTES")
          fi
          if [[ "$NPM_PUBLISHED" == "true" ]]; then
            args+=(--npm-published)
          fi
          if [[ -f prev-meta.json ]]; then
            args+=(--previous-meta prev-meta.json)
          fi
          node scripts/rust/nightly-manifest.mjs generate "${args[@]}"

      - name: Publish rolling nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" 2>/dev/null || true
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/nightly" -f sha="${{ needs.prepare.outputs.commit }}"

          shopt -s nullglob
          assets=(dist/*)
          gh release create nightly "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --latest=false \
            --title "Maka Nightly (${{ needs.prepare.outputs.version }})" \
            --notes-file release-notes.md

  seal-capsule:
    needs: [prepare, build, build-linux-arm64, compat-gate, release]
    if: >-
      inputs.publish_release &&
      !cancelled() &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment: nightly
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Download verified candidate time capsule
        uses: actions/download-artifact@v8
        with:
          name: compat-capsule-candidate
          path: compat-capsule

      - name: Publish time capsule to compat-capsules release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          short_sha="${RELEASE_COMMIT:0:9}"
          node scripts/rust/compat-capsule.mjs publish \
            --capsule compat-capsule/compat-capsule.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --name "capsule-nightly-${{ needs.prepare.outputs.version }}-${short_sha}.tar.gz" \
            --max-rolling 3
