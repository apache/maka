name: Performance frontend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm
      - run: npm ci
      - run: npm --workspace @maka/desktop run build:workspace-deps
      - run: npm --workspace @maka/desktop run build
      - id: browsers
        run: npx playwright install --with-deps chromium
      - name: Fetch exact experiment sources
        run: git fetch --depth=1 origin 839d14535a541ef0da29ea4d6626a2e3d0e32a8e 0039a230754a4bd832653f481194fb40516464db
      - name: Paired A-B-B-A-A-B real Host scroll measurements
        env:
          MAKA_PERF_OUTPUT: ${{ github.workspace }}/perf-results
        run: xvfb-run -a node scripts/perf/scroll-paired.mjs
      - name: Upload raw measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-frontend-${{ github.sha }}
          path: perf-results/
          if-no-files-found: error
          retention-days: 30
