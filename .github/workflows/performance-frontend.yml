name: Performance frontend
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          cache: npm
      - run: npm ci
      - run: npm --workspace @maka/desktop run build:workspace-deps
      - run: npm --workspace @maka/desktop run build
      - run: npm --workspace @maka/desktop run build-storybook
      - id: browsers
        run: npx playwright install --with-deps chromium
      - name: Fetch exact experiment sources
        run: git fetch --depth=1 origin 839d14535a541ef0da29ea4d6626a2e3d0e32a8e 0039a230754a4bd832653f481194fb40516464db b65a8c16476c61336c87b9838f161886df26c5e1
      - name: Virtual history continuity and selection
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { startStaticServer, smokeStory } from './scripts/storybook-visual-smoke.mjs';
          const server = await startStaticServer('apps/desktop/storybook-static');
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            await smokeStory(page, server.baseUrl, {
              storyId: 'product-shell-official-appshell--virtual-history-continuity',
              colorScheme: 'light', palette: 'default',
            });
          } finally { await browser.close(); await server.close(); }
          JS
      - name: Paired viewport mounting on real Host
        env:
          MAKA_PERF_OUTPUT: ${{ github.workspace }}/perf-results
          MAKA_PERF_VARIANTS: A,V,V,A,A,V
          MAKA_PERF_TARGET_TURN: '60'
        run: xvfb-run -a node scripts/perf/scroll-paired.mjs
      - name: Upload raw measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-frontend-${{ github.sha }}
          path: perf-results/
          if-no-files-found: error
          retention-days: 30
