name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    # Allow cold compilation and Host fixtures that reserve multiple CPU slots.
    timeout-minutes: 180
    env:
      MBX_CACHE_EXPORT_GROUP: ci-${{ github.run_id }}-${{ github.run_attempt }}-test
      MBX_GC_AUTO: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '0' || '1' }}
      MBX_TARGET_VIEWS: "0"
      # Linked outputs already live in target; retain cache copies only for export.
      MBX_CACHE_LINKS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      # NSH headless rendering tests need Vulkan and Mesa software adapters,
      # as in third-party/nsh/.github/workflows/gpui.yml.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep pkg-config libx11-dev libxi-dev libxtst-dev libxext-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libvulkan1 mesa-vulkan-drivers
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Update Rust
        run: rustup update stable --no-self-update
      # mr-boxington-action is not on the ASF allowlist. Install the immutable
      # release directly and transport its cache with GitHub's official actions.
      - name: Install mbx
        id: mbx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$RUNNER_TEMP/mbx-release.json"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/jdx/mr-boxington/releases/latest \
            --output "$release"
          jq --exit-status '.immutable == true' "$release" > /dev/null
          version=$(jq --exit-status --raw-output '.tag_name | ltrimstr("v")' "$release")
          asset='.assets[] | select(.name == "mbx-x86_64-unknown-linux-gnu.tar.gz")'
          url=$(jq --exit-status --raw-output "$asset | .browser_download_url" "$release")
          digest=$(jq --exit-status --raw-output "$asset | .digest | select(startswith(\"sha256:\")) | ltrimstr(\"sha256:\")" "$release")
          archive="$RUNNER_TEMP/mbx.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$url" --output "$archive"
          echo "$digest  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mbx-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mbx-bin"
          "$RUNNER_TEMP/mbx-bin/mbx" --version
          XDG_DATA_HOME="$RUNNER_TEMP/mbx-data" "$RUNNER_TEMP/mbx-bin/mbx" setup --yes
          echo "$RUNNER_TEMP/mbx-bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/mbx-data/mbx/bin" >> "$GITHUB_PATH"
          echo "key=mbx-${version}-${RUNNER_OS}-${RUNNER_ARCH}-$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.59.0,cargo-nextest@0.9.149,cargo-deny
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Restore compiled Rust cache
        id: mbx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mbx-cache
          key: ${{ steps.mbx.outputs.key }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.mbx.outputs.key }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}-
            ${{ steps.mbx.outputs.key }}-
      - name: Import compiled Rust cache
        if: steps.mbx-cache.outputs.cache-matched-key != ''
        run: mbx cache import "$RUNNER_TEMP/mbx-cache"
      - name: Select npm
        run: npm install --global --no-audit --no-fund "$(node -p 'require("./package.json").packageManager')"
      - run: just setup
      - name: Verify Computer Use bridge build
        run: |
          node scripts/rust/check-cua-build.mjs
          just product
          cargo build --locked -p maka-cli --no-default-features
          target/debug/maka --version
          cargo test --locked -p maka-computer-use --no-default-features --lib --test native --test repl_contract
      - name: Check Termina Windows input
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --locked --manifest-path third-party/termina/Cargo.toml --lib --target x86_64-pc-windows-msvc --target-dir "${CARGO_TARGET_DIR:-target}"
          cargo check --locked --manifest-path third-party/termina/Cargo.toml --lib --target x86_64-pc-windows-msvc --target-dir "${CARGO_TARGET_DIR:-target}" --features windows-legacy
      - name: Report storage before checks
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for path in "$GITHUB_WORKSPACE/target" "$HOME/.cache/mbx" "$HOME/.cargo/registry" "$HOME/.cargo/git"; do
            if [ -d "$path" ]; then du -sh "$path"; fi
          done
      - run: just check
      - name: Report storage after checks
        if: ${{ always() && steps.mbx.outcome == 'success' }}
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for path in "$GITHUB_WORKSPACE/target" "$HOME/.cache/mbx" "$HOME/.cargo/registry" "$HOME/.cargo/git"; do
            if [ -d "$path" ]; then du -sh "$path"; fi
          done
      - run: just build
      - name: Native CLI smoke
        run: |
          target/debug/maka --version
          target/debug/maka desktop --version
          target/debug/maka-desktop-shell --version
      - name: Export compiled Rust cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mbx-cache.outputs.cache-hit != 'true'
        run: mbx cache export --group "$MBX_CACHE_EXPORT_GROUP" --format directory "$RUNNER_TEMP/mbx-cache"
      - name: Save compiled Rust cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mbx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mbx-cache
          key: ${{ steps.mbx-cache.outputs.cache-primary-key }}
