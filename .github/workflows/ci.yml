name: CI

on:
  pull_request:
    branches: [main, rust-preview]
  push:
    branches: [main, rust-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tooling: ${{ steps.plan.outputs.tooling }}
      root: ${{ steps.plan.outputs.root }}
      workers: ${{ steps.plan.outputs.workers }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - id: plan
        run: node scripts/ci.mjs plan
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan.json
          if-no-files-found: error

  tooling:
    needs: plan
    if: needs.plan.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          role: tooling
          javascript: "true"
          compile: "false"
      - run: node scripts/ci.mjs run tooling

  root-build:
    needs: plan
    if: needs.plan.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      partitions: ${{ steps.archive.outputs.partitions }}
      has_tests: ${{ steps.archive.outputs.has_tests }}
      nextest: ${{ steps.archive.outputs.nextest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          role: root
          dependencies: headless
          javascript: "true"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Build and archive selected tests
        id: archive
        run: node scripts/ci.mjs archive
      - uses: actions/upload-artifact@v7
        id: upload
        if: steps.archive.outputs.has_tests == 'true'
        with:
          name: root-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/root-tests.tar.zst
          compression-level: 0
          if-no-files-found: error
      - name: Report producer storage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          if [ -d target ]; then du -sh target; fi

  root-tests:
    needs: root-build
    if: needs.root-build.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.root-build.outputs.partitions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        with:
          role: replay
          dependencies: headless
          javascript: "true"
          compile: "false"
          nextest: ${{ needs.root-build.outputs.nextest }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.root-build.outputs.artifact }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Execute the produced test partition
        run: node scripts/ci.mjs replay '${{ matrix.partition }}'

  suites:
    needs: plan
    if: needs.plan.outputs.workers != '[]'
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.workers) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          role: ${{ matrix.id }}
          workspace: ${{ matrix.workspace }}
          dependencies: ${{ matrix.dependencies }}
          javascript: ${{ matrix.javascript }}
          compile: ${{ matrix.compile }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Compile selected suites
        run: node scripts/ci.mjs prepare '${{ matrix.id }}'
      - name: Verify selected suites
        run: node scripts/ci.mjs verify '${{ matrix.id }}'
      - name: Report worker storage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          if [ -d target ]; then du -sh target; fi

  test:
    needs: [plan, tooling, root-build, root-tests, suites]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Require a successful plan
        if: needs.plan.result != 'success'
        run: node -e 'throw new Error("CI planning did not succeed")'
      - uses: actions/download-artifact@v8
        if: needs.plan.result == 'success'
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Require all planned work to succeed
        if: needs.plan.result == 'success'
        env:
          MAKA_CI_RESULTS: ${{ toJSON(needs) }}
          MAKA_CI_HAS_TESTS: ${{ needs.root-build.outputs.has_tests }}
        run: node scripts/ci.mjs gate
