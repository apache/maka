name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    # Allow cold compilation and Host fixtures that reserve multiple CPU slots.
    timeout-minutes: 180
    env:
      MBX_CACHE_EXPORT_GROUP: ci-${{ github.run_id }}-${{ github.run_attempt }}-test
      MBX_GC_AUTO: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '0' || '1' }}
      MBX_TARGET_VIEWS: "0"
      # Linked outputs already live in target; retain cache copies only for export.
      MBX_CACHE_LINKS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      # NSH headless rendering tests need Vulkan and Mesa software adapters,
      # as in third-party/nsh/.github/workflows/gpui.yml.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep pkg-config libx11-dev libxi-dev libxtst-dev libxext-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libwayland-dev libvulkan1 mesa-vulkan-drivers
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Update Rust
        run: rustup update stable --no-self-update
      # mr-boxington-action is not on the ASF allowlist. Install the immutable
      # release directly and transport its cache with GitHub's official actions.
      - name: Install mbx
        id: mbx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$RUNNER_TEMP/mbx-release.json"
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/jdx/mr-boxington/releases/latest \
            --output "$release"
          jq --exit-status '.immutable == true' "$release" > /dev/null
          version=$(jq --exit-status --raw-output '.tag_name | ltrimstr("v")' "$release")
          asset='.assets[] | select(.name == "mbx-x86_64-unknown-linux-gnu.tar.gz")'
          url=$(jq --exit-status --raw-output "$asset | .browser_download_url" "$release")
          digest=$(jq --exit-status --raw-output "$asset | .digest | select(startswith(\"sha256:\")) | ltrimstr(\"sha256:\")" "$release")
          archive="$RUNNER_TEMP/mbx.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$url" --output "$archive"
          echo "$digest  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mbx-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/mbx-bin"
          "$RUNNER_TEMP/mbx-bin/mbx" --version
          XDG_DATA_HOME="$RUNNER_TEMP/mbx-data" "$RUNNER_TEMP/mbx-bin/mbx" setup --yes
          echo "$RUNNER_TEMP/mbx-bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/mbx-data/mbx/bin" >> "$GITHUB_PATH"
          echo "key=mbx-${version}-${RUNNER_OS}-${RUNNER_ARCH}-$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.59.0,cargo-nextest@0.9.149,cargo-deny
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Restore compiled Rust cache
        id: mbx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mbx-cache
          key: ${{ steps.mbx.outputs.key }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.mbx.outputs.key }}-${{ hashFiles('Cargo.lock', 'third-party/termina/Cargo.lock') }}-
            ${{ steps.mbx.outputs.key }}-
      - name: Import compiled Rust cache
        if: steps.mbx-cache.outputs.cache-matched-key != ''
        run: mbx cache import "$RUNNER_TEMP/mbx-cache"
      - name: Select npm
        run: npm install --global --no-audit --no-fund "$(node -p 'require("./package.json").packageManager')"
      - run: just setup
      - name: Verify Rust dependency inventory before compilation
        run: |
          node scripts/rust/dependencies.mjs generate
          sha256sum products/maka/cli/DEPENDENCIES.rust.tsv
          git diff --exit-code -- products/maka/cli/DEPENDENCIES.rust.tsv
      - name: Verify Computer Use bridge build
        run: |
          node scripts/rust/check-cua-build.mjs
          cargo build --locked -p maka-cli --no-default-features
          target/debug/maka --version
          cargo test --locked -p maka-computer-use --no-default-features --lib --test native --test repl_contract
      - name: Verify model search keyboard selection before full checks
        shell: bash
        env:
          NEXTEST_PROFILE: ci
        run: |
          filter='package(=maka-cli) & binary(=terminal_real_host) & test(=keyboard::connection_filter_preserves_model_search_focus_and_keyboard_selection)'
          cargo nextest list --locked --workspace -E "$filter" --message-format json > "$RUNNER_TEMP/model-search-tests.json"
          node --input-type=module - "$RUNNER_TEMP/model-search-tests.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const listing = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const matches = Object.values(listing['rust-suites']).flatMap(suite =>
            Object.entries(suite.testcases).filter(([, test]) => test['filter-match'].status === 'matches')
              .map(([name, test]) => [suite['package-name'], suite['binary-name'], name, test.ignored]));
          assert.deepEqual(matches, [['maka-cli', 'terminal_real_host',
            'keyboard::connection_filter_preserves_model_search_focus_and_keyboard_selection', false]]);
          NODE
          cargo nextest run --locked --workspace -E "$filter"
      - name: Check Termina Windows input
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check --locked --manifest-path third-party/termina/Cargo.toml --lib --target x86_64-pc-windows-msvc --target-dir "${CARGO_TARGET_DIR:-target}"
          cargo check --locked --manifest-path third-party/termina/Cargo.toml --lib --target x86_64-pc-windows-msvc --target-dir "${CARGO_TARGET_DIR:-target}" --features windows-legacy
      - name: Report storage before checks
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for path in "$GITHUB_WORKSPACE/target" "$HOME/.cache/mbx" "$HOME/.cargo/registry" "$HOME/.cargo/git"; do
            if [ -d "$path" ]; then du -sh "$path"; fi
          done
      - run: just check
        env:
          NEXTEST_PROFILE: ci
      - name: Report storage after checks
        if: ${{ always() && steps.mbx.outcome == 'success' }}
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for path in "$GITHUB_WORKSPACE/target" "$HOME/.cache/mbx" "$HOME/.cargo/registry" "$HOME/.cargo/git"; do
            if [ -d "$path" ]; then du -sh "$path"; fi
          done
      - run: just build
      - name: Native CLI smoke
        run: |
          target/debug/maka --version
          target/debug/maka desktop --version
          target/debug/maka-desktop-shell --version
      - name: Export compiled Rust cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mbx-cache.outputs.cache-hit != 'true'
        run: mbx cache export --group "$MBX_CACHE_EXPORT_GROUP" --format directory "$RUNNER_TEMP/mbx-cache"
      - name: Save compiled Rust cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.mbx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mbx-cache
          key: ${{ steps.mbx-cache.outputs.cache-primary-key }}

  # Root workspace tests compile NSH dependencies but do not select the nested
  # workspace's own tests. Run them serially on a fresh runner when dispatched.
  nsh-integration:
    needs: test
    if: ${{ always() && github.event_name == 'workflow_dispatch' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          echo "NSH validation source: $actual"
          test "$actual" = "$EXPECTED_SHA"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/nsh-target" >> "$GITHUB_ENV"
      - name: Update Rust
        run: rustup update stable --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nsh-cargo-${{ runner.os }}-${{ hashFiles('third-party/nsh/Cargo.lock', 'third-party/nsh/crates/gpui/Cargo.lock') }}
          restore-keys: nsh-cargo-${{ runner.os }}-
      - name: Test NSH core, JS, headless, terminal and development tooling
        run: |
          df -h "$RUNNER_TEMP"
          df -i "$RUNNER_TEMP"
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          test "$available" -ge 8589934592 || { echo "NSH tests require 8 GiB free before compilation" >&2; exit 1; }
          cargo test --locked --manifest-path third-party/nsh/Cargo.toml \
            -p nsh-core -p nsh-base -p nsh-engine -p nsh-js \
            -p nsh-testing -p nsh-platform-tui -p nsh-dev -p nsh-bundler \
            --features nsh-testing/agent,nsh-dev/client,nsh-dev/server
      - name: Test portable Web text layout and hit testing
        run: |
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          test "$available" -ge 4294967296 || { echo "Web text tests require 4 GiB free before compilation" >&2; exit 1; }
          cargo test --locked --manifest-path third-party/nsh/Cargo.toml \
            -p nsh-platform-web --no-default-features --test text
      - name: Test Web shader lifecycle in the installed browser
        shell: bash
        run: |
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser) || {
            echo "A preinstalled Chrome/Chromium is required for Web shader lifecycle tests" >&2
            exit 1
          }
          "$chrome" --version
          node --test third-party/nsh/crates/nsh-platform-web/web/nsh.test.mjs
          CHROME="$chrome" node --test --test-reporter=tap \
            third-party/nsh/crates/nsh-platform-web/web/shader-browser.test.mjs \
            | tee "$RUNNER_TEMP/nsh-shader-browser-tests.tap"
          grep -Fx '# tests 2' "$RUNNER_TEMP/nsh-shader-browser-tests.tap"
          grep -Fx '# pass 2' "$RUNNER_TEMP/nsh-shader-browser-tests.tap"
          grep -Fx '# fail 0' "$RUNNER_TEMP/nsh-shader-browser-tests.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/nsh-shader-browser-tests.tap"
      # This owning workspace has a distinct lock/patch graph; root build
      # artifacts are not assumed reusable. Selected tests open no native window.
      - name: Check GPUI test build reserve
        run: |
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          inodes=$(df --output=iavail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          test "$available" -ge 17179869184 || { echo "GPUI queue tests require 16 GiB free before setup" >&2; exit 1; }
          test "$inodes" -ge 100000 || { echo "GPUI queue tests require 100000 free inodes" >&2; exit 1; }
      - name: Install GPUI queue test native dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libclang-dev build-essential pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libssl-dev \
            libvulkan1 mesa-vulkan-drivers libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libzstd-dev
      - name: Test GPUI input ownership, window reload and pixel transport
        shell: bash
        timeout-minutes: 30
        run: |
          available=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          inodes=$(df --output=iavail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          test "$available" -ge 17179869184 || { echo "GPUI queue tests require 16 GiB free before compilation" >&2; exit 1; }
          test "$inodes" -ge 100000 || { echo "GPUI queue tests require 100000 free inodes" >&2; exit 1; }
          args=(--locked --manifest-path third-party/nsh/crates/gpui/Cargo.toml
            -p nsh-platform-gpui -p nsh-gpui-terminal --no-default-features
            --features nsh-platform-gpui/js,nsh-platform-gpui/shot
            --lib)
          queue_filter=native::tests::animated_props_
          cargo test "${args[@]}" "$queue_filter" -- --list | tee "$RUNNER_TEMP/nsh-gpui-queue-tests.txt"
          for name in animated_props_queue_their_latest_value animated_props_preserve_static_prop_barriers animated_props_preserve_command_observation_order; do
            grep -Fx "native::tests::$name: test" "$RUNNER_TEMP/nsh-gpui-queue-tests.txt"
          done
          test "$(grep -c ': test$' "$RUNNER_TEMP/nsh-gpui-queue-tests.txt")" -eq 3
          cargo test "${args[@]}" "$queue_filter" -- --test-threads=1
          focus_test=input::tests::nonpressable_focusable_views_join_native_stops_without_stealing_presses
          cargo test "${args[@]}" "$focus_test" -- --exact --list | tee "$RUNNER_TEMP/nsh-gpui-focus-tests.txt"
          grep -Fx "$focus_test: test" "$RUNNER_TEMP/nsh-gpui-focus-tests.txt"
          test "$(grep -c ': test$' "$RUNNER_TEMP/nsh-gpui-focus-tests.txt")" -eq 1
          cargo test "${args[@]}" "$focus_test" -- --exact --test-threads=1
          window_test=tests::windows
          cargo test "${args[@]}" "$window_test" -- --exact --list | tee "$RUNNER_TEMP/nsh-gpui-window-tests.txt"
          grep -Fx "$window_test: test" "$RUNNER_TEMP/nsh-gpui-window-tests.txt"
          test "$(grep -c ': test$' "$RUNNER_TEMP/nsh-gpui-window-tests.txt")" -eq 1
          cargo test "${args[@]}" "$window_test" -- --exact --test-threads=1
          kitty_filter=kitty::tests::
          cargo test "${args[@]}" "$kitty_filter" -- --list | tee "$RUNNER_TEMP/nsh-kitty-tests.txt"
          for name in rgba_payload_survives_chunking_with_the_previous_image_retained_below complete_frames_preserve_large_scenes_and_reject_previous_slot_reuse; do
            grep -Fx "kitty::tests::$name: test" "$RUNNER_TEMP/nsh-kitty-tests.txt"
          done
          test "$(grep -c ': test$' "$RUNNER_TEMP/nsh-kitty-tests.txt")" -eq 2
          cargo test "${args[@]}" "$kitty_filter" -- --test-threads=1
      - name: Report NSH storage
        if: ${{ always() }}
        run: |
          df -h "$RUNNER_TEMP"
          df -i "$RUNNER_TEMP"
          if [ -d "$CARGO_TARGET_DIR" ]; then du -sh "$CARGO_TARGET_DIR"; fi
