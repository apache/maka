<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>magpie · 更新日志 × 我的贡献 v2</title>
<style>
  :root {
    --ink: #1d1d1f; --ink-2: #6e6e73; --ink-3: #98989d;
    --line: #e5e5ea; --bg: #f2f2f6;
    --lvl-a-bg: #FFF3B8; --lvl-a-bar: #F5C518;
    --lvl-b-bg: #FFF9DB; --lvl-b-bar: #E8B004;
    --lvl-c-bg: #FFFDF0; --lvl-c-bar: #E8D44D;
    --suspense-border: #E8B004;
    --flash-red: #f5222d;
    --focus-ring: 0 0 0 3px rgba(245, 197, 24, 0.45);
    --dpw: 480px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.6;
  }
  body.dp-open { padding-right: var(--dpw); }
  body.dp-open .topbar { right: var(--dpw); }
  body.dp-open .side { right: var(--dpw); }
  body.dp-open .fab { right: calc(var(--dpw) + 16px); }

  /* ===== 顶栏 ===== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 10px 20px;
  }
  .topbar .ttl { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .topbar .ttl small { color: var(--ink-2); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .stat-badge {
    font-size: 11.5px; color: #6b5200; background: var(--lvl-a-bg);
    border: 1px solid rgba(245,197,24,0.5); border-radius: 999px; padding: 2px 10px; white-space: nowrap;
  }
  .topbar .sp { flex: 1; }
  .onlymine { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .onlymine input { accent-color: var(--lvl-a-bar); width: 14px; height: 14px; cursor: pointer; }
  .snapshot { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }

  /* ===== 布局 ===== */
  .layout { display: flex; align-items: flex-start; }
  main { flex: 1; min-width: 0; padding: 66px 24px 80px 28px; }

  /* ===== 版本分组 ===== */
  .ver-sec { margin-bottom: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .ver-head {
    position: sticky; top: 47px; z-index: 10;
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 18px; background: #fafafc; border-bottom: 1px solid var(--line);
  }
  .ver-head .vn { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .ver-head .vm {
    font-size: 11px; font-weight: 700; color: #6b5200;
    background: var(--lvl-a-bg); border: 1px solid rgba(245,197,24,0.5);
    border-radius: 999px; padding: 1px 8px;
  }
  .ver-head .cnt { margin-left: auto; font-size: 11px; color: var(--ink-3); }
  .grp { padding: 4px 18px 10px; }
  .grp-title { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: 10px 0 2px; }
  .entry {
    position: relative; display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 10px 6px 0; border-radius: 8px; scroll-margin: 110px;
  }
  .entry:hover { background: #f7f7f8; }
  .entry .dot { flex-shrink: 0; width: 6px; height: 6px; border-radius: 50%; background: #c7c7cc; margin-top: 10px; margin-left: 8px; }
  .entry .txt { flex: 1; min-width: 0; }
  .entry .ver { flex-shrink: 0; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .entry.lvl-A { background: var(--lvl-a-bg); padding-left: 10px; }
  .entry.lvl-B { background: var(--lvl-b-bg); padding-left: 10px; }
  .entry.lvl-C { background: var(--lvl-c-bg); padding-left: 10px; }
  .entry.lvl-A::before, .entry.lvl-B::before, .entry.lvl-C::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px;
  }
  .entry.lvl-A::before { background: var(--lvl-a-bar); }
  .entry.lvl-B::before { background: var(--lvl-b-bar); }
  .entry.lvl-C::before { background: var(--lvl-c-bar); }
  .lvl-tag {
    flex-shrink: 0; margin-top: 4px; font-size: 10.5px; font-weight: 700; line-height: 1;
    padding: 3px 6px; border-radius: 5px; cursor: default;
  }
  .lvl-tag.A { background: rgba(245,197,24,0.35); color: #6b5200; }
  .lvl-tag.B { background: rgba(232,176,4,0.22); color: #6b5200; }
  .lvl-tag.C { background: rgba(232,212,77,0.28); color: #6b5a00; }
  .empty-note { font-size: 13px; color: var(--ink-2); padding: 6px 2px 2px; }

  /* ===== 悬置提示条 ===== */
  .banner {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; z-index: 60;
    max-width: 620px;
    border: 1.5px dashed var(--suspense-border); background: #fffdf4;
    border-radius: 10px; padding: 10px 14px;
    font-size: 13px; line-height: 1.55;
    display: flex; align-items: flex-start; gap: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .banner .banner-close { margin-left: auto; flex-shrink: 0; cursor: pointer; border: none; background: none; color: var(--ink-2); font-size: 15px; line-height: 1; padding: 2px; border-radius: 5px; }
  .banner .banner-close:hover { color: var(--ink); background: rgba(0,0,0,0.05); }
  .banner a { color: #7c5cf6; text-decoration: none; }
  .banner a:hover { text-decoration: underline; }

  /* ===== 右栏：我的贡献 ===== */
  .side {
    position: fixed; top: 0; bottom: 0; right: 0; width: 300px; z-index: 30;
    background: #fff; border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .side-head { padding: 58px 16px 8px; }
  .side-title { font-size: 13.5px; font-weight: 700; }
  .side-sub { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
  .legend { padding: 2px 16px 12px; border-bottom: 1px solid var(--line); }
  .legend-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; }
  .swatch { flex-shrink: 0; width: 16px; height: 16px; border-radius: 4px; margin-top: 2px; border: 1px solid rgba(0,0,0,0.08); position: relative; }
  .swatch::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px; }
  .swatch.A { background: var(--lvl-a-bg); } .swatch.A::before { background: var(--lvl-a-bar); }
  .swatch.B { background: var(--lvl-b-bg); } .swatch.B::before { background: var(--lvl-b-bar); }
  .swatch.C { background: var(--lvl-c-bg); } .swatch.C::before { background: var(--lvl-c-bar); }
  .swatch.S { background: #fff; border: 1.5px dashed var(--suspense-border); }
  .legend-txt { font-size: 11px; line-height: 1.45; color: var(--ink-2); }
  .legend-txt b { color: var(--ink); font-weight: 600; }
  .issues { flex: 1; overflow-y: auto; padding: 8px 12px 16px; }
  .issue-group-label { font-size: 10.5px; color: var(--ink-2); margin: 8px 4px 5px; }
  .issue-card {
    width: 100%; text-align: left; font: inherit;
    display: flex; align-items: center; gap: 7px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 9px; margin-bottom: 6px; cursor: pointer;
    transition: border-color 0.15s ease-out, background 0.15s ease-out;
  }
  .issue-card:hover { border-color: #c9c9cf; background: #fdfdfd; }
  .issue-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .issue-card.active { border-color: var(--flash-red); background: #fff5f5; }
  .issue-num { font-weight: 700; font-size: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .issue-name { flex: 1; min-width: 0; font-size: 11.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .issue-ver { flex-shrink: 0; font-size: 10px; color: var(--ink-2); background: #f0f0f3; border-radius: 5px; padding: 2px 5px; font-variant-numeric: tabular-nums; }
  .issue-lvl { flex-shrink: 0; font-size: 10px; font-weight: 700; border-radius: 5px; padding: 2px 5px; }
  .issue-lvl.A { background: rgba(245,197,24,0.35); color: #6b5200; }
  .issue-lvl.B { background: rgba(232,176,4,0.22); color: #6b5200; }
  .issue-lvl.C { background: rgba(232,212,77,0.28); color: #6b5a00; }
  .issue-lvl.S { background: #fff; border: 1.5px dashed var(--suspense-border); color: #8a6d00; }
  .issue-link { flex-shrink: 0; display: inline-flex; color: var(--ink-3); padding: 2px; border-radius: 4px; }
  .issue-link:hover { color: #7c5cf6; background: rgba(0,0,0,0.05); }

  /* ===== 定位 overlay（恒泰悦居开发面板模式：fixed 层 + rect 跟随） ===== */
  #dp-ov { position: fixed; inset: 0; pointer-events: none; z-index: 2147482990; }
  #dp-ov .fl {
    position: fixed; border: 2px solid var(--flash-red);
    box-shadow: 0 0 0 4px rgba(245,34,45,0.18); border-radius: 6px;
  }
  #dp-ov .fl span {
    position: absolute; left: -2px; top: -21px;
    background: var(--flash-red); color: #fff;
    font: 700 11px/17px -apple-system, "PingFang SC", sans-serif;
    padding: 0 7px; border-radius: 4px 4px 4px 0; white-space: nowrap;
  }
  #dp-ov .hv {
    position: fixed; border: 2px solid #ff7a45; background: rgba(255,122,69,0.08);
  }
  #dp-ov .hv span {
    position: absolute; left: -2px; top: -19px; background: #ff7a45; color: #fff;
    font: 11px/17px -apple-system, "PingFang SC", sans-serif; padding: 0 6px; border-radius: 3px; white-space: nowrap;
  }
  #dp-ov .bx { position: fixed; border: 1.5px dashed var(--lvl-a-bar); background: rgba(245,197,24,0.05); }
  #dp-ov .bx span {
    position: absolute; left: -1px; top: -17px; background: var(--lvl-a-bar); color: #6b5200;
    font: 700 10.5px/16px Consolas, "Microsoft YaHei", monospace; padding: 0 5px; border-radius: 3px 3px 3px 0; white-space: nowrap;
  }
  body.dp-insp, body.dp-insp * { cursor: crosshair !important; }

  @media (prefers-reduced-motion: no-preference) {
    #dp-ov .fl, #dp-ov .fl span { animation: dpfl 1.6s ease-out forwards; }
    @keyframes dpfl { 0%, 62% { opacity: 1; } 100% { opacity: 0; } }
  }
  @media (prefers-reduced-motion: reduce) {
    #dp-ov .fl { transition: opacity 0.25s; }
  }

  /* ===== FAB 与开发面板 ===== */
  .fab {
    position: fixed; right: 16px; bottom: 16px; z-index: 70;
    background: var(--ink); color: #fff; font-size: 12px; font-weight: 600;
    border-radius: 999px; padding: 9px 16px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25); border: none; font-family: inherit;
  }
  .fab b { color: var(--lvl-a-bar); font-family: Consolas, monospace; margin-right: 5px; }
  .fab:hover { background: #333; }
  .devpanel {
    position: fixed; top: 0; right: calc(-1 * var(--dpw) - 20px); bottom: 0; width: var(--dpw); z-index: 80;
    background: #fff; border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
    transition: right 0.22s ease-out;
  }
  body.dp-open .devpanel { right: 0; }
  .dp-hd { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .dp-hd .ttl { font-size: 13px; }
  .dp-hd .ttl b { color: #7c5cf6; font-family: Consolas, monospace; }
  .dp-hd .sp { flex: 1; }
  .dp-hd .kbd-hint { font-size: 10.5px; color: var(--ink-3); }
  .dp-hd kbd {
    font: 10px/1 Consolas, monospace; color: var(--ink-2);
    background: #f0f0f3; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 2px 5px;
  }
  .dp-close { border: none; background: none; font-size: 16px; color: var(--ink-2); cursor: pointer; padding: 2px 6px; border-radius: 5px; }
  .dp-close:hover { color: var(--ink); background: #f0f0f3; }
  .dp-tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
  .dp-tab {
    font: inherit; font-size: 12px; color: var(--ink-2);
    border: none; background: none; cursor: pointer;
    padding: 6px 12px; border-radius: 7px 7px 0 0; border-bottom: 2px solid transparent;
  }
  .dp-tab:hover { color: var(--ink); background: #f7f7f8; }
  .dp-tab.active { color: var(--ink); font-weight: 600; border-bottom-color: #7c5cf6; }
  .dp-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; font-size: 12.5px; }
  .dp-sec h4 { font-size: 12px; color: var(--ink-2); font-weight: 700; margin: 14px 0 6px; }
  .dp-sec h4:first-child { margin-top: 0; }
  .dp-kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; }
  .dp-kv dt { color: var(--ink-2); }
  .dp-kv dd { font-variant-numeric: tabular-nums; }
  .dp-tool {
    width: 100%; text-align: left; font: inherit; font-size: 12.5px;
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 8px; background: #fafafa;
    padding: 9px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .dp-tool:hover { border-color: #c9c9cf; }
  .dp-tool.on { border-color: #ff7a45; background: #fff7f3; }
  .dp-tool .st { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--ink-3); }
  .dp-tool.on .st { color: #ff7a45; }
  .dp-tool kbd {
    font: 10px/1 Consolas, monospace; color: var(--ink-2);
    background: #f0f0f3; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 2px 5px;
  }
  .dp-note { font-size: 11.5px; color: var(--ink-2); line-height: 1.6; }
  .dp-note code {
    font: 11px/1.5 Consolas, monospace; color: #444;
    background: #f0f0f3; border-radius: 4px; padding: 1px 5px; word-break: break-all;
  }
  .dp-json { font: 10.5px/1.6 Consolas, monospace; color: #444; background: #f6f6f8; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; }

  ::selection { background: rgba(245,197,24,0.4); }
</style>
</head>

</aside>

<div id="dp-ov"></div>

/* ================= 工具函数 ================= */

function vNum(v) { return parseInt(v.split(".")[2], 10); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;"); }
function ov() { return document.getElementById("dp-ov"); }

/* ================= 左栏渲染（默认：全部版本全量日志，黄色即我的） ================= */

function renderLog() {
  var list = ENTRIES.slice().sort(function (a, b) { return vNum(b.v) - vNum(a.v); });
  if (state.onlyMine) list = list.filter(function (e) { return e.mine; });

  var byVer = {};
  list.forEach(function (e) { (byVer[e.v] = byVer[e.v] || []).push(e); });
  var vers = Object.keys(byVer).sort(function (a, b) { return vNum(b) - vNum(a); });

  var html = "";
  if (!vers.length) html = '<div class="empty-note">当前过滤下没有条目。</div>';
  vers.forEach(function (v) {
    var items = byVer[v];
    var mineCount = items.filter(function (e) { return e.mine; }).length;
    html += '<section class="ver-sec" id="ver-' + v + '">';
    html += '<div class="ver-head"><span class="vn">v' + v + '</span>' +
            (mineCount ? '<span class="vm">我的 ' + mineCount + ' 条</span>' : '') +
            '<span class="cnt">' + items.length + ' 条</span></div>';
    GROUPS.forEach(function (g) {
      var gi = items.filter(function (e) { return e.group === g.key; });
      if (!gi.length) return;
      html += '<div class="grp"><div class="grp-title">' + g.label + " " + gi.length + '</div>';
      gi.forEach(function (e) {
        var cls = "entry" + (e.mine ? " lvl-" + e.mine.level : "");
        var tag = e.mine ? '<span class="lvl-tag ' + e.mine.level + '">' + e.mine.level + '</span>' : "";
        var tip = e.mine ? ' title="' + esc(e.mine.form) + '"' : "";
        var anchor = (e.mine && e.mine.issue) ? ' id="entry-' + e.mine.issue + '"' : "";
        html += '<div class="' + cls + '"' + anchor + tip + '><span class="dot"></span><span class="txt">' + esc(e.zh) + '</span>' + tag + '<span class="ver">v' + e.v + '</span></div>';
      });
      html += '</div>';
    });
    html += '</section>';
  });
  document.getElementById("log").innerHTML = html;
  if (dpState.boxes) redrawBoxes();
}

/* ================= 红框定位（fixed overlay + rect 跟随滚动，恒泰悦居 flash 模式） ================= */

function flashRect(el, label) {
  var layer = ov();
  var f = document.createElement("div");
  f.className = "fl";
  f.innerHTML = '<span>' + esc(label) + '</span>';
  layer.appendChild(f);
  var t0 = performance.now();
  function tick(now) {
    if (!document.contains(el)) { f.remove(); return; }
    var r = el.getBoundingClientRect();
    f.style.left = (r.left - 4) + "px";
    f.style.top = (r.top - 4) + "px";
    f.style.width = (r.width + 8) + "px";
    f.style.height = (r.height + 8) + "px";
    if (now - t0 < 1700) {
      requestAnimationFrame(tick);
    } else {
      f.style.opacity = "0";
      f.style.transition = "opacity 0.25s";
      setTimeout(function () { f.remove(); }, 300);
    }
  }
  requestAnimationFrame(tick);
}

function locateIssue(n) {
  state.activeIssue = n;
  document.querySelectorAll(".issue-card").forEach(function (c) {
    c.classList.toggle("active", parseInt(c.getAttribute("data-issue"), 10) === n);
  });

  var info = null, entry = null;
  ISSUES.forEach(function (i) { if (i.n === n) info = i; });
  ENTRIES.forEach(function (e) { if (e.mine && e.mine.issue === n) entry = e; });

  if (info && info.level === "S") { showBanner(n); return; }
  if (!entry) return;

  /* 仅看我的模式下条目必然在；否则确保渲染后取元素 */
  var el = document.getElementById("entry-" + n);
  if (!el) { renderLog(); el = document.getElementById("entry-" + n); }
  if (!el) return;

  el.scrollIntoView({ behavior: "smooth", block: "center" });
  flashRect(el, "#" + n + " · " + entry.mine.level + " 级");
}

/* ---- 检查模式（Alt+I）：橙框跟随 hover ---- */
var hv = null;
function dpSetInsp(on) {
  dpState.insp = on;
  document.body.classList.toggle("dp-insp", on);
  if (!on && hv) { hv.style.display = "none"; }
}
function matchEntry(el) {
  var t = el && el.closest ? el.closest(".entry, .issue-card") : null;
  if (!t) return null;
  if (t.classList.contains("entry")) {
    var id = t.id || "";
    if (id.indexOf("entry-") === 0) {
      var n = parseInt(id.slice(6), 10);
      if (!isNaN(n)) {
        var e = ENTRIES.filter(function (x) { return x.mine && x.mine.issue === n; })[0];
        if (e) return { label: "#" + n + " · " + e.mine.level + " 级 · " + e.mine.form.slice(0, 42), el: t };
      } else {
        var e2 = ENTRIES.filter(function (x) { return x.mine && !x.mine.issue; })[0];
        if (e2) return { label: "我方条目（无 issue 号）· " + e2.mine.level + " 级", el: t };
      }
    }
    return { label: "非我方条目", el: t };
  }
  var m = parseInt(t.getAttribute("data-issue"), 10);
  var i = ISSUES.filter(function (x) { return x.n === m; })[0];
  return i ? { label: "#" + i.n + " · " + i.level + " 级 · " + i.name, el: t } : null;
}
document.addEventListener("mousemove", function (ev) {
  if (!dpState.insp || dpInPanel(ev.target)) return;
  var m = matchEntry(ev.target);
  var layer = ov();
  if (!m) { if (hv) hv.style.display = "none"; return; }
  if (!hv) { hv = document.createElement("div"); hv.className = "hv"; layer.appendChild(hv); }
  var r = m.el.getBoundingClientRect();
  hv.style.cssText = "display:block;left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px";
  hv.innerHTML = "<span>" + esc(m.label) + "</span>";
});
function dpInPanel(t) { return t && t.closest && t.closest(".devpanel, .topbar, .fab"); }

/* ---- 成就边界（Alt+B）：全部我的条目画黄框，滚动/换页重算 ---- */
function dpSetBoxes(on) {
  dpState.boxes = on;
  redrawBoxes();
}
function redrawBoxes() {
  var layer = ov();
  Array.prototype.forEach.call(layer.querySelectorAll(".bx"), function (x) { x.remove(); });
  if (!dpState.boxes) return;
  ENTRIES.forEach(function (e) {
    if (!e.mine) return;
    var el = document.getElementById("entry-" + e.mine.issue);
    if (!el) return;
    var r = el.getBoundingClientRect();
    if (r.bottom < 47 || r.top > innerHeight || !r.width) return;
    var d = document.createElement("div");
    d.className = "bx";
    d.style.cssText = "left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px";
    d.innerHTML = "<span>#" + e.mine.issue + "</span>";
    layer.appendChild(d);
  });
}
window.addEventListener("scroll", redrawBoxes, { passive: true });
window.addEventListener("resize", redrawBoxes);

document.addEventListener("keydown", function (ev) {
  var tag = (ev.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (ev.key === "`") { ev.preventDefault(); dpToggle(); }
  if (ev.altKey && (ev.key === "i" || ev.key === "I")) { ev.preventDefault(); dpSetInsp(!dpState.insp); if (dpState.open && dpState.tab === "tools") dpRenderBody(); }
  if (ev.altKey && (ev.key === "b" || ev.key === "B")) { ev.preventDefault(); dpSetBoxes(!dpState.boxes); if (dpState.open && dpState.tab === "tools") dpRenderBody(); }
});
