  .dropdown-item {

  { n: 2879, name: "RTK 关闭语义",                            v: "0.1.2258", level: "A" },

  { n: 3747, name: "计划密钥额度窗口按 key 调用计算",         v: "0.1.2289", level: "S" },
  { n: 3985, name: "Responses 流参数增量归属",                v: "0.1.2215", level: "S" }
];

/* S 级悬置详情（对照档 §9.2） */
var SUSPENDED = {
  3747: { msg: "#3747 已随 v0.1.2289 收编，条目待官方 release notes 补列",
          link: "https://github.com/yetone/magpie-releases/releases/tag/v0.1.2289",
          linkText: "查看 v0.1.2289 release",
          form: "署名：\"Ported from gua2100's branch hunt91-l3-3747-key-card as written, reviewed line by line\" + Co-authored-by" },
  3985: { msg: "#3985 已随 v0.1.2215 收编，该版本无 release notes（跳版直发 2216），条目缺位",
          link: "https://github.com/yetone/magpie/issues/3985",
          linkText: "查看 issue #3985",
          form: "署名：author 保留" }
};

var GROUPS = [
  { key: "feat", label: "新功能" },
  { key: "imp",  label: "改进" },
  { key: "fix",  label: "错误修复" }
];

/* 五档过滤（真实过滤，按版本号数值比较） */
var LATEST = 2288, SINCE = 2278;
var FILTERS = [
  { key: "since", label: "上次更新以来",             menu: "上次更新以来",                    min: SINCE },
  { key: "f10",   label: "当前版本及之前 10 个版本",  menu: "当前版本及之前 10 个版本",         min: LATEST - 9 },
  { key: "f20",   label: "当前版本及之前 20 个版本",  menu: "当前版本及之前 20 个版本",         min: LATEST - 19 },
  { key: "f50",   label: "当前版本及之前 50 个版本",  menu: "当前版本及之前 50 个版本",         min: LATEST - 49 },
  { key: "f100",  label: "当前版本及之前 100 个版本", menu: "当前版本及之前 100 个版本",        min: LATEST - 99 },
  { key: "all",   label: "全部数据",                 menu: "全部数据（含 2189 之前的历史条目）", min: 0 }
];

function vNum(v) { return parseInt(v.split(".")[2], 10); }
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;"); }
function filterBy(key) {
  var f = FILTERS.find(function (x) { return x.key === key; });
  return ENTRIES.filter(function (e) { return vNum(e.v) >= f.min && vNum(e.v) <= LATEST; });
}

var state = { filter: "since", activeIssue: null };

/* ================= 左栏渲染 ================= */

function renderLog() {
  var list = filterBy(state.filter);
  var f = FILTERS.find(function (x) { return x.key === state.filter; });
  var html = "";

  var versions = {};
  list.forEach(function (e) { versions[e.v] = true; });
  var keys = Object.keys(versions).sort(function (a, b) { return vNum(b) - vNum(a); });
  var rangeTxt = keys.length ? ("v0.1." + keys[keys.length - 1].split(".")[2] + " – v0.1." + keys[0].split(".")[2]) : "无条目";
  html += '<div class="meta">' + keys.length + ' 个版本 · ' + rangeTxt + (state.filter === "all" ? " · 已自动扩展" : "") + '</div>';

  if (state.filter === "since") {
    var hasMine = list.some(function (e) { return e.mine; });
    if (!hasMine) {
      html += '<div class="empty-note">当前窗口（v0.1.2278 – v0.1.2288）没有属于 ggbdpq 的条目：这是诚实空窗。切换上方档位下拉，或点击右侧任一 issue 查看历史收编。</div>';
    }
  }

  GROUPS.forEach(function (g) {
    var items = list.filter(function (e) { return e.group === g.key; });
    if (!items.length) return;
    html += '<div class="group-title">' + g.label + " " + items.length + '</div>';
    items.forEach(function (e) {
      var cls = "entry" + (e.mine ? " lvl-" + e.mine.level : "");
      var tag = e.mine ? '<span class="lvl-tag ' + e.mine.level + '">' + e.mine.level + '</span>' : "";
      var tip = e.mine ? ' title="' + esc(e.mine.form) + '"' : "";
      var anchor = e.mine ? ' id="entry-' + e.mine.issue + '"' : "";
      html += '<div class="' + cls + '"' + anchor + tip + '><span class="dot"></span><span class="txt">' + esc(e.zh) + '</span>' + tag + '<span class="ver">v' + e.v + '</span></div>';
    });
  });

  var log = document.getElementById("log");
  log.innerHTML = html;
  log.scrollTop = 0;
}

/* ================= 下拉 ================= */

function renderMenu() {
  var menu = document.getElementById("dropdownMenu");
  var html = "";
  FILTERS.forEach(function (f) {
    /* 'all' 只在被动触发（自动定位）或当前选中时出现在菜单里 */
    if (f.key === "all" && f.key !== state.filter && !state.allUsed) return;
    html += '<div class="dropdown-item' + (state.filter === f.key ? " active" : "") + '" role="option" data-key="' + f.key + '"><span class="check">✓</span>' + f.menu + '</div>';
  });
  menu.innerHTML = html;
  menu.querySelectorAll(".dropdown-item").forEach(function (item) {
    item.addEventListener("click", function () {
      setFilter(item.getAttribute("data-key"));
      closeDropdown();
    });
  });
}

function setFilter(key) {
  state.filter = key;
  if (key === "all") state.allUsed = true;
  var f = FILTERS.find(function (x) { return x.key === key; });
  document.getElementById("dropdownLabel").textContent = f.label;
  renderMenu();
  renderLog();
}

function closeDropdown() {
  document.getElementById("dropdown").classList.remove("open");
  document.getElementById("dropdownBtn").setAttribute("aria-expanded", "false");
}

/* ================= 右栏 issue 列表 ================= */

var LINK_SVG = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2h5.5v5.5M10 2 2.5 9.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderIssues() {
  var box = document.getElementById("issues");
  var html = "";
  ["A", "B", "C", "S"].forEach(function (lvl) {
    var items = ISSUES.filter(function (i) { return i.level === lvl; });
    if (!items.length) return;
    html += '<div class="issue-group-label">' + lvl + ' 级 · ' + items.length + ' 单</div>';
    items.forEach(function (i) {
      html += '<button class="issue-card" data-issue="' + i.n + '">' +
        '<span class="issue-num">#' + i.n + '</span>' +
        '<span class="issue-name">' + esc(i.name) + '</span>' +
        '<span class="issue-ver">v' + i.v + '</span>' +
        '<span class="issue-lvl ' + i.level + '">' + i.level + '</span>' +
        '<a class="issue-link" href="https://github.com/yetone/magpie/issues/' + i.n + '" target="_blank" rel="noopener" title="在 GitHub 打开 #' + i.n + '" aria-label="在 GitHub 打开 issue ' + i.n + '">' + LINK_SVG + '</a>' +
        '</button>';
    });
  });
  box.innerHTML = html;
  box.querySelectorAll(".issue-card").forEach(function (card) {
    card.addEventListener("click", function (ev) {
      if (ev.target.closest(".issue-link")) return; /* 外链直达，不触发定位 */
      locateIssue(parseInt(card.getAttribute("data-issue"), 10));
    });
  });
}

/* ================= 定位 / 脉冲 / 悬置提示条 ================= */

function showBanner(n) {
  var s = SUSPENDED[n];
  if (!s) return;
  var slot = document.getElementById("bannerSlot");
  slot.innerHTML =
    '<div class="banner" role="status">' +
    '<div>' + esc(s.msg) + '。<span style="color:var(--ink-2)">' + esc(s.form) + '</span> ' +
    '<a href="' + s.link + '" target="_blank" rel="noopener">' + esc(s.linkText) + ' ↗</a></div>' +
    '<button class="banner-close" aria-label="关闭提示条">×</button>' +
    '</div>';
  slot.querySelector(".banner-close").addEventListener("click", function () { slot.innerHTML = ""; });
}

function locateIssue(n) {
  state.activeIssue = n;
  document.querySelectorAll(".issue-card").forEach(function (c) {
    c.classList.toggle("active", parseInt(c.getAttribute("data-issue"), 10) === n);
  });

  var suspended = ISSUES.some(function (i) { return i.n === n && i.level === "S"; });
  if (suspended) { showBanner(n); return; }

  var entry = ENTRIES.find(function (e) { return e.mine && e.mine.issue === n; });
  if (!entry) return;

  /* 不在当前窗口 → 自动切到含它的最小档位；没有档位含它 → 扩展为全部数据 */
  var visible = filterBy(state.filter).some(function (e) { return e.mine && e.mine.issue === n; });
  if (!visible) {
    var target = null;
    for (var i = 0; i < FILTERS.length; i++) {
      var f = FILTERS[i];
      if (f.key === "all") continue;
      if (vNum(entry.v) >= f.min) { target = f.key; break; }
    }
    setFilter(target || "all");
  }

  requestAnimationFrame(function () {
    var el = document.getElementById("entry-" + n);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.remove("pulse");
    void el.offsetWidth; /* 重启动画 */
    el.classList.add("pulse");
    setTimeout(function () { el.classList.remove("pulse"); }, 1600);
  });
}

/* ================= 关闭（重置滚动与高亮） ================= */

function resetAll() {
  document.getElementById("bannerSlot").innerHTML = "";
  state.activeIssue = null;
  document.querySelectorAll(".issue-card").forEach(function (c) { c.classList.remove("active"); });
  setFilter("since");
}

/* ================= 事件接线 ================= */

document.getElementById("dropdownBtn").addEventListener("click", function (ev) {
  ev.stopPropagation();
  var dd = document.getElementById("dropdown");
  dd.classList.toggle("open");
  this.setAttribute("aria-expanded", dd.classList.contains("open") ? "true" : "false");
});
document.addEventListener("click", function (ev) {
  if (!ev.target.closest("#dropdown")) closeDropdown();
});
document.getElementById("closeBtn").addEventListener("click", resetAll);

/* 初始化 */
renderMenu();
renderIssues();
renderLog();

/* 深链：#f100 直达档位，#i-3835 直达某单（含悬置提示条） */
(function () {
  var h = location.hash.replace("#", "");
  if (/^f(\d+|100)$/.test(h)) { setFilter(h); return; }
  if (h.indexOf("i-") === 0) {
    var n = parseInt(h.slice(2), 10);
    if (ISSUES.some(function (i) { return i.n === n; })) locateIssue(n);
  }
})();
</script>
