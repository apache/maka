futures-util.workspace = true
jsonschema.workspace = true
maka-client-capability.workspace = true
maka-runtime.workspace = true
maka-plugins.workspace = true
maka-graph.workspace = true
maka-scheduler.workspace = true
jiff = "0.2.37"
maka-skills.workspace = true
maka-goal.workspace = true
maka-background-health.workspace = true
maka-session-recap.workspace = true
maka-jev.workspace = true
maka-web.workspace = true
maka-insights.workspace = true
maka-session-import.workspace = true
maka-event-log.workspace = true
maka-external-agent.workspace = true
maka-config.workspace = true
maka-js-runtime.workspace = true
maka-tools.workspace = true
maka-fs-tools.workspace = true
maka-process.workspace = true
maka-sandbox.workspace = true
maka-model.workspace = true
maka-network.workspace = true
reqwest.workspace = true
