[package]
name = "maka-cli"
default-run = "maka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "maka"
path = "src/main.rs"

# Internal Windows service entry; the public console command remains `maka`.
[[bin]]
name = "maka-service"
path = "src/service_main.rs"
test = false

[dependencies]
maka-acp.workspace = true
maka-client.workspace = true
maka-config.workspace = true
maka-tui.workspace = true
base64 = "0.22"
clap.workspace = true
flate2 = "1"
reqwest.workspace = true
semver = "1"
tar = { version = "0.4.46", default-features = false }
maka-runtime-host.workspace = true
maka-runtime.workspace = true
maka-event-log.workspace = true
maka-protocol.workspace = true
maka-transport.workspace = true
maka-js-runtime.workspace = true
maka-process.workspace = true
maka-sandbox.workspace = true
maka-fs-tools.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true, features = ["io-util"] }
uuid.workspace = true
tempfile.workspace = true

[dev-dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
maka-plugins.workspace = true
unicode-width.workspace = true
libc.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Debug", "Win32_System_StationsAndDesktops", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
