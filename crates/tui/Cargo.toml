[package]
name = "maka-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
apply-patch.workspace = true
base64 = "0.22.1"
chrono = { workspace = true, features = ["clock"] }
uuid.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true
maka-client.workspace = true
maka-event-log.workspace = true
maka-protocol.workspace = true
maka-plugins.workspace = true
maka-runtime.workspace = true
maka-skills.workspace = true
maka-sandbox.workspace = true
ratatui.workspace = true
# Level-triggered Unix input retains unread keys when SIGWINCH is also ready.
# The default mio source can return a resize while dropping the other readiness.
crossterm = { workspace = true, features = ["use-dev-tty"] }
futures-util.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
libc.workspace = true
similar = "3.2.0"
unicode-segmentation.workspace = true
unicode-width.workspace = true
pulldown-cmark.workspace = true
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
